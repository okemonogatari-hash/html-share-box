:root{--y:#ffd92e;--r:#e02a1f;--b:#1c4fb8;--ink:#2a1a12;--paper:#fffdf3}
*{box-sizing:border-box}
html{background:var(--y);color-scheme:light}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);line-height:1.9;font-size:17px;
 background:repeating-conic-gradient(from 0deg at 50% 300px,#ffd92e 0 8deg,#ffc400 8deg 16deg) fixed}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 56px}

h1{font-size:clamp(28px,7vw,50px);line-height:1.25;margin:22px 0 16px;text-align:center;color:var(--r);font-weight:900;

video{display:block;width:100%;height:auto;background:#000;border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink)}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:18px 20px;margin:22px 0;box-shadow:6px 6px 0 var(--ink)}
.card p{margin:0 0 10px}
.btn{display:block;text-align:center;background:var(--r);color:#fff;font-weight:900;text-decoration:none;padding:14px 16px;border:4px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);font-size:18px;line-height:1.5}
.small{font-size:13px;color:#4a3a2a;text-align:center;line-height:1.8;background:rgba(255,253,243,.85);border-radius:12px;padding:12px;margin-top:22px}

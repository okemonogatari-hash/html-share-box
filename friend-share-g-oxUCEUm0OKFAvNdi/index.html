<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta property="og:title" content="10/16 新宿西口 経営者オフ会｜12人の30秒紹介ムービー">
<meta property="og:description" content="1人ずつ、ちがう番組になっています。自分のページから保存・シェアできます🎉">
<meta property="og:url" content="https://okemonogatari-hash.github.io/html-share-box/friend-share-g-oxUCEUm0OKFAvNdi/">
<meta property="og:image" content="https://okemonogatari-hash.github.io/html-share-box/friend-share-g-oxUCEUm0OKFAvNdi/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>10/16 新宿西口 経営者オフ会｜12人の30秒紹介ムービー</title>
<style>
  :root { color-scheme: light; --ink: #1d2433; --sub: #5a6275; --bg: #FFF9EE; --card: #FFFFFF; --acc: #FFD21F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; }
  header { padding: 28px 16px 8px; text-align: center; }
  header .tag { display: inline-block; background: var(--ink); color: #fff; border-radius: 99px; padding: 6px 16px; font-size: 13px; letter-spacing: .05em; }
  h1 { font-size: 26px; margin: 14px 0 6px; line-height: 1.35; }
  header p { margin: 0 auto; max-width: 520px; color: var(--sub); font-size: 14px; line-height: 1.7; }
  nav { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px; position: sticky; top: 0; background: rgba(255,249,238,.94); backdrop-filter: blur(6px); z-index: 2; }
  nav a { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 99px; padding: 4px 12px 4px 4px; font-size: 14px; font-weight: 700; }
  nav img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  main { max-width: 560px; margin: 0 auto; padding: 8px 16px 60px; }
  section { background: var(--card); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink); padding: 16px; margin: 22px 0 30px; scroll-margin-top: 70px; }
  .who { display: flex; align-items: center; gap: 12px; }
  .who img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid var(--ink); }
  .who .n { font-size: 12px; color: var(--sub); }
  .who h2 { font-size: 20px; margin: 2px 0 0; }
  .hook { margin: 12px 0 10px; font-size: 18px; font-weight: 800; background: linear-gradient(transparent 60%, var(--acc) 60%); display: inline; line-height: 1.8; }
  video { width: 100%; aspect-ratio: 9 / 16; border-radius: 16px; background: #222; display: block; margin-top: 12px; }
  .talk { margin-top: 12px; background: #FFF6C9; border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.6; }
  .talk b { display: block; font-size: 12px; color: var(--sub); }
  .from { font-size: 12px; color: var(--sub); margin-top: 8px; }
  .grp { margin: 30px 0 4px; display: flex; align-items: baseline; gap: 10px; }
  .grp h3 { margin: 0; font-size: 20px; }
  .grp span { color: var(--sub); font-size: 13px; }
  .play { position: relative; display: block; width: 100%; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; margin-top: 12px; border: 0; padding: 0; background: #222; cursor: pointer; }
  .play img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play i { position: absolute; left: 50%; top: 66%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: rgba(255,210,31,.95); border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
  .play i::after { content: ""; position: absolute; left: 34px; top: 24px; border-left: 34px solid var(--ink); border-top: 21px solid transparent; border-bottom: 21px solid transparent; }
  .play b { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #fff; font-size: 15px; text-shadow: 0 1px 4px #000; }
  .soon { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .soon div { display: flex; align-items: center; gap: 6px; background: #fff; border: 2px dashed #b9bfcc; border-radius: 99px; padding: 4px 12px 4px 4px; font-size: 14px; color: var(--sub); }
  .soon img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .own { display: block; margin-top: 12px; text-align: center; font-size: 17px; font-weight: 800; color: var(--ink); text-decoration: none; background: var(--acc); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); padding: 13px 8px; }
  .own small { font-size: 13px; font-weight: 700; }
  .cpb { display: block; width: 100%; margin-top: 12px; text-align: center; font: inherit; font-size: 17px; font-weight: 800; color: #fff; background: #1d2433; border: 0; border-radius: 14px; padding: 14px 8px; cursor: pointer; }
  .okm { min-height: 1em; margin-top: 6px; text-align: center; font-size: 14px; font-weight: 800; color: #C0392B; }
  .own { font-size: 15px !important; padding: 10px 8px !important; }
  footer { text-align: center; color: var(--sub); font-size: 12px; padding: 0 16px 40px; }
</style>
</head>
<body>
<header>
  <span class="tag">10/16（金）新宿西口 経営者オフ会</span>
  <h1>はじめまして、を<br>30秒で楽しく。</h1>
  <p>今日のみなさん12人を、リベのプロフィールから1人30秒の「番組」にしました。1人ずつ、ちがう番組です。<b>自分のカードの「🔗 リンクをコピー」で、自分のページのリンクをコピーできます。</b>絵はChatGPT、台本はGemini、声はGeminiの声、動きと音はClaude。音が出ます🔊</p>
</header>
<nav id="nav"></nav>
<main id="list"></main>
<footer>from おけもん 🦫 ＆ AIの仲間たち</footer>
<script>
// 動画ができた人（publish_add.sh が1人ずつ足す）
window.LINKS = {"wassy": "friend-share-g-gpovANXw84td2vri", "nezuhana": "friend-share-g-m1tOrWfHaN1BeFyT", "hiit": "friend-share-g-SItdr6oCyPqAEiVK", "tatsuya": "friend-share-g-Bx3XwsPAogy03WMu", "mecha": "friend-share-g-WaCIMaAwEnE0uVUf", "miacchi": "friend-share-g-5QKz1W5kby1eKPMD", "chii": "friend-share-g-3k4PAgR6PVHZAhzC", "hitomimi": "friend-share-g-CGEqU5tPoKLUBdbv", "kyojiro": "friend-share-g-m9COJGGA1bJVxX3n", "molly": "friend-share-g-kaWMGNgoVwOX8RDJ", "ohagi": "friend-share-g-6BGFw7llZGevu90k", "hamu": "friend-share-g-BCPP1GHai4qJmZLy"};
window.DONE = ['wassy', 'nezuhana', 'hiit', 'tatsuya', 'mecha', 'miacchi', 'chii', 'hitomimi', 'kyojiro', 'molly', 'ohagi', 'hamu'];
const P = [
  { k: 'wassy', name: 'AIわっしー', g: 1, n: 1, tag: '📺 深夜のテレビ通販', hook: '本日の特選品は、新宿オフィスを巣立つ鷲。', talk: '「住んでる鷲」から「巣立つ鷲」へ。どこへ飛ぶの？' },
  { k: 'nezuhana', name: 'ねずはな', g: 2, n: 2, tag: '🤫 ASMR……と思いきや', hook: 'しーっ。静かな工房です。……最初だけは。', talk: 'ミニチュアのパフェ、1個つくるのに何時間かかるの？' },
  { k: 'hiit', name: 'HIIT', g: 2, n: 3, tag: '🎬 ドキュメンタリーの予告', hook: '午前4時。社長は、眠っている。', talk: '朝4時の報告、AI社員は何を見て書いてるの？' },
  { k: 'tatsuya', name: 'タツヤ', g: 2, n: 4, tag: '❓ クイズ番組', hook: '第1問。火おこし検定3級を持つのは、どんな人？', talk: '静岡の民泊、どんな物件を狙ってる？' },
  { k: 'mecha', name: 'メカバイオ', g: 3, n: 5, tag: '🏟️ スタメン発表', hook: '本日の、主催！ 背番号16！', talk: '毎朝4:50、続けられる秘訣は？' },
  { k: 'miacchi', name: 'みあっち', g: 4, n: 6, tag: '📖 飛び出す絵本', hook: 'ページをめくると、三姉妹のママ。', talk: '3時起きの朝活、最初の1時間は何してる？' },
  { k: 'chii', name: 'ちーちゃん', g: 4, n: 7, tag: '🧸 おもちゃのCM', hook: 'ちーちゃんフィギュア、新発売！', talk: '保育士の10年、SNSの仕事で生きてることある？' },
  { k: 'hitomimi', name: 'ひとみみ', g: 4, n: 8, tag: '⏳ ローディング画面', hook: 'NOW LOADING… 叶えた夢を読み込み中。', talk: 'Claude Code、家のことは何を任せてる？' },
  { k: 'kyojiro', name: 'きょじろ', g: 4, n: 9, tag: '🎮 格闘ゲーム', hook: '2023年の自分 vs 2026年の自分。', talk: 'クロコに、次は何を任せたい？' },
  { k: 'molly', name: 'モーリー', g: 4, n: 10, tag: '🎞️ レッドカーペット生中継', hook: '今、赤じゅうたんに到着しました！', talk: 'VRで、介護の現場に何ができそう？' },
  { k: 'ohagi', name: 'おはぎ丸飲み', g: 4, n: 11, tag: '🎤 一問一答インタビュー', hook: 'お名前は？「おはぎ。」ご職業は？「おはぎ。」', talk: '電脳せどり、最初の0→1は何だった？' },
  { k: 'hamu', name: 'はむ', g: 4, n: 12, tag: '🏠 劇的ビフォーアフター', hook: 'なんということでしょう。', talk: 'いちばん大変だった修繕は？' },
].filter((p) => window.DONE.includes(p.k));
// まだ動画がない人（できたら上の P へ移す）
const SOON = [['miacchi', 'みあっち'], ['chii', 'ちーちゃん'], ['hitomimi', 'ひとみみ'], ['kyojiro', 'きょじろ'], ['molly', 'モーリー'], ['ohagi', 'おはぎ丸飲み'], ['hamu', 'はむ']].filter(([k]) => !window.DONE.includes(k));
const G = { 1: ['班1', '1回目 10:10〜 同じ班'], 2: ['班2', '2回目 11:05〜 同じ班'], 3: ['主催', '今日の会をつくってくれた人'], 4: ['ほか', '休憩・終わったあとに'] };
const nav = document.getElementById('nav'), list = document.getElementById('list');
const card = (p) => `<section id="${p.k}">
    <div class="who"><img src="${p.k}.jpg" alt=""><div><div class="n">${p.n} / 12 ・ ${p.tag}</div><h2>${p.name}さん</h2></div></div>
    <p class="hook">${p.hook}</p>
    <button class="play" data-k="${p.k}" aria-label="${p.name}さんの動画を再生"><img src="${p.k}_poster.jpg" alt="" loading="lazy"><i></i><b>タップで再生（30秒・音あり🔊）</b></button>
    <button class="cpb" type="button" data-k="${p.k}" data-href="../${window.LINKS[p.k]}/">🔗 ${p.name}さんのページのリンクをコピー</button>
    <div class="okm" id="ok-${p.k}"></div>
    <a class="own" href="../${window.LINKS[p.k]}/">${p.name}さんのページを開く</a>
  </section>`;
// 主催を先頭に、そのあと全員（チャット全体に見せる並び）
const ORDER = [P.find((p) => p.k === 'mecha'), ...P.filter((p) => p.k !== 'mecha')].filter(Boolean);
ORDER.forEach((p, i) => { p.n = i + 1; });
list.insertAdjacentHTML('beforeend', `<div class="grp"><h3>主催</h3><span>今日の会をつくってくれた人</span></div>` + card(ORDER[0]));
list.insertAdjacentHTML('beforeend', `<div class="grp"><h3>参加したみなさん</h3><span>自分のカードを探してね</span></div>` + ORDER.slice(1).map(card).join(''));
ORDER.forEach((p) => nav.insertAdjacentHTML('beforeend', `<a href="#${p.k}"><img src="${p.k}.jpg" alt="">${p.name}</a>`));

// 各自のページの「文とリンク」を先に読んでおき、まとめページからも1タップでコピーできるように
const TXT = {};
const copyText = async (t) => { try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } };
const prefetch = (k, href) => fetch(href).then((r) => r.text()).then((h) => { const t = new DOMParser().parseFromString(h, 'text/html').getElementById('t'); if (t) TXT[k] = t.textContent.trim(); }).catch(() => {});
document.addEventListener('click', (e) => {
  const b = e.target.closest('.cpb'); if (!b) return;
  const k = b.dataset.k, t = new URL(b.dataset.href, location.href).href;
  copyText(t); const ok = document.getElementById('ok-' + k); if (ok) ok.textContent = 'リンクをコピーしました';
});
// タップで、その場で動画に差し替えて再生（同時に1本だけ）
document.querySelectorAll('.play').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('video').forEach((v) => v.pause());
  const v = document.createElement('video');
  Object.assign(v, { src: b.dataset.k + '.mp4', poster: b.dataset.k + '_poster.jpg', controls: true, playsInline: true, autoplay: true });
  v.setAttribute('playsinline', ''); b.replaceWith(v); v.play().catch(() => {});
}));
</script>
</body>
</html>

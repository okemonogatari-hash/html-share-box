<style>
  :root { color-scheme: light; --ink: #1d2433; --sub: #5a6275; --bg: #FFF9EE; --acc: #FFD21F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 22px 16px 40px; }
  .to { display: flex; align-items: center; gap: 12px; }
  .to img { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 3px solid var(--ink); }
  .to small { display: block; color: var(--sub); font-size: 13px; }
  .to b { font-size: 21px; }
  .hook { margin: 14px 0 0; font-size: 17px; font-weight: 800; line-height: 1.7; }
  .hook span { background: linear-gradient(transparent 60%, var(--acc) 60%); }
  .stage { position: relative; margin-top: 14px; border-radius: 18px; overflow: hidden; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); background: #222; aspect-ratio: 9 / 16; }
  .stage video, .stage button { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; }
  .stage button { background: #222; cursor: pointer; }
  .stage button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stage button i { position: absolute; left: 50%; top: 64%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: rgba(255,210,31,.96); border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
  .stage button i::after { content: ""; position: absolute; left: 34px; top: 24px; border-left: 34px solid var(--ink); border-top: 21px solid transparent; border-bottom: 21px solid transparent; }
  .stage button em { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #fff; font-style: normal; font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px #000; }
  .btns { display: grid; gap: 10px; margin-top: 22px; }
  .btns a, .btns button { display: block; width: 100%; text-align: center; font-size: 17px; font-weight: 800; padding: 15px 10px; border-radius: 14px; border: 3px solid var(--ink); text-decoration: none; color: var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); cursor: pointer; font-family: inherit; }
  .btns .main { background: var(--acc); }
  .note { margin-top: 10px; color: var(--sub); font-size: 13px; line-height: 1.7; text-align: center; min-height: 1em; }
  .letter { margin-top: 26px; background: #fff; border: 2px dashed #c9bfa8; border-radius: 16px; padding: 16px; font-size: 15px; line-height: 1.85; }
  footer { margin-top: 22px; color: var(--sub); font-size: 12px; line-height: 1.8; text-align: center; }
  footer a { color: var(--sub); }
</style>
</head>
<body>
<main>
  <div class="to"><img src="icon.jpg" alt=""><div><small>10/16 新宿西口 経営者オフ会 ・ 📺 深夜のテレビ通販</small><b>AIわっしーさんへ</b></div></div>
  <p class="hook"><span>本日の特選品は、新宿オフィスを巣立つ鷲。</span></p>
  <div class="stage" id="stage"><button id="play" aria-label="再生"><img src="poster.jpg" alt=""><i></i><em>タップで再生（30秒・音あり🔊）</em></button></div>
  <div class="btns">
    <button class="main" id="share">📤 シェアする（動画ごと送れます）</button>
    <a href="intro.mp4" download="AIわっしーさん_紹介ムービー_20261016.mp4" id="dl">💾 動画を保存する</a>
    <button id="copy">🔗 このページのリンクをコピー</button>
  </div>
  <p class="note" id="note"></p>
  <div class="letter">今日はありがとうございました！<br>AIわっしーさんのプロフィールを読んで、30秒の番組にしてみました。<br>よかったら、自由に保存・シェアしてください🎉<br>— おけもん 🦫</div>
  <footer>絵：ChatGPT ／ 台本と声：Gemini ／ 動きと音：Claude<br>つくった人：<a href="https://libecity.com/user_profile/bsiQxYzfrSXq4NNlOl7IGn35YO13">おけもん（リベシティ）</a></footer>
</main>
<script>
const URL_ = 'https://okemonogatari-hash.github.io/html-share-box/friend-share-g-gpovANXw84td2vri/', TITLE = 'AIわっしーさん 30秒紹介ムービー｜📺 深夜のテレビ通販';
const note = (s) => { document.getElementById('note').textContent = s; };
document.getElementById('play').addEventListener('click', (e) => {
  const v = document.createElement('video');
  Object.assign(v, { src: 'intro.mp4', poster: 'poster.jpg', controls: true, playsInline: true, autoplay: true });
  v.setAttribute('playsinline', ''); e.currentTarget.replaceWith(v); v.play().catch(() => {});
});
document.getElementById('share').addEventListener('click', async () => {
  try {
    const blob = await (await fetch('intro.mp4')).blob();
    const file = new File([blob], 'AIわっしーさん_紹介ムービー_20261016.mp4', { type: 'video/mp4' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: TITLE, text: TITLE }); return; }
    if (navigator.share) { await navigator.share({ title: TITLE, text: TITLE, url: URL_ }); return; }
    await navigator.clipboard.writeText(URL_); note('リンクをコピーしました。好きな所に貼ってね');
  } catch (err) { if (err && err.name !== 'AbortError') note('うまく開けなかったので「動画を保存する」からどうぞ'); }
});
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(URL_); note('リンクをコピーしました'); } catch (e) { note(URL_); }
});
</script>
</body>
</html>

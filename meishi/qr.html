:root{--bg:#ffffff;--ink:#1d2b3a;--ink-soft:#4a5561;--accent:#8a5a2b;--line:#e7dcc4;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);

.who{display:flex;align-items:center;gap:10px}
.who img{width:56px;height:56px}
.name{margin:0;font-size:30px;line-height:1.2;font-weight:800;letter-spacing:.08em}
.real{margin:0;font-size:14px;color:var(--ink-soft)}
.qr{margin:16px 0 10px;width:min(80vw,340px);aspect-ratio:1;padding:0;border:2px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.qr svg{display:block;width:100%;height:100%}
.say{margin:0;font-size:17px;font-weight:800}
.sub{margin:2px 0 0;font-size:14px;color:var(--ink-soft)}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:14px;
  border:1.5px solid var(--line);background:#fbf8f0;color:var(--ink);font:inherit;font-size:14.5px;font-weight:800;text-decoration:none;cursor:pointer}
.btn[hidden]{display:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.tip{margin:14px 0 0;font-size:12.5px;color:var(--ink-soft);max-width:30em}

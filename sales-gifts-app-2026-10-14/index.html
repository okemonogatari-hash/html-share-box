<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>自分らしいギフト探し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 1画面に1つの問い。上に現在地、下に次の一手。庭の絵本の明るい紙の上で進む */
:root {
  color-scheme: light;
  --paper: #F3F6EC;
  --card: #FFFFFF;
  --ink: #22342A;
  --muted: #5B6B5F;
  --line: #DCE4D2;
  --leaf: #2E6A4E;
  --leaf-soft: #E4EFE3;
  --honey: #FFF2D6;
  --honey-ink: #8A5A10;
  --ribbon: #C9506C;
  --ribbon-soft: #FBE8ED;
  --d-exe: #7B2E83; --d-inf: #C46200; --d-rel: #1F67B5; --d-str: #1E8A5A;
  --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.45; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; border-radius: 8px; }
a { color: var(--leaf); }

.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; }

/* 上の現在地 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.back { border: 0; background: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 22px; color: var(--leaf); }
.back:hover { background: var(--leaf-soft); }
.steps { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; min-width: 0; }
.st { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.st i { display: block; height: 5px; border-radius: 3px; background: var(--line); }
.st.done i { background: var(--leaf); }
.st.now i { background: var(--leaf); box-shadow: 0 0 0 2px var(--leaf-soft); }
.st.now { color: var(--leaf); font-weight: 700; }

main { padding-block: 20px 140px; }
.screen { display: flex; flex-direction: column; gap: 20px; animation: in .25s ease; }
@keyframes in { from { transform: translateY(6px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } }

.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.lead { font-size: 17px; }
.small { font-size: 14px; color: var(--muted); }
.hero { border-radius: 18px; overflow: hidden; aspect-ratio: 3/2; max-width: 100%; background: var(--leaf-soft); }
.hero img, .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
h1 { font-size: clamp(26px, 7vw, 34px); }
h2 { font-size: clamp(22px, 5.6vw, 27px); }
h3 { font-size: 17px; }

.path { list-style: none; margin: 0; padding: 16px; display: grid; gap: 10px; background: var(--card); border-radius: 16px; border: 1px solid var(--line); counter-reset: s; }
.path li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; counter-increment: s; }
.path li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--leaf-soft); color: var(--leaf); font-weight: 700; display: grid; place-items: center; font-family: var(--display); }
.path b { display: block; font-family: var(--display); }
.path span { font-size: 14px; color: var(--muted); }

details.fold { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
details.fold summary { cursor: pointer; padding-block: 10px; font-weight: 700; color: var(--leaf); list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.fold summary::after { content: "＋"; }
details.fold[open] summary::after { content: "－"; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold > div { padding-bottom: 14px; display: grid; gap: 10px; font-size: 15px; }

/* ボタン */
.btn { border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 700; font-family: var(--display); font-size: 17px; background: var(--leaf); color: #fff; display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 52px; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.btn.ghost { background: var(--card); color: var(--leaf); border: 1.5px solid var(--leaf); }
.btn.wide { width: 100%; }

/* 下の次の一手 */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .wrap { display: flex; align-items: center; gap: 10px; padding-block: 12px; }
.dock .info { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); }
.dock .info b { color: var(--ink); font-size: 16px; }
.dock .btn { flex: none; }

/* 入口 */
.choice { display: grid; gap: 12px; }
.pick-card { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 18px; padding: 18px; display: grid; gap: 6px; transition: border-color .15s, transform .15s; }
.pick-card:hover { border-color: var(--leaf); transform: translateY(-1px); }
.pick-card .tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--leaf); }
.pick-card h3 { font-size: 20px; }
.pick-card p { font-size: 14px; color: var(--muted); }
.pick-card .go { font-weight: 700; color: var(--leaf); font-size: 14px; }

/* 資質を選ぶ */
.search { width: 100%; font: inherit; font-size: 16px; padding: 12px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
.domain { display: grid; gap: 10px; }
.domain h3 { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.domain h3::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dc); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 9px 14px; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
.chip[aria-pressed="true"] { border-color: var(--dc, var(--leaf)); background: color-mix(in srgb, var(--dc, var(--leaf)) 12%, var(--card)); font-weight: 700; }
.chip .n { width: 20px; height: 20px; border-radius: 50%; background: var(--dc, var(--leaf)); color: #fff; font-size: 12px; display: none; place-items: center; }
.chip[aria-pressed="true"] .n { display: grid; }

.acts { display: grid; gap: 10px; }
.act { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; }
.act .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; color: #fff; font-size: 14px; margin-top: 2px; }
.act[aria-pressed="true"] { border-color: var(--leaf); background: var(--leaf-soft); }
.act[aria-pressed="true"] .box { background: var(--leaf); border-color: var(--leaf); }
.act b { font-weight: 500; display: block; }
.act span { font-size: 13px; color: var(--muted); }

/* 眺める */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tabs .chip { flex: none; }
.gcard { background: var(--card); border-radius: 20px; border: 1px solid var(--line); overflow: hidden; }
.card-img { aspect-ratio: 16/9; max-width: 100%; background: var(--leaf-soft); }
.gbody { padding: 20px; display: grid; gap: 22px; }
.ghead { display: grid; gap: 4px; }
.dtag { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--dc); }
.ghead h2 small { font-family: var(--body); font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.words { font-family: var(--display); font-size: 19px; line-height: 1.7; color: var(--leaf); padding-left: 14px; border-left: 3px solid var(--leaf-soft); }
.sec { display: grid; gap: 8px; }
.sec > h3 { font-size: 13px; letter-spacing: .1em; color: var(--muted); font-family: var(--body); font-weight: 700; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.scene { display: grid; gap: 10px; background: var(--paper); border-radius: 14px; padding: 16px; }
.scene .do { font-weight: 500; }
.bubble { justify-self: start; background: var(--ribbon-soft); color: var(--ink); border-radius: 16px 16px 16px 4px; padding: 8px 14px; font-size: 15px; }
.bubble::before { content: "相手："; font-size: 12px; color: var(--ribbon); font-weight: 700; }
.voice { display: grid; gap: 6px; padding: 14px 0; border-top: 1px dashed var(--line); }
.voice:first-of-type { border-top: 0; padding-top: 0; }
.voice q { font-family: var(--display); font-size: 16px; quotes: "「" "」"; }
.voice p { font-size: 14px; color: var(--muted); }
.voice .g { color: var(--ink); }
details.more summary { cursor: pointer; color: var(--leaf); font-weight: 700; font-size: 14px; padding-block: 6px; }
details.more[open] summary { margin-bottom: 8px; }
details.more .voice:first-of-type { border-top: 1px dashed var(--line); padding-top: 14px; }
.care { display: grid; gap: 8px; font-size: 15px; }
.care p::before { content: "・"; color: var(--muted); }
.ask { background: var(--honey); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.ask .q { font-family: var(--display); font-size: 17px; color: var(--ink); }
.ask label { font-size: 13px; color: var(--honey-ink); font-weight: 700; }
textarea { width: 100%; min-height: 96px; font: inherit; font-size: 16px; line-height: 1.7; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); resize: vertical; }
textarea:focus { border-color: var(--leaf); outline: none; }
.links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.gcard h2.long { font-size: 20px; }
.pager { font-size: 14px; color: var(--muted); text-align: center; }

/* 書く */
.qhead { display: grid; gap: 6px; }
.part { font-size: 12px; letter-spacing: .1em; font-weight: 700; color: var(--ribbon); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 700; }
.memo { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; font-size: 14px; }
.memo b { color: var(--leaf); }
.insert { display: flex; gap: 6px; flex-wrap: wrap; }
.insert button { border: 1px dashed var(--leaf); background: none; color: var(--leaf); border-radius: 999px; padding: 4px 12px; font-size: 13px; min-height: 32px; }

/* まとめ */
.sheet { background: var(--card); border-radius: 20px; border: 1px solid var(--line); padding: 22px 20px; display: grid; gap: 18px; position: relative; }
.sheet::before { content: ""; position: absolute; inset: 0 auto auto 50%; transform: translate(-50%, -50%); width: 64px; height: 18px; border-radius: 4px; background: var(--ribbon-soft); border: 1px solid color-mix(in srgb, var(--ribbon) 30%, transparent); }
.sheet .row { display: grid; gap: 4px; }
.sheet .row h3 { font-size: 13px; color: var(--muted); font-family: var(--body); letter-spacing: .06em; }
.sheet .row p { white-space: pre-wrap; }
.sheet .empty { color: var(--muted); font-size: 14px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tags span { background: var(--leaf-soft); color: var(--leaf); border-radius: 999px; padding: 2px 12px; font-size: 14px; font-weight: 700; }
.row-btns { display: grid; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 20; }
.talk { display: grid; gap: 8px; }
.talk p { font-size: 15px; }
.talk p b { display: inline-block; min-width: 3.5em; color: var(--leaf); font-size: 13px; }
.fine { font-size: 12px; color: var(--muted); line-height: 1.7; }
</style>

<header class="top" id="top" hidden>
  <div class="wrap">
    <button class="back" id="back" aria-label="ひとつ前へ">‹</button>
    <div class="steps" id="steps"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="dock" id="dock" hidden><div class="wrap" id="dockIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script>

祖様を大事にしたい、親戚づきあいもしたい方だという。","gift":"起きたことに意味を見つけて前へ進む捉え方は、失敗を引きずる人の気持ちの切り替え例になるかも。"},{"quote":"出来事に意味付けをしたがる癖はあるんだろうなと思います。怒っちゃったことはなんかいい方に捉えたい","episode":"ある方は、出来事に意味づけをしたがる癖があると話し、腹が立った出来事も、できるだけいい方に捉えたいと考えていた。","gift":"嫌な出来事にも意味を探して受け止める見方は、気持ちの整理に迷う人の視点になるかも。"}],"okemon":"https://okemonogatari-hash.github.io/okemon-strengths-home/trait-unmei.html","gallup":"https://www.gallup.com/cliftonstrengths/en/252197/connectedness-theme.aspx"},{"slug":"seichou","no":"20","domain":"人間関係構築力","ja":"成長促進","en":"Developer","img":"../sales-gifts-2026-10-14/assets/image-20.jpeg","alt":"成長促進のイメージ。仲間が陶芸に取り組み、小さな一歩を一緒に喜ぶ。","core":"人の可能性や小さな進歩を見いだす","words":"誰かが一段のぼった瞬間を、自分のことより喜べる人へ。","essence":"人の小さな伸びに先に気づき、変わった一点を言葉で返す","tsui":"つい、「先週より、ここが良くなってる」と口に出してしまう。言われた側がきょとんとしているのに、見ていたのが自分だけだったと後で気づく。","overdo":"まだ伸びていない人に次々と「次の一歩」を先に置き続け、本人が自分で選ぶ時間を奪ってしまうかも。","differs":"伸びを見つけるとすぐ言葉にしたくなる人もいれば、本人が気づくのを待つ人も。伸ばす相手を一人に絞る人も、広く見る人もいる。","ask":"最近、誰かの小さな伸びに気づいて、それを本人に言葉で渡せたのは、どんな場面でしたか？","care":"育てたい気持ちで課題を決めない。本人が伸ばしたいことを聞く。","cases":[{"setting":"家族・友だち","situation":"子どもが逆上がりを練習して、三回やって三回とも失敗し、落ち込んでいる。","action":"「昨日より足が上がってたよ。そこ、自分でも見えた？」と、一番変わった一点だけを言葉にして、次にどうするかは本人に任せる。","received":"できなかった中にも変化があったと分かって、もう一回やってみるかも。","voice":"えっ、ほんと？　もう一回やってみる"},{"setting":"仕事・お客さん","situation":"新しく入った事務の人が、請求書のエクセルで毎回同じ所で止まっていて、自信をなくしかけている。","action":"「ここまでは自分でできてるね。次の関数のところだけ、一回一緒にやってみよう」と、手は出さずに一手だけ見せて待つ。","received":"自分でできた一手が、次の仕事への自信になったかも。","voice":"あ、ここは自分でできてたんだ。次の関数、お願いします"},{"setting":"地域・趣味・オフ会","situation":"オフ会で初めて絵を描いた人が、「まだ下手だから、見せるのが恥ずかしい」と言っている。","action":"「この前より線が迷わなくなってますよ。次はどこを描いてみたいですか？」と、変わった一点を先に言い、次は本人に選んでもらう。","received":"自分では見えていなかった伸びが言葉になって届いたかも。","voice":"えっ、そう見えてました？　次はこれ描いてみます"}],"voices":[{"quote":"人が成長していく、子供たちが成長していくのがすごい楽しいです","episode":"ある方は、子どもに関わる仕事で、子どもたちが次々と作品を生み出していくのを手助けできることが楽しいと話した。自分が育てている感覚があるという。","gift":"子どもの作品づくりを見守る姿勢は、自信をなくした子が「続けていいんだ」と思える空気になるかも。"},{"quote":"その人のいいところとかを、なんか、見、見れるというか、すぐなんか分かる","episode":"ある方は、人と話すうちに、その人のいいところがすぐ分かると話した。男女に限らず、友達同士でも「こ   </section>`;
  dock(has
    ? `<div class="info"><b>続きがあります</b><br>${n}つ選択中</div><button class="btn ghost" id="reset">最初から</button><button class="btn" id="resume">続きから</button>`
    : `<button class="btn wide" id="go">はじめる</button>`);
  if (has) {
    $("resume").onclick = () => go(Object.keys(S.ans).length ? "work" : "look");
    $("reset").onclick = () => { S = { route:null, picks:[], dpicks:[], i:0, w:0, notes:{}, ans:{}, caseTab:{} }; save(); go("route"); };
  } else $("go").onclick = () => go("route");
}

/* ---------- 入口 ---------- */
function route() {
  $("app").innerHTML = `<section class="screen">
    <p class="eyebrow">STEP 1　入口を選ぶ</p>
    <h2>ストレングスファインダー、<br>受けたことはありますか？</h2>
    <div class="choice">
      <button class="pick-card" data-r="sf"><span class="tag">受けたことがある</span><h3>自分の資質から<br>ギフトの例を見る</h3><p>上位資質や、気になる資質を選びます。TOP5だけ分かる場合も使えます。</p><span class="go">資質を選ぶ →</span></button>
      <button class="pick-card" data-r="daily"><span class="tag">まだ・結果が手元にない</span><h3>ついしてしまうことから<br>才能の種を眺める</h3><p>日常の行動から、思い当たるものを選びます。点数や資質名は出しません。</p><span class="go">行動を選ぶ →</span></button>
    </div>
    <p class="small">どちらから入っても、最後は同じ6つの問いに合流します。あとで入口を変えることもできます。</p>
  </section>`;
  dock(null);
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    if (S.route !== b.dataset.r) { S.route = b.dataset.r; S.i = 0; }
    save(); go("pick");
  });
}

/* ---------- 選ぶ ---------- */
function pick() {
  const sf = S.route === "sf";
  $("app").innerHTML = sf ? `<section class="screen">
    <p class="eyebrow">STEP 2　資質を選ぶ</p>
    <h2>気になる資質を選ぶ</h2>
    <p class="small">上位5つでも、気になる1つでも。選んだ順に眺めます。</p>
    <input class="search" id="q" type="search" placeholder="資質の名前でさがす（例：共感性）" autocomplete="off">
    <div id="list" style="display:grid;gap:22px"></div>
  </section>` : `<section class="screen">
    <p class="eyebrow">STEP 2　行動を選ぶ</p>
    <h2>つい、してしまうことは？</h2>
    <p class="small">思い当たるものを、いくつでも。役に立つ時も、負担になる時もあります。採点には使いません。</p>
    <div class="acts" id="list"></div>
  </section>`;
  const draw = () => {
    if (sf) {
      const q = ($("q")?.value || "").trim();
      $("list").innerHTML = DOMAINS.map(([d]) => {
        const ts = T.filter(t => t.domain === d && (!q || t.ja.includes(q) || t.en.toLowerCase().includes(q.toLowerCase())));
        if (!ts.length) return "";
        return `<div class="domain" style="--dc:${dc(d)}"><h3>${d}</h3><div class="chips">${ts.map(t => {
          const k = S.picks.indexOf(t.slug);
          return `<button class="chip" data-k="${t.slug}" aria-pressed="${k >= 0}"><span class="n">${k + 1}</span>${t.ja}</button>`;
        }).join("")}</div></div>`;
      }).join("") || `<p class="small">「${esc(q)}」に当たる資質がありません。ひらがな・カタカナを変えてみてください。</p>`;
    } else {
      $("list").innerHTML = D.map(d => `<button class="act" data-k="${d.no}" aria-pressed="${S.dpicks.includes(d.no)}"><span class="box">✓</span><div><b>${esc(d.act)}</b><span>${esc(d.burden)}</span></div></button>`).join("");
    }
    $("list").querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      const arr = sf ? S.picks : S.dpicks, k = sf ? b.dataset.k : +b.dataset.k, at = arr.indexOf(k);
      at >= 0 ? arr.splice(at, 1) : arr.push(k);
      S.i = 0; save(); draw(); bar();
    });
  };
  const bar = () => {
    const n = sel().length;
    dock(`<div class="info"><b>${n}つ</b> 選択中${n ? "" : "<br>1つ以上選ぶと進めます"}</div><button class="btn" id="next" ${n ? "" : "disabled"}>ギフトを眺める →</button>`);
    $("next").onclick = () => { S.i = 0; save(); go("look"); };
  };
  if (sf) $("q").oninput = draw;
  draw(); bar();
}

/* ---------- 眺める ---------- */
const voiceHtml = v => `<div class="voice"><q>${esc(v.quote)}</q><p>${esc(v.episode)}</p><p class="g">${esc(v.gift)}</p></div>`;
function look() {
  const list = sel(), sf = S.route === "sf";
  S.i = Math.min(S.i, list.length - 1);
  const k = list[S.i];
  const tabs = `<div class="tabs" role="tablist">${list.map((x, j) => {
    const t = sf ? bySlug[x] : null;
    return `<button class="chip" role="tab" data-j="${j}" aria-pressed="${j === S.i}" style="--dc:${sf ? dc(t.domain) : "var(--leaf)"}">${sf ? t.ja : "行動 " + (j + 1)}</button>`;
  }).join("")}</div>`;
  const note = `<div class="ask"><p class="q">${esc(sf ? bySlug[k].ask : D.find(d => d.no === k).ask)}</p>
    <label for="note-${k}">思い出した場面・心に残ったこと（メモ）</label>
    <textarea id="note-${k}" placeholder="ひとことでも。あとの問いで見返せます">${esc(S.notes[k] || "")}</textarea></div>`;
  let body;
  if (sf) {
    const t = bySlug[k], tab = S.caseTab[k] || 0, c = t.cases[tab];
    body = `<article class="gcard" style="--dc:${dc(t.domain)}">
      <div class="card-img"><img src="../sales-gifts-2026-10-14/${t.img}" alt="${esc(t.alt)}" loading="lazy"></div>
      <div class="gbody">
        <div class="ghead"><span class="dtag">${t.domain}</span><h2>${t.ja}<small>${t.en}</small></h2></div>
        <p class="words">${esc(t.words)}</p>
        <div class="sec"><h3>つい、こんなことをしている</h3><p>${esc(t.tsui)}</p></div>
        <div class="sec"><h3>こんな場面で、ギフトになるかも</h3>
          <div class="seg">${t.cases.map((x, j) => `<button data-c="${j}" aria-pressed="${j === tab}">${x.setting}</button>`).join("")}</div>
          <div class="scene"><p>${esc(c.situation)}</p><p class="do">${esc(c.action)}</p><span class="bubble">${esc(c.voice)}</span><p class="small">${esc(c.received)}</p></div>
        </div>
        ${t.voices.length ? `<div class="sec"><h3>セッションで、こんな声がありました</h3><div>${voiceHtml(t.voices[0])}</div>${t.voices.length > 1 ? `<details class="more"><summary>ほかの声も聞く（${t.voices.length - 1}件）</summary>${t.voices.slice(1).map(voiceHtml).join("")}</details>` : ""}</div>` : ""}
        <div class="sec"><h3>ギフトとして届くために</h3><div class="care"><p>${esc(t.care)}</p><p>${esc(t.overdo)}</p><p>${esc(t.differs)}</p></div></div>
        ${note}
        <div class="links"><a href="${t.okemon}" target="_blank" rel="noopener">おけもんの解説 ↗</a><a href="${t.gallup}" target="_blank" rel="noopener">Gallup公式の定義 ↗</a></div>
      </div></article>`;
  } else {
    const d = D.find(x => x.no === k);
    body = `<article class="gcard"><div class="gbody">
      <div class="ghead"><span class="dtag" style="--dc:var(--leaf)">ついしてしまうこと</span><h2 class="long">${esc(d.act)}</h2><p class="small">${esc(d.burden)}</p></div>
      <div class="sec"><h3>自分の助けになっていることも</h3><p>${esc(d.self)}</p></div>
      <div class="sec"><h3>相手へのギフトになるかも</h3><div class="scene"><p>${esc(d.other)}</p><span class="bubble">${esc(d.voice)}</span></div></div>
      ${note}
      <p class="fine">このリストは CliftonStrengths の簡易診断ではありません。「つい○○する」の言葉のまま眺めてください。</p>
    </div></article>`;
  }
  $("app").innerHTML = `<section class="screen"><p class="eyebrow">STEP 3　ギフトを眺める</p>${list.length > 1 ? tabs : ""}${body}<p class="pager">${S.i + 1} / ${list.length}</p></section>`;
  document.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { S.i = +b.dataset.j; save(); render(); scrollTo(0, 0); });
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { S.caseTab[k] = +b.dataset.c; save(); render(); });
  $("note-" + k).oninput = e => { S.notes[k] = e.target.value; save(); };
  const last = S.i === list.length - 1;
  dock(`${S.i > 0 ? `<button class="btn ghost" id="prev">‹ 前</button>` : ""}<div class="info">${last ? "眺め終わったら" : "次は"}<br><b>${last ? "6つの問いへ" : esc(sf ? bySlug[list[S.i + 1]].ja : "行動 " + (S.i + 2))}</b></div><button class="btn" id="next">${last ? "書きに進む →" : "次へ →"}</button>`);
  if ($("prev")) $("prev").onclick = () => { S.i--; save(); render(); scrollTo(0, 0); };
  $("next").onclick = () => { if (last) { S.w = 0; save(); go("work"); } else { S.i++; save(); render(); scrollTo(0, 0); } };
}

/* ---------- 書く ---------- */
function work() {
  const w = WORK[S.w], sf = S.route === "sf";
  const help = w.help ?? (sf ? "結果の資質と、働いていたかもしれない行動を照らします。経験・技術・関係性・その場の条件も関わります。" : "「つい○○する」の言葉のままで大丈夫。資質名を当てる必要はありません。経験・技術・関係性・その場の条件も関わります。");
  const memos = sel().filter(k => (S.notes[k] || "").trim());
  $("app").innerHTML = `<section class="screen">
    <div class="qhead"><p class="part">${w.part}　${S.w + 1} / 6</p><p class="eyebrow">${w.label}</p><h2>${w.q.replace(" ", "<br>")}</h2><p class="small">${help}</p></div>
    ${w.memo && memos.length ? `<div class="memo"><b>眺めながら書いたメモ</b>${memos.map(k => `<p><b>${esc(sf ? bySlug[k].ja : "行動")}</b>　${esc(S.notes[k])}</p>`).join("")}</div>` : ""}
    ${w.f.map((lab, j) => `<div class="field"><label for="a${S.w}-${j}">${lab}</label>${w.insert && j === 0 ? `<div class="insert">${sel().map(k => `<button data-ins="${esc(sf ? bySlug[k].ja : D.find(d => d.no === k).act)}">＋ ${esc(sf ? bySlug[k].ja : "つい：" + D.find(d => d.no === k).act.slice(0, 14) + "…")}</button>`).join("")}</div>` : ""}<textarea id="a${S.w}-${j}">${esc(S.ans[`${S.w}-${j}`] || "")}</textarea></div>`).join("")}
    ${S.w === 5 ? `<p class="small">「こういう時間を、もう少し増やしてみたい」が一つ持てれば十分です。急いで正解にしなくてかまいません。</p>` : ""}
  </section>`;
  document.querySelectorAll("textarea").forEach(t => t.oninput = () => { S.ans[t.id.slice(1)] = t.value; save(); bar(); });
  document.querySelectorAll("[data-ins]").forEach(b => b.onclick = () => {
    const t = $(`a${S.w}-0`); t.value = (t.value ? t.value.replace(/\s*$/, "、") : "") + b.dataset.ins; t.dispatchEvent(new Event("input"));
  });
  const bar = () => {
    const filled = w.f.some((_, j) => (S.ans[`${S.w}-${j}`] || "").trim());
    const last = S.w === 5;
    dock(`<div class="info">${filled ? "書けたら次へ" : "空欄のままでも<br>進めます"}</div><button class="btn ${filled ? "" : "ghost"}" id="next">${last ? "まとめを見る →" : filled ? "次の問いへ →" : "あとで書く →"}</button>`);
    $("next").onclick = () => { if (last) go("summary"); else { S.w++; save(); render(); scrollTo(0, 0); } };
  };
  bar();
}

/* ---------- まとめ ---------- */
function summary() {
  const sf = S.route === "sf";
  const picked = sel().map(nameOf);
  const rows = WORK.map((w, i) => ({ q: w.q.replace(/\s+/g, ""), a: w.f.map((_, j) => (S.ans[`${i}-${j}`] || "").trim()).filter(Boolean).join("\n") }));
  $("app").innerHTML = `<section class="screen">
    <p class="eyebrow">できあがり</p>
    <h2>わたしのギフト・メモ</h2>
    <div class="sheet">
      <div class="row"><h3>${sf ? "眺めた資質" : "眺めた「つい」"}</h3><div class="tags">${picked.map(p => `<span>${esc(sf ? p : p.slice(0, 18) + (p.length > 18 ? "…" : ""))}</span>`).join("")}</div></div>
      ${rows.map(r => `<div class="row"><h3>${esc(r.q)}</h3>${r.a ? `<p>${esc(r.a)}</p>` : `<p class="empty">まだ空欄（あとで書けます）</p>`}</div>`).join("")}
    </div>
    <div class="row-btns">
      <button class="btn" id="copy">テキストをコピー</button>
      <button class="btn ghost" id="edit">問いに戻って書き足す</button>
      <button class="btn ghost" id="other">${sf ? "「ついしてしまうこと」も見てみる" : "資質からも見てみる"}</button>
    </div>
    <details class="fold"><summary>二人で話すときの例</summary><div class="talk">
      <p class="small">答えを当てずに、物語を一緒に聞きます。気になった問いだけ使ってください。</p>
      <p><b>聞き手</b>どんなことが心に残りましたか？</p>
      <p><b>話し手</b>話を整理するというギフトです。友だちの相談を思い出しました。</p>
      <p><b>聞き手</b>そのとき、具体的に何をしていましたか？</p>
      <p><b>話し手</b>迷っていることを紙に書き分けました。</p>
      <p><b>聞き手</b>その後、相手は何と言っていましたか？</p>
      <p><b>話し手</b>「少しすっきりした」と。選ぶのが楽になったかも、というのは私の推測です。</p>
      <p><b>聞き手</b>これから誰と、こういう時間を増やしたいですか？</p>
      <p><b>話し手</b>仕事で迷っている人とも。まず、整理する手伝いがほしいか聞いてみたいです。</p>
      <p class="small">聞き手は「それは○○ですね」と決めず、「そう考えると、しっくりきますか？」と返します。相手の言葉と自分の解釈を分け、うまく届かなかった話も置ける余白を残します。</p>
    </div></details>
    <p class="fine">Gallup、CliftonStrengths、StrengthsFinderはGallupの商標です。本資料はGallupの公式資料・公式認定教材ではなく、承認・提携・推薦を示すものではありません。ギフトの例と行動リストは、おけもんのセッションと仮説から作ったもので、診断ではありません。</p>
  </section>`;
  dock(null);
  $("copy").onclick = () => {
    const txt = `わたしのギフト・メモ\n${sf ? "眺めた資質" : "眺めた「つい」"}：${picked.join("／")}\n\n` + rows.map(r => `■ ${r.q}\n${r.a || "（空欄）"}`).join("\n\n");
    const done = () => toast("コピーしました");
    (navigator.clipboard?.writeText(txt) || Promise.reject()).then(done).catch(() => {
      const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch(e) { toast("コピーできませんでした。長押しで選んでください"); } ta.remove();
    });
  };
  $("edit").onclick = () => { S.w = 0; save(); go("work"); };
  $("other").onclick = () => { S.route = sf ? "daily" : "sf"; S.i = 0; save(); go("pick"); };
}
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }

render();
</script>
</body></html>

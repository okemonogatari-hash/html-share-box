<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#efece2">
<meta name="description" content="ページをひらくと、小さな森が立ち上がる。開いて、回して、光を変える、紙のしかけの小さな作品。">
<title>ひらく、紙の森 — おけもん実験室</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="atelier">
  <header class="masthead"><a class="wordmark" href="https://okemonogatari-hash.github.io/html-share-box/lab-works.html" aria-label="おけもん実験室の作品棚へ"><span class="mark" aria-hidden="true">⌑</span> おけもん実験室 <span class="edition">PAPER STUDIES · 04</span></a><a class="making-link" href="making.html">作り方 <span aria-hidden="true">↗</span></a></header>
  <section class="introduction" aria-labelledby="title"><div class="eyebrow">A LITTLE WORLD, BETWEEN THE PAGES</div><h1 id="title">ひらく、<span>紙の森</span><i aria-hidden="true">。</i></h1><p>一枚の向こうに、ちいさな暮らし。</p></section>
  <section class="world" aria-label="紙の森の絵本">
    <div class="canvas-frame"><canvas id="scene" width="1600" height="1060" tabindex="0" aria-label="紙の森。ドラッグまたは矢印キーで視点を動かせます。プラス・マイナスキーで拡大縮小。">ブラウザのCanvasに対応する環境で、飛び出す絵本をお楽しみください。</canvas></div>
    <div class="scene-note"><span class="tiny-leaf" aria-hidden="true">❋</span><span id="scene-caption">森の喫茶が、ひらきました。</span></div>
    <div class="scene-help" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12a8 5 0 0 1 15-2M20 12a8 5 0 0 1-15 2M19 5v5h-5M5 19v-5h5"/></svg>ドラッグで、ぐるり。</div>
    <div class="view-switch" role="group" aria-label="見る角度"><button type="button" data-view="front" aria-label="正面から見る">正面</button><button type="button" data-view="overhead" aria-label="上から見る">上から</button><button type="button" data-view="detail" aria-label="近くから見る">近くで</button></div>
  </section>
  <section class="workbench" aria-label="絵本の操作">
    <div class="opening-control"><div class="control-heading"><label for="opening">ページをひらく</label><output id="opening-value" for="opening">100<span>%</span></output></div><div class="slider-row"><svg class="book-icon closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h11v16H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2ZM7 4v16M5 17h13"/></svg><input id="opening" type="range" min="0" max="100" step="1" value="100" aria-label="ページの開き具合"><svg class="book-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14M12 7C9 4 6 4 2 5v14c4-1 7-1 10 2 3-3 6-3 10-2V5c-4-1-7-1-10 2Z"/></svg></div></div>
    <button id="toggle-book" type="button" class="round-action" aria-label="絵本を閉じる"><span id="toggle-icon" aria-hidden="true">↙</span><span id="toggle-label">とじる</span></button>
    <div class="divider" aria-hidden="true"></div>
    <div class="light-control"><span class="control-label">森のあかり</span><div class="segmented" role="group" aria-label="森の時間"><button id="daylight" type="button" aria-pressed="true"><span aria-hidden="true">☀</span> 昼</button><button id="evening" type="button" aria-pressed="false"><span aria-hidden="true">☾</span> 夕暮れ</button></div></div>
    <label class="guide-control"><input id="fold-guides" type="checkbox"><span class="check-mark" aria-hidden="true"></span><span>折り目を見る</span></label>
    <button id="save-png" type="button" class="save-action"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg><span>この景色を保存</span></button>
  </section>
  <footer class="footnote"><span>紙のしかけを、ゆっくりと。</span><div><a id="download-link" hidden download="paper-forest.png">画像をダウンロード</a><button id="reset" type="button">最初の景色に戻す</button></div></footer>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</main><script type="module" src="app.mjs"></script></body></html>

tion:absolute;right:17px;bottom:28px;background:#fffcf0;padding:4px 12px;font-size:11px;border:1px solid #bec9b4;transform:rotate(-5deg)}.request{padding:23px 25px 25px}.eyebrow{font-size:11px;letter-spacing:.06em;color:#72806b;margin:0 0 6px}.request h2{font-size:21px;line-height:1.6;margin:0 0 15px}.request blockquote{margin:0;font-size:17px;line-height:1.95}.baggage{font-size:12px;margin:18px 0 0;color:#6e7b6c;border-top:1px dashed #c3cbb8;padding-top:12px}.reply-side{padding:1px 0}.prompt{font-size:14px;margin:0 0 11px}.choices{display:grid;gap:10px}.choices button{display:flex;align-items:center;gap:13px;text-align:left;background:#fffdf5;border:1px solid #b2c2b0;border-radius:13px;padding:14px 16px;font-size:14px;line-height:1.8}.choices button:hover{background:#e8efdf}.choices button[aria-pressed=true]{border:2px solid var(--ink);padding:13px 15px;background:#e1eadb}.choice-letter{display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;border:1px solid #b8c6ad;border-radius:50%;font-size:11px;font-weight:600}.result{margin-top:22px;border:1px solid #dec58d;border-radius:4px;background:#fff8df;padding:20px 22px;position:relative}.result:before{content:'';position:absolute;width:70px;height:15px;background:#c7d8bb88;top:-8px;left:calc(50% - 35px);transform:rotate(-4deg)}.result[hidden]{display:none}.result .label{font-size:11px;color:#866747;margin:0 0 7px}.result blockquote{margin:0;font-size:16px;line-height:1.9}.ending{border-top:1px dashed #dbc991;padding-top:12px;margin:14px 0 0;font-size:13px;color:#80623f;line-height:1.9}.next{margin-top:17px;display:flex;align-items:center;justify-content:space-between;gap:14px}.next p{margin:0;font-size:11px;color:#71816f}.next button{flex-shrink:0;font-size:12px;padding:8px 15px;border-radius:99px;background:transparent;border:1px solid #9eafa0}.footer{border-top:1px solid var(--line);margin-top:31px;padding-top:16px;color:#75816d;font-size:11px;line-height:1.9}.mini{color:var(--orange)}

<div class="mast"><span>無茶ぶり受付 / 本日も営業中</span><a href="../../friend-share-g-XsCiGC0MzIvWvDSc.html">社内ブログ ↗</a></div>
<header><div><h1>そのご依頼、<br>もう一度。</h1><p>返事をひとつ選んだら、<br>話がどこへ転がるか見てみよう。</p></div><div class="number">受付番号<strong id="ticket">001</strong>相談は無料です</div></header>
<nav class="customers" aria-label="お客さまを選ぶ"><button data-case="0" aria-pressed="true">🪐 宇宙っぽく</button><button data-case="1" aria-pressed="false">🍮 月へお届け</button><button data-case="2" aria-pressed="false">👻 透明な動画</button></nav>
<div class="desk"><section class="guest" aria-labelledby="case-title"><div class="portrait"><span class="face" id="face" aria-hidden="true">🧑‍🚀</span><span class="name-tag" id="name-tag">イメージはあるお客さま</span></div><div class="request"><p class="eyebrow">本日のご依頼</p><h2 id="case-title" tabindex="-1"></h2><blockquote id="request"></blockquote><p class="baggage" id="baggage"></p></div></section>
<section class="reply-side" aria-label="返事を選ぶ"><p class="prompt">さて、なんて返す？ <span class="mini">正解は決めてません。</span></p><div class="choices" id="choices"></div><div class="result" id="result" role="status" aria-live="polite" aria-atomic="true" hidden><p class="label">お客さまからのお返事</p><blockquote id="answer"></blockquote><p class="ending" id="ending"></p></div><div class="next"><p>別の返しも押せます。<br>やり直しは何度でも。</p><button id="next">次のお客さま →</button></div></section></div>
<p class="footer">架空のお客さまと、用意した台詞で遊ぶ三択接客です。実際の依頼は受け付けていません。<br>お客さまは3組。無茶ぶりの大きさは、だいたい宇宙規模。</p>
<a class="lab-return" href="index.html">← ほかの寄り道も見る</a>
</main><script>
'use strict';
const cases=[
 {title:'明日までに、宇宙っぽく。',icon:'🧑‍🚀',name:'イメージはあるお客さま',request:'「何を作るかはお任せします。明日までに、宇宙っぽくお願いします。予算はゼロです。」',baggage:'持ち物：ふわっとしたイメージ。締切だけは、はっきり。',choices:[
  ['「何を見た人に、どう感じてほしいですか？」','「このプリンを見た人に、宇宙を感じてほしいんです。味は普通で。」','商品名だけは決まった。銀河プリン。何を作るかは、まだ謎。'],
  ['「まず背景を黒くしてみましょう」','「黒だと夜ですよね。宇宙には土星もほしいです。輪っか込みで。」','無料の星が、一つ追加された。輪っかの担当者はまだいない。'],
  ['「明日は難しいです。今日は名前だけなら」','「では名前を千個ください。宇宙って広いので。」','小さく始める話が、千個に増えた。宇宙は膨張している。']
 ]},
 {title:'月までプリンを、置き配で。',icon:'🐇',name:'お届け先が遠いお客さま',request:'「月までプリンを届けてください。送料は無料で。留守なら玄関前に置いておいてください。」',baggage:'備考：スプーンは要る。重力はあまりない。',choices:[
  ['「月、という名前のお店でしょうか？」','「いえ、衛星です。地球の近くの、いつもの月です。」','確認した結果、ちゃんと遠かった。住所の曖昧さだけが消えた。'],
  ['「溶けないうちに、地球で食べませんか？」','「地球なら行けます。ついでに実家に寄るので。」','配送問題が解決した。お客さまの移動距離については、聞かないことにした。'],
  ['「送料の代わりに、月の石をいただけますか？」','「いいですよ。着払いで送りますね。」','無料にしたかった送料が、宇宙から戻ってくる。']
 ]},
 {title:'何も映らない、宣伝動画。',icon:'👻',name:'見せ方にこだわるお客さま',request:'「うちの透明マントの宣伝動画を作ってください。商品もモデルも見せず、魅力はしっかり伝えてほしいです。」',baggage:'参考映像：未添付。添付済みだと言い張っている。',choices:[
  ['「音だけで、魅力を伝えてみませんか？」','「いいですね。ただ、無音でも伝わるようにお願いします。」','音という最後の手がかりも、マントを着てしまった。'],
  ['「背景だけ撮る、ということでしょうか？」','「そうです！ その背景も、できれば透明で。」','撮影場所が要らなくなった。何の準備をしたらいいかも、わからなくなった。'],
  ['「着る前と、着た後を比べましょう」','「着る前もお見せできません。恥ずかしがり屋なので。」','透明マントは性能より、着る人の性格に合っていた。']
 ]}
];
const $=id=>document.getElementById(id);let current=0;
function choose(index){const scene=cases[current],branch=scene.choices[index];$('answer').textContent=branch[1];$('ending').textContent=branch[2];$('result').hidden=false;document.querySelectorAll('#choices button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));const box=$('result').getBoundingClientRect();if(box.bottom>innerHeight||box.top<0)$('result').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function show(index,focus=false){current=(index+cases.length)%cases.length;const scene=cases[current];$('ticket').textContent=String(current+1).padStart(3,'0');$('face').textContent=scene.icon;$('name-tag').textContent=scene.name;$('case-title').textContent=scene.title;$('request').textContent=scene.request;$('baggage').textContent=scene.baggage;$('answer').textContent='';$('ending').textContent='';$('result').hidden=true;$('choices').replaceChildren();scene.choices.forEach((branch,i)=>{const button=document.createElement('button'),letter=document.createElement('span'),body=document.createElement('span');button.type='button';button.setAttribute('aria-pressed','false');letter.className='choice-letter';letter.setAttribute('aria-hidden','true');letter.textContent='ABC'[i];body.textContent=branch[0];button.append(letter,body);button.addEventListener('click',()=>choose(i));$('choices').append(button);});document.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.case===current)));if(focus){$('case-title').focus({preventScroll:true});$('case-title').scrollIntoView({block:'nearest',behavior:'auto'});}}
document.querySelectorAll('[data-case]').forEach(button=>button.addEventListener('click',()=>show(+button.dataset.case)));$('next').addEventListener('click',()=>show(current+1,true));show(0);
</script></body></html>

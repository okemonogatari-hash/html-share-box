<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>急がない航空｜行き先は、とくになし。</title>
<style>
:root{color-scheme:light;--ink:#344e5a;--paper:#f6f3e8;--top:#93c7d5;--bottom:#e9efdd;--hill:#93b7a5;--back:#b6cbbb;--sun:#fff4bd;--cloud:#fffdf1;--stars:0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.85}body[data-sky="sunset"]{--top:#c995af;--bottom:#f9d1a6;--hill:#9c939d;--back:#c3a5a6;--sun:#ffe9ad;--cloud:#ffe8d6}body[data-sky="night"]{--top:#334b70;--bottom:#879aaf;--hill:#4c6778;--back:#6d8395;--sun:#fff8d4;--cloud:#b7c6d5;--stars:1}main{max-width:1120px;margin:auto;padding:28px 30px 35px}.mast{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bdcbc5;padding-bottom:12px;font-size:12px;letter-spacing:.12em}.mast a{color:inherit;text-decoration:none;font-size:11px;letter-spacing:0}header{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:31px 0 24px}h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(29px,4.5vw,46px);line-height:1.5;font-weight:600;margin:0}header p{font-size:13px;margin:0;color:#65777b}.window{position:relative;overflow:hidden;border-radius:30px;border:1px solid #abbebc;background:var(--bottom);isolation:isolate}.sky{display:block;width:100%;height:clamp(350px,49vw,560px);touch-action:pan-y;outline-offset:-5px}.sky.flying{touch-action:none;cursor:crosshair}.sky-top{stop-color:var(--top)}.sky-bottom{stop-color:var(--bottom)}.cloud{fill:var(--cloud);opacity:.83}.sun{fill:var(--sun)}.stars{fill:#fffadd;opacity:var(--stars)}.hill-back{fill:var(--back)}.hill-front{fill:var(--hill)}.float-label{position:absolute;top:19px;left:24px;font-size:11px;letter-spacing:.1em;color:#294750;background:#fffc;padding:5px 12px;border-radius:99px;pointer-events:none}.postcard{position:absolute;bottom:18px;left:24px;right:24px;pointer-events:none;font-size:13px;color:#fff;text-shadow:0 1px 5px #294750}.panel{display:grid;grid-template-columns:1fr 1fr;gap:35px;padding:23px 2px 0}.route{font-size:13px;margin:0 0 12px;min-height:26px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #9bafaa;background:#fffdf6;border-radius:99px;min-height:44px;padding:8px 19px;font-size:13px}button:hover{background:#e7eee5}button:disabled{cursor:default;color:#85958f;background:#efefe8}button[aria-pressed=true],#toggle{background:#405e60;color:#fff;border-color:#405e60}button:focus-visible,a:focus-visible,input:focus-visible,.sky:focus-visible{outline:3px solid #936239;outline-offset:4px}.height-row{display:flex;align-items:center;gap:15px;font-size:12px;margin:0 0 13px}.height-row input{min-width:0;flex:1;accent-color:#496e6c;height:44px;cursor:pointer}.help{font-size:12px;color:#647978;margin:11px 0 0}.sky-picker{border:0;padding:0;margin:0}.sky-picker legend{font-size:12px;margin-bottom:9px}.sky-picker button{font-size:12px;padding:8px 15px}footer{border-top:1px solid #c7d1c7;margin-top:27px;padding-top:13px;font-size:11px;color:#70827d;display:flex;justify-content:space-between;gap:20px}.sun,.cloud,.hill-back,.hill-front,.sky-top,.sky-bottom{transition:fill 1s,stop-color 1s}#motion-note{font-size:11px;color:#677a73;margin:11px 0 0}
@media(max-width:650px){main{padding:18px 17px 28px}header{display:block;padding:24px 0 20px}header p{margin-top:9px;font-size:12px}h1{font-size:30px}.window{border-radius:22px}.sky{height:380px}.float-label{left:16px;top:14px}.postcard{left:16px;bottom:13px;font-size:12px}.panel{grid-template-columns:1fr;gap:23px;padding-top:17px}.buttons{gap:7px}button{padding:8px 17px}.mast{font-size:11px}footer{display:block}footer span{display:block}.height-row{margin-bottom:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style></head><body data-sky="day"><main>
<div class="mast"><span>急がない航空</span><a href="../../friend-share-g-XsCiGC0MzIvWvDSc.html">実験室の日記 ↗</a></div>
<header><h1>行き先は、<br>とくになし。</h1><p>曲がったり、雲に入ったり。<br>着陸を急ぐ用事も、ありません。</p></header>
<div class="window">
<svg class="sky" id="sky" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" tabindex="0" role="img" aria-label="雲の間を飛ぶ紙飛行機。飛行中は上下矢印か、空をなぞって高さを変えられます。" aria-describedby="help">
<defs><linearGradient id="sky-gradient" x2="0" y2="1"><stop class="sky-top"/><stop class="sky-bottom" offset="1"/></linearGradient><g id="cloud-shape"><path d="M-85 17C-110 10-101-20-78-20C-73-50-29-53-13-30C4-55 42-48 48-22C84-24 104 5 77 20Z"/></g></defs>
<path fill="url(#sky-gradient)" d="M0 0H1000V560H0Z"/>
<g class="stars"><circle cx="315" cy="57" r="2"/><circle cx="518" cy="86" r="2.5"/><circle cx="669" cy="39" r="2"/><circle cx="815" cy="113" r="2"/><circle cx="133" cy="149" r="2"/><circle cx="701" cy="168" r="2.5"/><circle cx="386" cy="158" r="1.5"/><circle cx="567" cy="187" r="2"/><circle cx="855" cy="61" r="1.5"/></g>
<circle class="sun" cx="727" cy="130" r="43"/>
<path class="hill-back" d="M0 500Q110 394 230 463T510 465T760 440T1000 468V560H0Z"/>
<g id="clouds" class="cloud"><use href="#cloud-shape" transform="translate(100 110) scale(.6)"/><use href="#cloud-shape" transform="translate(470 180) scale(.75)"/><use href="#cloud-shape" transform="translate(750 305) scale(.95)"/><use href="#cloud-shape" transform="translate(1080 370) scale(.6)"/></g>
<path id="trail" d="" fill="none" stroke="#fff9" stroke-width="2" stroke-dasharray="4 9" stroke-linecap="round"/>
<g id="plane" transform="translate(400 280)"><ellipse cx="-3" cy="27" rx="20" ry="3" fill="#355d6115"/><path d="M-37-15L43 0-29 24-13 3Z" fill="#fffdf3" stroke="#6b8f92" stroke-width="1.5" stroke-linejoin="round"/><path d="M-13 3L43 0-29 24Z" fill="#dbe7e2"/><path d="M-37-15L-13 3 43 0" fill="none" stroke="#92aaa4" stroke-width="1.4"/></g>
<path class="hill-front" d="M0 543Q150 484 303 530T600 534T1000 505V560H0Z"/>
</svg>
<span class="float-label" id="flight-state">ただいま、出発待ち。</span><span class="postcard" aria-hidden="true">到着予定：気が向いたら。</span>
</div>
<div class="panel"><section aria-label="飛行機を動かす"><p class="route" id="message" role="status" aria-live="polite">紙飛行機、一機。空は空いています。</p><div class="buttons"><button id="toggle" aria-pressed="false">飛ばしてみる</button><button id="up" disabled>ふわっと上へ</button><button id="down" disabled>ふわっと下へ</button></div><p class="help" id="help">空をなぞるか、上下のボタンで寄り道。<br>キーボードなら空にフォーカスして ↑ ↓。Spaceでひと休み。</p><p id="motion-note" hidden>動きを控えめにする設定です。飛ばすと、ゆっくり動きます。</p></section>
<section aria-label="空を選ぶ"><label class="height-row" for="altitude">飛ぶ高さ<input id="altitude" type="range" min="0" max="100" value="50" aria-valuetext="真ん中あたり" disabled></label><fieldset class="sky-picker"><legend>今、どんな空にする？</legend><div class="buttons"><button data-sky="day" aria-pressed="true">昼の空</button><button data-sky="sunset" aria-pressed="false">夕焼け</button><button data-sky="night" aria-pressed="false">夜の空</button></div></fieldset></section></div>
<footer><span>点数も、墜落も、ない便です。</span><span>音なし・途中下車自由。</span></footer>
<a class="lab-return" href="index.html">← ほかの寄り道も見る</a>
</main><script>
'use strict';
const $=id=>document.getElementById(id),sky=$('sky'),plane=$('plane'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const clouds=[{x:100,y:110,s:.6},{x:470,y:180,s:.75},{x:750,y:305,s:.95},{x:1080,y:370,s:.6}],cloudNodes=[...$('clouds').children];
let running=false,frame=0,last=0,time=0,y=280,targetY=280,lastCloud=-20,dragging=null,trail=[];
function paint(){const tilt=Math.max(-14,Math.min(14,(targetY-y)*.18));plane.setAttribute('transform',`translate(400 ${y}) rotate(${tilt})`);clouds.forEach((c,i)=>cloudNodes[i].setAttribute('transform',`translate(${c.x} ${c.y}) scale(${c.s})`));$('trail').setAttribute('d',trail.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' '));}
function tick(now){if(!running)return;const dt=last?Math.min((now-last)/1000,.05):0;last=now;const pace=reduced.matches?.45:1;time+=dt;const oldY=y;y+=(targetY-y)*(1-Math.exp(-2.3*dt));if(Math.abs(targetY-y)<.05)y=targetY;clouds.forEach(c=>{c.x-=dt*(22+c.s*18)*pace;if(c.x< -130)c.x=1130;if(Math.abs(c.x-400)<65*c.s&&Math.abs(c.y-y)<27*c.s&&time-lastCloud>9){$('message').textContent='雲のなか。ちょっとひんやり。';lastCloud=time;}});trail.forEach(p=>p.x-=dt*42*pace);if(dt>0)trail.push({x:374,y:oldY+7});if(trail.length>90)trail.shift();paint();frame=requestAnimationFrame(tick);}
function setRunning(value){running=value;dragging=null;cancelAnimationFrame(frame);frame=0;last=0;$('toggle').textContent=value?'空でひと休み':'また飛ばす';$('toggle').setAttribute('aria-pressed',String(value));$('up').disabled=$('down').disabled=$('altitude').disabled=!value;sky.classList.toggle('flying',value);$('flight-state').textContent=value?'ただいま、寄り道中。':'空で、ひと休み。';$('message').textContent=value?'どこへ行っても、遠回りにはなりません。':'ここで止まっても、大丈夫。';if(value)frame=requestAnimationFrame(tick);}
function altitude(value){if(!running)return;const v=Math.max(0,Math.min(100,value));$('altitude').value=String(v);targetY=425-v*2.9;$('altitude').setAttribute('aria-valuetext',v>70?'高いところ':v<30?'低いところ':'真ん中あたり');$('message').textContent=v>70?'ちょっと高いところまで。':v<30?'丘の近くを、ゆっくり。':'このへんの空を、もう少し。';}
$('toggle').addEventListener('click',()=>setRunning(!running));$('up').addEventListener('click',()=>altitude(+$('altitude').value+18));$('down').addEventListener('click',()=>altitude(+$('altitude').value-18));$('altitude').addEventListener('input',e=>altitude(+e.target.value));
sky.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();if(!e.repeat)setRunning(!running);}if(running&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();altitude(+$('altitude').value+(e.key==='ArrowUp'?9:-9));}});
function follow(e){const matrix=sky.getScreenCTM();if(!matrix)return;const point=new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix.inverse());altitude((425-point.y)/2.9);}
sky.addEventListener('pointerdown',e=>{if(!running||e.button!==0||dragging!==null)return;dragging=e.pointerId;sky.setPointerCapture(e.pointerId);follow(e);});sky.addEventListener('pointermove',e=>{if(e.pointerId===dragging)follow(e);});function release(e){if(e.pointerId!==dragging)return;dragging=null;if(sky.hasPointerCapture(e.pointerId))sky.releasePointerCapture(e.pointerId);}sky.addEventListener('pointerup',release);sky.addEventListener('pointercancel',release);sky.addEventListener('lostpointercapture',()=>dragging=null);
document.querySelectorAll('[data-sky]').forEach(button=>{if(button.tagName!=='BUTTON')return;button.addEventListener('click',()=>{document.body.dataset.sky=button.dataset.sky;document.querySelectorAll('button[data-sky]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)setRunning(false);});window.addEventListener('blur',()=>{if(running)setRunning(false);});reduced.addEventListener('change',()=>{$('motion-note').hidden=!reduced.matches;if(running)setRunning(false);});$('motion-note').hidden=!reduced.matches;paint();
</script></body></html>

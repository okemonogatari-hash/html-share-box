<style>
:root{--s:3;--fs:14px;--fs-s:11px;--ink:#3a2618;--paper:#fff8e8;--btn:#ffe7a8;--yuzu:#f5c21b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#241a2e;color:var(--ink);font-family:'DotGothic16',ui-monospace,monospace;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

#stage{position:relative;flex:none;box-shadow:0 0 0 3px #120c18;background:#000}

#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ents,#lbls{position:absolute;inset:0}
.ent{position:absolute;left:0;top:0;width:0;height:0}

.bb{position:absolute;left:0;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:7px;padding:.2em .55em;font-size:var(--fs);line-height:1.3;width:max-content;max-width:max(140px,calc(var(--s)*92px));text-align:center;opacity:0;transition:opacity .15s;word-break:break-all}
.bb.on{opacity:1}
.bb::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:var(--fs-s);line-height:1;color:#fff6dc;text-shadow:1px 1px 0 #3a2618,-1px -1px 0 #3a2618,1px -1px 0 #3a2618,-1px 1px 0 #3a2618}
.lbl.dk{color:#3a2618;text-shadow:none}
.lbl.big{font-size:var(--fs)}
.lbl.neon{color:#ffe0f6;text-shadow:0 0 3px #ff3fa0,0 0 7px #ff3fa0,0 0 12px #ff3fa0;animation:neon 2.4s infinite}
.lbl.neon2{color:#dcfbff;text-shadow:0 0 3px #3fd0ff,0 0 8px #3fd0ff;animation:neon 3.1s infinite}

#ghud{position:absolute;inset:0;display:none;font-size:var(--fs)}
#ghud .l{position:absolute;left:calc(var(--s)*3px);top:calc(var(--s)*3px)}
#ghud .r{position:absolute;right:calc(var(--s)*3px);top:calc(var(--s)*3px)}

#toast.on{opacity:1}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:var(--fs);color:#fff;white-space:nowrap;text-shadow:1px 1px 0 #3a2618,-1px -1px 0 #3a2618,1px -1px 0 #3a2618,-1px 1px 0 #3a2618;animation:pop 1.1s ease-out forwards}
.pop.gold{color:#ffe36a}
@keyframes pop{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:calc(var(--s)*-14px)}}

.row{display:flex;gap:6px;justify-content:center;margin:6px 0}

.lab{font-size:13px;opacity:.8;margin-top:6px}
.pal{display:grid;grid-template-columns:repeat(4,auto);gap:6px;justify-content:center;margin:4px 0 8px}
.sw{width:64px;padding:4px 2px;border:2px solid var(--ink);border-radius:6px;background:#fff;cursor:pointer;font:inherit;font-size:12px;color:var(--ink)}

.note{font-size:13px}

.hatitem .pb{font-size:13px;padding:6px 8px 5px;margin-top:4px}
.hatitem.on{background:#fff4c8}
.mapbox{position:relative;width:100%;max-width:480px;margin:0 auto}
.mapbox canvas{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--ink);border-radius:6px}
.mapbox .pb{position:absolute;transform:translate(-50%,-50%);font-size:13px;padding:5px 7px 4px}

ul.g{margin:.3em 0;padding-left:1.2em}
.howto{margin:8px auto 2px;padding:6px 10px;background:#fff1c4;border:2px dashed #c9a24a;border-radius:8px;font-size:13px;line-height:1.55;max-width:26em}
.howto b{color:#c0621c;font-weight:normal}
.credit{margin:10px 0 0;font-size:11px;line-height:1.5;opacity:.75}
.credit a{color:inherit}
.need{font-size:11px;color:#a0522d;margin-top:2px}
#ghud .b{position:absolute;left:50%;bottom:calc(var(--s)*3px);transform:translateX(-50%);font-size:var(--fs-s);color:#fff;white-space:nowrap;text-shadow:1px 1px 0 #3a2618,-1px -1px 0 #3a2618,1px -1px 0 #3a2618,-1px 1px 0 #3a2618;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#emoPal{position:absolute;left:50%;bottom:calc(var(--s)*4px);transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:5px;background:rgba(255,248,232,.96);border:2px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink);pointer-events:auto;max-width:calc(100% - 8px);z-index:3}
#emoPal.hidden{display:none}
#emoPal button{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid var(--ink);border-radius:6px;cursor:pointer}
#emoPal button:active{transform:translateY(1px)}
#emoPal canvas{width:28px;height:28px;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
@media (pointer:coarse){
 .pb{min-height:44px;min-width:44px;padding:10px 11px 9px;font-size:15px}
 #chatIn{min-height:44px;font-size:16px}
 .hatitem .pb{min-height:44px;font-size:14px}
 .mapbox .pb{min-height:36px;min-width:0;padding:6px 7px 5px}
 .sw{min-height:48px}
}

<body>
<div id="app">

<script>
(()=>{
'use strict';
// ======================================================================

const W=320,H=180,TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const cv=$('#game'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;

const ri=(a,b)=>Math.floor(rnd(a,b+1));

function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return c;}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function shade(h,f){const[r,g,b]=hex2rgb(h);if(f<0){const k=1+f;return rgb2hex(r*k,g*k,b*k);}return rgb2hex(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f);}
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function ell(c,cx,cy,rx,ry,col){c.fillStyle=col;cx=Math.round(cx);cy=Math.round(cy);rx=Math.round(rx);ry=Math.round(ry);if(ry<=0){c.fillRect(cx-rx,cy,rx*2+1,1);return;}for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));c.fillRect(cx-w,cy+y,w*2+1,1);}}

let save=load();
const hadSave=!!save.name;
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

const TAB_KEY='capy-island-jp-tab';

let tabMe=loadTab();
function persistTab(){try{sessionStorage.setItem(TAB_KEY,JSON.stringify(tabMe));}catch(e){}}

window.addEventListener('storage',e=>{if(e.key!==SAVE_KEY||!e.newValue)return;const s=load();save.coins=s.coins;save.owned=s.owned;save.best=s.best;try{updHud();}catch(_){}});

const COLORS=[
 {n:'きなこ',c:'#c9965e'},{n:'ちゃいろ',c:'#a8703f'},{n:'こげちゃ',c:'#74492a'},{n:'ほうじ茶',c:'#b0694a'},

const HATS=[
 {id:'yuzu',n:'ゆずの帽子',p:0},
 {id:'tenugui',n:'てぬぐい',p:20},

const CAPY=[
"............rr........",

"bbbbbbbbbbbbbsssssss..",

const LEGS=[
 ["...ss..ss...ss..ss....","...ss..ss...ss..ss...."],

 ["...ss..ss...ss..ss....","....ss.ss....ss.ss...."],

function buildSpr(rows,pal,ol){
 const h=rows.length,w=rows[0].length;const c=mk(w+2,h+2),g=c.getContext('2d');
 const F=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&rows[y][x]!=='.';
 for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){
  if(F(x,y)){g.fillStyle=pal[rows[y][x]]||'#f0f';g.fillRect(x+1,y+1,1,1);}
  else if(ol&&(F(x-1,y)||F(x+1,y)||F(x,y-1)||F(x,y+1))){g.fillStyle=ol;g.fillRect(x+1,y+1,1,1);}
 }
 return c;
}

function beatNow(){return AU.ctx?AU.ctx.currentTime*beatBpm/60:T*2;}
function drawCapy(c,e,t){
 const x=Math.round(e.x),y=Math.round(e.y);
 let leg=0,bob=0;
 if(e.inBath||e.sit)leg=3;
 else if(e.walking){const fr=Math.floor(t*9+e.ph)%4;leg=fr===1?1:fr===3?2:0;bob=(fr%2)?-1:0;}
 let face=e.face>=0?1:-1;
 if(e.dance&&!e.walking){const b=beatNow()+e.ph;bob=-Math.round(Math.abs(Math.sin(b*Math.PI))*2);if(Math.floor(b/2)%2)face=-face;}

 }else{

 }
}

 player.x=player.tx=sx;player.y=player.ty=sy;player.path=null;player.face=f||1;player.moving=false;player.sit=false;player.dance=false;player.act=null;player.inBath=false;player.emote=null;
 room.enter&&room.enter();
 buildLabels();setTheme(room.music);roomTitle(room.name);updHud();bcSend(true);
}
function updFade(dt){if(!fade.on)return;fade.t+=dt*4;if(fade.t>=1){if(fade.dir>0){fade.cb&&fade.cb();fade.cb=null;fade.dir=-1;fade.t=0;}else fade.on=false;}}
function drawFade(c){if(!fade.on)return;const a=fade.dir>0?fade.t:1-fade.t;R(c,0,0,W,H,'rgba(20,10,30,'+clamp(a,0,1).toFixed(2)+')');}

function resolveTarget(x,y){
 const r=room;if(r.walk(x,y))return[x,y];
 const cx=clamp(x,0,320),cy=clamp(y,r.ymin,r.ymax);if(r.walk(cx,cy))return[cx,cy];
 for(let i=1;i<=40;i++){const k=i/40;const px=cx+(player.x-cx)*k,py=cy+(player.y-cy)*k;if(r.walk(px,py))return[px,py];}
 return[player.x,player.y];
}
function lineClear(x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/2);for(let i=1;i<=n;i++){const k=i/n;if(!room.walk(x0+(x1-x0)*k,y0+(y1-y0)*k))return false;}return true;}
// 4px格子のA*で道順を作る（噴水・木・建物の角で止まらないように）
function findPath(sx,sy,tx,ty){
 if(lineClear(sx,sy,tx,ty))return[[tx,ty]];
 const C=4,GW=80,GH=45,N=GW*GH;
 const okc=i=>room.walk((i%GW)*C+2,Math.floor(i/GW)*C+2);
 const idx=(x,y)=>clamp(Math.floor(y/C),0,GH-1)*GW+clamp(Math.floor(x/C),0,GW-1);
 const near=i=>{if(okc(i))return i;const cx=i%GW,cy=Math.floor(i/GW);for(let r=1;r<4;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const x=cx+dx,y=cy+dy;if(x>=0&&y>=0&&x<GW&&y<GH&&okc(y*GW+x))return y*GW+x;}return -1;};
 const st=near(idx(sx,sy)),gl=near(idx(tx,ty));if(st<0||gl<0)return null;
 const g=new Float32Array(N).fill(1e9),from=new Int32Array(N).fill(-1),closed=new Uint8Array(N),walk=new Int8Array(N).fill(-1);
 const W2=i=>{if(walk[i]<0)walk[i]=okc(i)?1:0;return walk[i]===1;};
 const hx=i=>{const dx=Math.abs(i%GW-gl%GW),dy=Math.abs(Math.floor(i/GW)-Math.floor(gl/GW));return Math.max(dx,dy)+0.41*Math.min(dx,dy);};
 const heap=[];const push=(f,i)=>{heap.push([f,i]);let k=heap.length-1;while(k>0){const q=(k-1)>>1;if(heap[q][0]<=heap[k][0])break;[heap[q],heap[k]]=[heap[k],heap[q]];k=q;}};
 const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
 g[st]=0;push(hx(st),st);let found=false;
 while(heap.length){const[,i]=pop();if(closed[i])continue;closed[i]=1;if(i===gl){found=true;break;}
  const cx=i%GW,cy=Math.floor(i/GW);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=GW||y>=GH)continue;const j=y*GW+x;if(closed[j]||!W2(j))continue;if(dx&&dy&&(!W2(cy*GW+x)||!W2(y*GW+cx)))continue;const ng=g[i]+(dx&&dy?1.41:1);if(ng<g[j]){g[j]=ng;from[j]=i;push(ng+hx(j),j);}}
 }
 if(!found)return null;
 const cells=[];for(let i=gl;i!==-1;i=from[i])cells.unshift([(i%GW)*C+2,Math.floor(i/GW)*C+2]);
 cells.push([tx,ty]);
 const out=[];let cx=sx,cy=sy,k=0;
 while(k<cells.length){let far=k;for(let j=cells.length-1;j>k;j--){if(lineClear(cx,cy,cells[j][0],cells[j][1])){far=j;break;}}out.push(cells[far]);cx=cells[far][0];cy=cells[far][1];k=far+1;}
 return out;
}
function walkTo(x,y,act){const p=resolveTarget(x,y);player.path=findPath(player.x,player.y,p[0],p[1])||[[p[0],p[1]]];const w=player.path.shift();player.tx=w[0];player.ty=w[1];player.moving=true;player.act=act||null;player.sit=false;player.dance=false;player.lastD=1e9;player.stuckT=0;parts.push({x:p[0],y:p[1],vx:0,vy:0,life:0,max:0.45,k:'ring',scene:'world'});}
function moveEnt(e,dt,sp){
 const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);
 if(d<0.8){e.x=e.tx;e.y=e.ty;e.moving=false;return true;}
 const st=Math.min(d,sp*dt);
 // 障害物（噴水など）は向きを少しずつ振って回り込む。前回と同じ側を優先して揺れを防ぐ
 const ang=Math.atan2(dy,dx),s=e.side||1;
 let moved=false;
 for(const da of [0,s*0.45,s*0.9,s*1.35,-s*0.45,-s*0.9,-s*1.35]){
  const nx=e.x+Math.cos(ang+da)*st,ny=e.y+Math.sin(ang+da)*st;
  if(room.walk(nx,ny)){e.x=nx;e.y=ny;if(da!==0)e.side=Math.sign(da);moved=true;break;}
 }
 if(Math.abs(dx)>0.6)e.face=dx>0?1:-1;
 if(!moved){e.moving=false;return true;}
 e.stuckT=(e.stuckT||0)+dt;
 if(d<(e.lastD||1e9)-0.05){e.lastD=d;e.stuckT=0;}
 if(e.stuckT>1.5){e.moving=false;e.lastD=1e9;e.stuckT=0;return true;}
 e.walking=true;return false;
}
function randTarget(n){
 for(let i=0;i<24;i++){const x=rnd(18,302),y=rnd(room.ymin+3,room.ymax-3);if(!room.walk(x,y))continue;if(room.exits.some(ex=>inRect(ex,x,y)))continue;const b=room.bath?room.bath(x,y):false;if(n.bath&&!b)continue;if(!n.bath&&b&&Math.random()<0.75)continue;return[x,y];}
 return[n.x,n.y];
}
let lastBathSay=-99,inkoT=8;
function updWorld(dt){
 const r=room;
 for(const e of r.npcList)e.walking=false;
 player.walking=false;
 if(scene==='world'&&!fade.on&&!modalOpen){
  const kx=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
  const ky=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);
  const sp=player.inBath?32:54;
  if(kx||ky){
   const l=Math.hypot(kx,ky),nx=player.x+kx/l*sp*dt,ny=player.y+ky/l*sp*dt;
   if(r.walk(nx,ny)){player.x=nx;player.y=ny;}else if(kx&&r.walk(nx,player.y))player.x=nx;else if(ky&&r.walk(player.x,ny))player.y=ny;
   if(kx)player.face=kx;player.path=null;player.tx=player.x;player.ty=player.y;player.moving=false;player.act=null;player.walking=true;player.sit=false;player.dance=false;
  }else if(player.moving){
   let arrived=moveEnt(player,dt,sp);
   if(arrived&&player.path&&player.path.length&&Math.hypot(player.tx-player.x,player.ty-player.y)<2){const w=player.path.shift();player.tx=w[0];player.ty=w[1];player.moving=true;player.lastD=1e9;player.stuckT=0;arrived=false;}
   if(arrived&&player.act){const a=player.act;player.act=null;a();}
  }
  for(const ex of r.exits){if(inRect(ex,player.x,player.y)){goRoom(ex.to,ex.sx,ex.sy,ex.f);break;}}
  const wasBath=player.inBath;player.inBath=!!(r.bath&&r.bath(player.x,player.y));
  if(player.inBath&&!wasBath){sfx('plop');burst(player.x,player.y-6,'#e8fff0',8,30);if(T-lastBathSay>20){lastBathSay=T;setTimeout(()=>{if(player.inBath)say(player,'はぁ〜…ごくらく…');},700);}}
  if(player.hat==='inko'){inkoT-=dt;if(inkoT<=0){inkoT=rnd(9,18);sfx('chirp');parts.push({x:player.x+(player.face>0?6:-6),y:player.y-30,vx:rnd(-4,4),vy:-12,life:0,max:1.2,col:'#86d83e',k:'note',scene:'world'});}}
 }
 for(const n of r.npcList){
  if(!n.fixed){
   if(n.moving){if(moveEnt(n,dt,n.bath?14:24)){n.wait=n.dance?rnd(5,12):rnd(2,7);}}
   else{n.wait-=dt;if(n.wait<=0){const p=randTarget(n);n.tx=p[0];n.ty=p[1];n.moving=true;n.lastD=1e9;n.stuckT=0;}}
  }
  n.inBath=!!(r.bath&&r.bath(n.x,n.y));
  n.sayT-=dt;if(n.sayT<=0&&n.say&&T<n.say.until)n.sayT=1;if(n.sayT<=0){n.sayT=rnd(8,18);if(Math.random()<0.3)setEmote(n,pick(npcEmos(r)));else say(n,Math.random()<0.6?pick(tod===2&&r.outdoor?r.lines.filter(l=>!/天気|砂あっつ/.test(l)):r.lines):pick(nightLines(r)));}
  if(n.inBath&&Math.random()<dt*0.35)parts.push({x:n.x+rnd(-3,3),y:n.y-18,vx:rnd(-3,3),vy:-10,life:0,max:1.3,col:'#ff7aa0',k:'heart',scene:'world'});
 }
 if(player.inBath&&Math.random()<dt*0.4)parts.push({x:player.x+rnd(-3,3),y:player.y-18,vx:rnd(-3,3),vy:-10,life:0,max:1.3,col:'#ff7aa0',k:'heart',scene:'world'});
 for(const rm of remotes.values()){
  const dx=rm.tx-rm.x,dy=rm.ty-rm.y;rm.walking=Math.hypot(dx,dy)>0.4;if(Math.abs(dx)>0.3)rm.face=dx>0?1:-1;
  const k=Math.min(1,dt*8);rm.x+=dx*k;rm.y+=dy*k;rm.inBath=!!(ROOMS[rm.room]&&ROOMS[rm.room].bath&&ROOMS[rm.room].bath(rm.x,rm.y));
  if(performance.now()-rm.last>4500){dropEl(rm);remotes.delete(rm.id);updHud();}
 }
 const ents=r.npcList.concat(scene==='world'?[player]:[]);
 r.update&&r.update(dt,T,ents);
}
function npcEmos(r){const a=['note','heart','smile','yuzu'];if(r.id==='onsen')a.push('onsen','onsen','zzz');if(r.id==='disco')a.push('note','bang');if(r.id==='shop')a.push('q','heart');if(tod===2)a.push('zzz');return a;}
function playerEmote(k){
 if(scene!=='world'||!EMO_DEF[k])return;
 setEmote(player,k);sfx('pop');bcPost({type:'emo',id:myId,k});
 let best=null,bd=90;for(const n of room.npcList){const d=Math.hypot(n.x-player.x,n.y-player.y);if(d<bd){bd=d;best=n;}}
 if(best){const rid=room.id;setTimeout(()=>{if(room.id===rid&&scene==='world'){setEmote(best,EMO_REACT[k]||'smile');best.sayT=Math.max(best.sayT,4);}},rnd(700,1300));}
}
function nightLines(r){if(tod===2)return r.outdoor?['星きれい〜','夜の島もいいね','ねむくなってきた']:r.lines;if(tod===1)return['夕焼けきれい','そろそろ晩ごはん？','空がオレンジ'];return r.lines;}

function drawWorld(c,t){
 const r=room;
 c.drawImage(bgOf(r),0,0);
 r.fx&&r.fx(c,t);
 const list=r.npcList.slice();
 if(scene==='world')list.push(player);
 for(const rm of remotes.values())if(rm.room===r.id)list.push(rm);
 const items=list.map(e=>({y:e.y,e}));
 for(const p of r.props||[])items.push(p);
 items.sort((a,b)=>a.y-b.y);
 for(const it of items){if(it.e)drawCapy(c,it.e,t);else it.d(c,t);}
 r.fg&&r.fg(c,t);
 drawParts(c);
 if(r.outdoor&&tod>0){
  c.save();c.globalCompositeOperation='multiply';c.fillStyle=tod===1?'#f7b88a':'#4b5aa0';c.fillRect(0,0,W,H);c.restore();
  if(tod===2){stars(c,r.skyH,t);r.night&&r.night(c,t);c.save();c.globalCompositeOperation='lighter';for(const L of r.lights||[])glow(c,L[0],L[1],L[2],L[3]);c.restore();}
 }
 for(const e of list)drawEmote(c,e);
 syncEls(list);
}

 [/なみ|波|サーフ/,['波きてる！','小屋でボード借りれるで','くるりん決めたい']],

 [/おなか|すいた|ごはん|たべ/,['草たべよ','おだんご食べたい','おはぎもいいね']],
 [/ありがと|感謝/,['どういたしまして〜','いえいえ〜']],
 [/さよ|ばいばい|またね|おやすみ/,['またね〜','おやすみ〜','ばいばい！']],
 [/温泉|おんせん|風呂|ふろ/,['温泉はひろばの右やで','ごくらくやで〜']],
 [/コイン|お金|おかね/,['ミニゲームでかせげるよ','ゆず積みがおすすめ']]];
const GENERIC=['わかる〜','それな','のんびりいこ〜','えへへ','ほんまそれ','いいね！','ふむふむ','たしかに〜'];
function npcReact(text){
 const ns=room.npcList;if(!ns.length)return;
 let reply=null;for(const[re,arr]of REPLIES){if(re.test(text)){reply=pick(arr);break;}}
 if(!reply){if(Math.random()>0.55)return;reply=pick(GENERIC);}
 let best=null,bd=1e9;for(const n of ns){const d=Math.hypot(n.x-player.x,n.y-player.y)+Math.random()*60;if(d<bd){bd=d;best=n;}}
 const rid=room.id;setTimeout(()=>{if(room.id===rid&&scene==='world'){say(best,reply);best.sayT=Math.max(best.sayT,7);sfx('chat');}},rnd(800,1800));
}
function sendChat(v){
 v=(v||'').trim();if(!v||scene!=='world')return;
 say(player,v);sfx('chat');bcPost({type:'chat',id:myId,text:v});npcReact(v);
 if(/おどろ|ダンス|踊/.test(v)&&room.id==='disco'){player.dance=true;}
}

const YZ={
 reset(){this.state='ready';this.x=160;this.vx=0;this.target=160;this.stack=[];this.fall=[];this.score=0;this.lives=3;this.spawnT=0.5;this.t=0;this.debris=[];this.baskets=0;this.dropX=null;},
 baseX(){return Math.round(this.x)+4;},
 topX(){return this.stack.length?this.stack[this.stack.length-1].x:this.baseX();},
 topY(){return 149-this.stack.length*6;},
 start(){if(this.state!=='ready')return;this.state='play';sfx('pop');$('#ghC').textContent='';},
 update(dt){
  this.t+=dt;
  for(let i=this.debris.length-1;i>=0;i--){const d=this.debris[i];d.vy+=260*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.r+=d.vr*dt;if(d.y>200)this.debris.splice(i,1);}
  if(this.state!=='play')return;
  const k=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
  const mv=112;let vx;
  if(k){vx=k*mv;this.target=this.x;}else vx=clamp((this.target-this.x)*7,-mv,mv);
  this.vx=vx;this.x=clamp(this.x+vx*dt,16,300);
  let below=this.baseX();
  for(let i=0;i<this.stack.length;i++){const s=this.stack[i];const kf=Math.max(9,24-i*1.8);s.x+=(below-s.x)*Math.min(1,kf*dt);if(Math.abs(s.x-below)>6.5){this.collapse();return;}below=s.x;}
  this.spawnT-=dt;
  const maxFall=this.score<12?1:this.score<30?2:3;
  if(this.spawnT<=0&&this.fall.length<maxFall){
   const vy=Math.min(58+this.score*2.4,120);const ft=(this.topY()+8)/vy;const reach=mv*ft*0.5;
   this.fall.push({x:clamp(this.topX()+rnd(-reach,reach),20,300),y:-8,vy,gold:Math.random()<0.1});
   this.spawnT=rnd(0.6,1.2)*Math.max(0.5,1-this.score*0.02);
  }
  for(let i=this.fall.length-1;i>=0;i--){
   const f=this.fall[i],py=f.y;f.y+=f.vy*dt;const ty=this.topY();
   if(py<ty&&f.y>=ty&&Math.abs(f.x-this.topX())<=6.5){
    this.fall.splice(i,1);this.stack.push({x:f.x});this.score+=f.gold?3:1;sfx('catch',this.stack.length);
    popText(f.x,ty-10,f.gold?'金のゆず +3':'+1',f.gold?'gold':'');
    if(this.stack.length>=8)this.basket();
    continue;
   }
   if(f.y>=170){this.fall.splice(i,1);this.dropX=f.x;this.miss('落としちゃった！',f.x);if(this.state!=='play')return;continue;}
  }
  this.hud();
 },
 basket(){
  this.score+=5;this.baskets++;sfx('bonus');popText(this.baseX(),90,'カゴへポン！ +5','gold');
  this.stack.forEach((s,i)=>this.debris.push({x:s.x,y:149-i*6,vx:(300-s.x)*rnd(0.9,1.3),vy:-rnd(120,180),r:0,vr:rnd(-6,6),toBasket:true}));
  this.stack=[];
 },
 collapse(){
  this.stack.forEach((s,i)=>this.debris.push({x:s.x,y:149-i*6,vx:rnd(-80,80)+this.vx*0.6,vy:-rnd(40,120),r:0,vr:rnd(-8,8)}));
  this.stack=[];this.miss('くずれちゃった！',this.baseX());
 },
 miss(msg,x){
  this.lives--;
  if(this.lives<=0){this.over(msg);return;}
  sfx('plop');burst(x,160,'#f5c21b',8,40);popText(clamp(x,40,280),120,msg.replace('ちゃった！','た！')+' のこり'+this.lives);this.hud();
 },
 over(msg){
  if(this.state!=='play')return;this.state='over';sfx('fail');
  const coins=this.score*2;save.coins+=coins;const isBest=this.score>save.best.yuzu;if(isBest)save.best.yuzu=this.score;persist();updHud();this.hud();
  $('#ghC').textContent=msg;
  setTimeout(()=>{if(scene==='yuzu')gameOver('ゆず積み',msg,'ゆず '+this.score+' こ',coins,isBest,()=>startYuzu());},1100);
 },
 pointer(x,down){this.target=x;if(down&&this.state==='ready')this.start();},
 hud(){$('#ghL').textContent='ゆず '+this.score+' こ　いのち '+'●'.repeat(Math.max(0,this.lives))+'○'.repeat(Math.max(0,3-this.lives));$('#ghR').textContent='ベスト '+save.best.yuzu;},
 draw(c,t){
  sky(c,0,90);
  ell(c,80,100,120,26,'#86b87e');ell(c,260,104,110,30,'#78ac72');
  R(c,0,122,W,58,'#94c86a');for(let i=0;i<120;i++)R(c,(i*53)%W,124+(i*29)%40,2,1,i%2?'#86b85c':'#a2d478');
  for(let i=0;i<9;i++){const x=i*40+10,y=112;R(c,x-2,y,4,20,'#6a4424');tree(c,x,y-4,16,'#3f8a3a','#52a048');for(let k=0;k<4;k++){R(c,x-10+((k*7+i*3)%20),y-14+((k*5+i)%12),3,3,'#f5c21b');}}
  R(c,0,166,W,14,'#8cc063');R(c,0,166,W,1,'#7ab055');for(let x=0;x<W;x+=7)R(c,x,168+(x%3),2,1,'#9dcc70');
  R(c,288,150,26,16,'#a06a36');for(let x=290;x<312;x+=4)R(c,x,152,2,12,'#c08850');R(c,286,148,30,3,'#7a4a28');
  if(this.baskets>0){const n=Math.min(12,this.baskets*3);for(let i=0;i<n;i++)drawYuzu(c,292+(i%4)*6,150-Math.floor(i/4)*4,false);}
  for(const f of this.fall){const sh=clamp((f.y+10)/170,0.2,1);ell(c,f.x,167,Math.round(2+sh*3),1,'rgba(40,24,10,'+(0.12+sh*0.2).toFixed(2)+')');drawYuzu(c,f.x,f.y,f.gold,t);}
  const me={x:this.x,y:166,face:1,walking:Math.abs(this.vx)>6,color:save.color,hat:'',ph:0,happyT:this.state==='over'?0:(this.stack.length>3?T+1:0)};
  drawCapy(c,me,t);
  for(let i=0;i<this.stack.length;i++)drawYuzu(c,this.stack[i].x,149-i*6,false);
  for(const d of this.debris){c.save();c.translate(Math.round(d.x),Math.round(d.y));c.rotate(d.r);drawYuzu(c,0,3,false);c.restore();}
  if(this.dropX!==null){R(c,this.dropX-4,168,9,2,'#f5c21b');}
  drawParts(c);
 }
};

 },

 nameIn.value=(tabMe&&tabMe.name)||save.name||'';if(!nameIn.value)nameIn.value=pick(NAMES);
 cColor=(tabMe&&tabMe.color)||save.color;buildPal();
 $('#createNote').innerHTML=save.name?'つづきから：<span class="coin"></span>'+save.coins+' コイン・ぼうし '+save.owned.length+'こ':'はじめのおこづかい <b>50コイン</b> と <b>ゆずの帽子</b> つき';
 $('#startBtn').textContent=save.name?'しまへもどる':'しまへ行く';
}
$('#rndName').onclick=()=>{audioStart();let n;do{n=pick(NAMES);}while(n===nameIn.value);nameIn.value=n;sfx('pop');};
$('#startBtn').onclick=()=>{
 audioStart();
 let n=nameIn.value.trim().slice(0,8);if(!n)n=pick(NAMES);
 save.name=n;save.color=cColor;persist();tabMe={name:n,color:cColor};persistTab();
 player.name=n;player.color=cColor;player.hat=save.hat;
 createOpen=false;createEl.classList.add('hidden');sfx('buy');
 if(scene==='create'){
  scene='world';enterRoom('plaza',160,166,1);
  if(!save.tutorial){save.tutorial=true;persist();setTimeout(()=>toast('クリック（タップ）した所へ歩くよ。画面のはしっこや扉からとなりの部屋へ！',5200),900);}
  const n0=room.npcList[0];setTimeout(()=>{if(room.id==='plaza')say(n0,'ようこそ、'+n+'！');},1400);
 }else{updHud();bcSend(true);}
};
nameIn.addEventListener('keydown',e=>{if(e.key==='Enter')$('#startBtn').click();});
function updPreview(){
 if(!createOpen)return;
 const blink=(T%3.2)<0.14;
 drawPreview(prev,cColor,save.hat||'yuzu',blink?'blink':'open',T);
 $('#prevName').textContent=nameIn.value||'　';
}

// ======================================================================
//  BroadcastChannel（同じブラウザの別タブ）
// ======================================================================
const myId=Math.random().toString(36).slice(2,9);
let bc=null;try{if('BroadcastChannel'in window)bc=new BroadcastChannel('capy-island-jp');}catch(e){bc=null;}
let bcT=0;
function bcPost(m){if(bc)try{bc.postMessage(m);}catch(e){}}
function bcSend(){if(!bc)return;bcPost({type:'st',id:myId,name:player.name,color:player.color,hat:player.hat,room:scene==='world'?room.id:null,x:Math.round(player.x*10)/10,y:Math.round(player.y*10)/10,sit:player.sit,dance:player.dance});}
if(bc)bc.onmessage=ev=>{
 const m=ev.data;if(!m||m.id===myId)return;
 if(m.type==='st'){
  let r=remotes.get(m.id);
  if(!r){r=mkCapy({id:m.id,remote:true,x:m.x,y:m.y});remotes.set(m.id,r);bcSend();}
  if(r.room!==m.room){r.x=m.x;r.y=m.y;}
  Object.assign(r,{name:m.name,color:m.color,hat:m.hat,room:m.room,tx:m.x,ty:m.y,sit:m.sit,dance:m.dance,last:performance.now()});
  updHud();
 }else if(m.type==='emo'){const r=remotes.get(m.id);if(r&&EMO_DEF[m.k]){setEmote(r,m.k);if(r.room===room.id)sfx('pop');}}
 else if(m.type==='chat'){const r=remotes.get(m.id);if(r){say(r,String(m.text).slice(0,40));if(r.room===room.id)sfx('chat');}}
 else if(m.type==='bye'){const r=remotes.get(m.id);if(r){dropEl(r);remotes.delete(m.id);updHud();}}
};
window.addEventListener('pagehide',()=>bcPost({type:'bye',id:myId}));

// ======================================================================
//  入力
// ======================================================================
function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
 audioStart();const p=toGame(e);emoPal.classList.add('hidden');
 if(scene==='world'){
  if(fade.on||modalOpen)return;
  for(const it of room.inter){if(inRect(it,p.x,p.y)){walkTo(it.ax,it.ay,it.act);return;}}
  walkTo(p.x,p.y,null);
 }else if(scene==='yuzu')YZ.pointer(p.x,true);
 else if(scene==='surf')SF.tap();
});
cv.addEventListener('pointermove',e=>{if(scene==='yuzu'&&(e.pointerType==='mouse'||e.buttons))YZ.pointer(toGame(e).x,false);});
const chatIn=$('#chatIn');
$('#chatF').addEventListener('submit',e=>{e.preventDefault();audioStart();sendChat(chatIn.value);chatIn.value='';if(matchMedia('(pointer:coarse)').matches)chatIn.blur();});
window.addEventListener('keydown',e=>{
 audioStart();
 const ae=document.activeElement;
 if(ae===chatIn){if(e.key==='Escape')chatIn.blur();return;}
 if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
 if(modalOpen){if(e.key==='Escape'&&scene==='world')closeModal();return;}
 if(createOpen)return;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 keys[e.code]=true;
 if(scene==='world'&&e.key==='Enter'){e.preventDefault();chatIn.focus();}
 if(scene==='world'&&!e.repeat&&/^Digit[1-9]$/.test(e.code))playerEmote(EMO_KEYS[+e.code.slice(5)-1]);
 if(scene==='surf'&&!e.repeat&&['Space','ArrowUp','KeyW','Enter'].includes(e.code))SF.tap();
 if(scene==='yuzu'&&YZ.state==='ready'&&['Space','Enter','ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))YZ.start();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.addEventListener('pointerdown',()=>audioStart(),{once:false,passive:true});

const emoPal=$('#emoPal');
for(const [i,k] of EMO_KEYS.entries()){const b=document.createElement('button');b.type='button';b.title=EMO_DEF[k].n+'（'+(i+1)+'）';b.setAttribute('aria-label',EMO_DEF[k].n);b.dataset.k=k;const c2=mk(9,9);c2.getContext('2d').drawImage(emoSpr[k],0,0);b.append(c2);b.onclick=ev=>{ev.stopPropagation();emoPal.classList.add('hidden');playerEmote(k);};emoPal.append(b);}
$('#bEmo').onclick=()=>{if(scene!=='world')return;sfx('click');emoPal.classList.toggle('hidden');};
$('#bDance').onclick=()=>{if(scene!=='world')return;player.dance=!player.dance;player.sit=false;player.moving=false;sfx('pop');bcSend();};
$('#bSit').onclick=()=>{if(scene!=='world')return;player.sit=!player.sit;player.dance=false;player.moving=false;sfx('pop');bcSend();};
$('#bMap').onclick=()=>{if(scene!=='world')return;sfx('click');openMap();};
$('#bHat').onclick=()=>{if(scene!=='world')return;sfx('click');openHats('closet');};
const TOD=['昼','夕','夜'];
function updTod(){$('#bTod').textContent=TOD[tod];}
$('#bTod').onclick=()=>{tod=(tod+1)%3;updTod();sfx('click');toast(['お昼になった','夕方になった','夜になった'][tod],1200);};
function updSnd(){$('#bSnd').textContent=save.muted?'音:OFF':'音:ON';if(AU.master)AU.master.gain.value=save.muted?0:0.55;}
$('#bSnd').onclick=()=>{audioStart();save.muted=!save.muted;persist();updSnd();};
$('#bMe').onclick=()=>{if(scene!=='world')return;openCreate();};

// ======================================================================
//  ループ
// ======================================================================
let lastNow=performance.now();
function frame(now){
 const dt=Math.min(0.05,(now-lastNow)/1000);lastNow=now;T+=dt;
 try{
  if(scene==='yuzu')YZ.update(dt);else if(scene==='surf')SF.update(dt);else updWorld(dt);
  updParts(dt);updFade(dt);
  bcT-=dt;if(bcT<=0){bcT=0.25;bcSend();}
  if(scene==='yuzu')YZ.draw(ctx,T);else if(scene==='surf')SF.draw(ctx,T);else drawWorld(ctx,T);
  drawFade(ctx);
  updPreview();
 }catch(err){console.error(err);}
 requestAnimationFrame(frame);
}
updTod();updSnd();layout();buildLabels();openCreate();updHud();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
requestAnimationFrame(frame);

window.__capy={get scene(){return scene;},get room(){return room.id;},get npcs(){return room.npcList;},get remotes(){return [...remotes.values()];},playerEmote,player,save,YZ,SF,go:(id)=>{const sp=ROOMS[id].spawn;enterRoom(id,sp[0],sp[1],1);},addCoins:n=>{save.coins+=n;persist();updHud();},setTod:v=>{tod=v;updTod();},startYuzu,startSurf,exitGame};
})();
</script>
</body>
</html>

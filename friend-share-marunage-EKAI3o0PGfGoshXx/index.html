<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>『全部、AIに丸投げした。』を、飛び出す絵本で読む｜おけもんの読書ノート</title>
<style>
  :root { --bg:#fbf5e9; --ink:#2f2a38; --green:#24584c; --red:#e23a2e; --dim:#7a7068; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding: clamp(20px, 5vw, 52px) 16px 48px;
  }
  .kicker { display:inline-block; margin:0 0 14px; padding:6px 18px; border-radius:999px; background:var(--green); color:#fff;
            font-size: clamp(12px, 3.2vw, 15px); font-weight:700; letter-spacing:.06em; }
  h1 { font-size: clamp(26px, 7.4vw, 50px); line-height:1.3; margin:0 0 8px; text-align:center; font-weight:900; }
  h1 em { font-style:normal; color:var(--red); }
  .by { font-size: clamp(13px, 3.4vw, 16px); color:var(--dim); margin:0 0 clamp(18px, 4vw, 30px); text-align:center; }
  .stage { width:100%; max-width:1080px; }
  video { display:block; width:100%; aspect-ratio:16/9; background:#000; border-radius:14px;
          border:4px solid var(--ink); box-shadow: 0 8px 0 rgba(47,42,56,.18); }
  .note { max-width:680px; margin: clamp(20px, 5vw, 34px) auto 0; text-align:center;
          font-size: clamp(15px, 3.8vw, 18px); line-height:2; }
  .note b { color:var(--red); }
  .hint { margin-top: 20px; font-size: clamp(12px, 3.1vw, 14px); color:var(--dim); text-align:center; line-height:1.8; }
</style>
</head>
<body>
  <p class="kicker">おけもんの読書ノート</p>
  <h1>『全部、<em>AIに丸投げ</em>した。』</h1>
  <p class="by">大塚あみ 著（新潮社）を、飛び出す絵本で読む　16分44秒</p>

  <div class="stage">
    <video controls playsinline preload="metadata" poster="poster.jpg?v=1">
      <source src="marunage.mp4?v=1" type="video/mp4">
    </video>
  </div>

  <div class="note">
    <p>カピバラのおけもんと、聞き役のインコが、<br>この本の7つの考え方を掛け合いで読んでいきます。<br>
    <b>音を出して</b>どうぞ。</p>
  </div>

  <p class="hint">本の感想を話したい人への共有用です。このページの URL は、もらった人の中だけでお願いします。<br>
  本の中身は、ぜひ本そのもので。</p>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="おけもんが作った、触って遊べる3D作品の入口。">
  <title>おけもんの3D作品</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #22312b; background: #f3f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 64px; }
    .eyebrow { margin: 0 0 10px; color: #436d5b; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 52px); line-height: 1.25; }
    .intro { max-width: 680px; margin: 16px 0 30px; line-height: 1.8; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .work { display: block; overflow: hidden; border: 1px solid #d7e1d5; border-radius: 20px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 8px 28px #20352b0d; }
    .work:hover, .work:focus-visible { outline: 3px solid #72aa88; outline-offset: 3px; }
    .work img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #dfe8db; }
    .work-body { display: block; padding: 18px 20px 20px; }
    .work strong { display: block; font-size: 21px; }
    .work small { display: block; margin-top: 7px; color: #53685b; font-size: 14px; line-height: 1.65; }
    .open { display: block; margin-top: 13px; color: #206147; font-weight: 700; }
    footer { margin-top: 34px; font-size: 14px; }
    footer a { color: #206147; }
    @media (max-width: 660px) { main { padding-top: 30px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">OKEMON · INTERACTIVE WORKS</p>
  <h1>おけもんの3D作品</h1>
  <p class="intro">眺めるだけでなく、触って遊べる作品を集めました。気になる作品を押すと、そのまま体験できます。</p>
  <div class="grid">
    <a class="work" href="astra-watermill-2026-10-03/" target="_blank" rel="noopener"><img src="lab-works/thumbs/astra-lab-2026-10-03-watermill-8b06a7.jpg" alt="水車小屋の午後の画面" loading="lazy"><span class="work-body"><strong>水車小屋の午後</strong><small>水の流れを変えて、水車と歯車の動きを眺める。</small><span class="open">作品を開く ↗</span></span></a>
    <a class="work" href="astra-paper-forest-2026-10-03/" target="_blank" rel="noopener"><img src="lab-works/thumbs/astra-lab-2026-10-03-paper-forest-190171.jpg" alt="ひらく、紙の森の画面" loading="lazy"><span class="work-body"><strong>ひらく、紙の森</strong><small>本をひらくと、紙の森が立ち上がる飛び出す絵本。</small><span class="open">作品を開く ↗</span></span></a>
    <a class="work" href="astra-ink-board-2026-10-03/" target="_blank" rel="noopener"><img src="lab-works/thumbs/astra-lab-2026-10-03-ink-board-31f862.jpg" alt="インクの盤上の画面" loading="lazy"><span class="work-body"><strong>インクの盤上</strong><small>ペン画の駒を並べ、角度や線の濃さを変えて遊ぶ。</small><span class="open">作品を開く ↗</span></span></a>
    <a class="work" href="astra-little-engine-2026-10-04/" target="_blank" rel="noopener"><img src="lab-works/thumbs/astra-lab-2026-10-03-little-engine-deca77.jpg" alt="風の機関室の画面" loading="lazy"><span class="work-body"><strong>風の機関室</strong><small>殻をひらき、羽根と軸を分解・回転できる模型。</small><span class="open">作品を開く ↗</span></span></a>
    <a class="work" href="puru-mori/" target="_blank" rel="noopener"><img src="lab-works/thumbs/puru-mori.png" alt="ぷるもり。の画面" loading="lazy"><span class="work-body"><strong>ぷるもり。</strong><small>カピバラとインコのゼリーをつつき、つまんで遊ぶ。</small><span class="open">作品を開く ↗</span></span></a>
  </div>
  <footer>映像も見るなら <a href="motion-recipe/#gallery">おけもんの映像作品へ ↗</a></footer>
</main>
</body>
</html>

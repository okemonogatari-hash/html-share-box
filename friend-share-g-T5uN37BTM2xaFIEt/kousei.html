<!doctype html>
<html lang="ja" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="color-scheme" content="light only">
<title>かどっちオン秘書の全体のしくみ</title>
<style>
:root{--bg:#f5f8f3;--card:#fff;--ink:#17261f;--sub:#4d5d55;--line:#d9e4dc;--green:#17734b;--deep:#0f5235;--pale:#e3f1e8;--sun:#ffd166;--sunink:#3d2a00;--sky:#e6f0fb;--skyink:#174a7c}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:17px;line-height:1.8;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
.mast{display:inline-block;background:var(--pale);color:var(--deep);font-weight:700;font-size:13.5px;letter-spacing:.06em;border-radius:999px;padding:4px 14px;margin:0 0 12px}
h1{font-size:28px;line-height:1.45;margin:0 0 10px;text-wrap:balance}
h1 span{display:inline-block}
.lead{margin:0 0 22px;color:#2b3a33}
h2{font-size:20px;line-height:1.5;margin:34px 0 12px}
p{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.screen{background:#0f2219;border-radius:16px;padding:10px}
.screen .top{display:flex;gap:6px;padding:2px 4px 8px}
.screen .top span{width:9px;height:9px;border-radius:50%;background:#3d5a4b}
.board{background:#fff;border-radius:10px;padding:12px}
.board h3{margin:0 0 8px;font-size:15.5px;line-height:1.5;display:flex;justify-content:space-between;gap:8px;align-items:center}
.board h3 b{background:var(--sun);color:var(--sunink);font-size:13px;border-radius:999px;padding:2px 10px;white-space:nowrap}
.person{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px;line-height:1.6}
.person strong{display:block;font-size:15px}
.person span{display:inline-block;background:var(--pale);color:var(--deep);border-radius:6px;padding:0 8px;margin:4px 4px 0 0;font-size:13px}
.cap{font-size:14px;color:var(--sub);margin:8px 2px 0}
.three{display:grid;gap:10px;counter-reset:n;margin:0;padding:0;list-style:none}
.three li{counter-increment:n;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 56px;position:relative;line-height:1.6}
.three li::before{content:counter(n);position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;display:grid;place-items:center;line-height:1}
.three b{display:block;font-size:17px}
.three small{display:block;color:var(--sub);font-size:14.5px}
.weeks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.weeks li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;line-height:1.55;font-size:15.5px}
.weeks em{font-style:normal;font-weight:700;color:var(--deep);background:var(--pale);border-radius:10px;padding:6px 4px;text-align:center;font-size:14.5px}
.weeks li.goal{background:var(--sun);border-color:#e8b93f;color:var(--sunink)}
.weeks li.goal em{background:#fff3cf;color:var(--sunink)}
.first{background:var(--green);color:#fff;border-radius:16px;padding:18px;margin-top:34px}
.first b{display:block;font-size:19px;line-height:1.5;margin-bottom:4px}
.first p{margin:0;color:#e7f5ec;font-size:15px}
.first a{color:#fff;font-weight:700}
.first ol{margin:6px 0 10px;padding-left:1.4em}
.first li{margin:6px 0;line-height:1.6}
.first li b{display:inline;font-size:17px;margin:0}
.keep{background:#fff;border:2px solid #e8b93f;border-radius:16px;padding:14px 16px;margin-top:26px}
.keep>b{display:block;font-size:18px;line-height:1.5;margin-bottom:4px}
.keep ol{margin:0;padding-left:1.3em;font-size:15.5px;line-height:1.7}
.keep li{margin:5px 0}
.first{margin-top:14px!important}
.fig{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px}
.fig svg{display:block;width:100%;max-width:680px;height:auto;margin:0 auto;font-family:inherit}
table.steps{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:15.5px;line-height:1.6;margin-top:12px}
.steps td,.steps th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.steps tr:last-child td,.steps tr:last-child th{border-bottom:0}
.steps th{width:48px;text-align:center;font-size:16px;background:#1b2620;color:#fff}
.steps th.d2{background:#174a7c;font-size:14px}.steps th.d3{background:#8f1d44;font-size:14px}
.cap a{color:#174a7c}
.more{margin:40px 0 10px;color:var(--sub);font-size:15px;text-align:center}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
summary{cursor:pointer;padding:13px 16px;font-weight:700;line-height:1.5;list-style:none;position:relative;padding-right:44px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--green);font-weight:700}
details[open] summary::after{content:"－"}
details .in{padding:0 16px 14px;font-size:16px}
details ul{margin:0;padding-left:1.25em}
details li{margin:5px 0}
@media (max-width:420px){body{font-size:16.5px}h1{font-size:24px}.weeks li{grid-template-columns:80px minmax(0,1fr)}}
</style></head>

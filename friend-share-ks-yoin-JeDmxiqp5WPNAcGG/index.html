<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>出逢いが、未来を変える。｜伝説のキッチンシュガーⅢ ふりかえりムービー</title>
<style>
  :root { --bg:#120c08; --ink:#f3e9d6; --gold:#d9b86a; --dim:#a8997f; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding: clamp(20px, 5vw, 56px) 16px 48px;
    background: radial-gradient(ellipse at 50% 0%, #2a1c10 0%, var(--bg) 60%);
  }
  .kicker { font-size: clamp(12px, 3.2vw, 15px); letter-spacing:.18em; color:var(--gold); text-align:center; margin:0 0 10px; }
  h1 { font-size: clamp(28px, 8vw, 56px); line-height:1.25; margin:0 0 6px; text-align:center; font-weight:600; letter-spacing:.04em; }
  .date { font-size: clamp(13px, 3.4vw, 16px); color:var(--dim); margin:0 0 clamp(18px, 4vw, 32px); text-align:center; }
  .stage { width:100%; max-width:1080px; }
  video { display:block; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px;
          box-shadow: 0 0 0 1px rgba(217,184,106,.35), 0 24px 60px rgba(0,0,0,.6); }
  .note { max-width:680px; margin: clamp(20px, 5vw, 36px) auto 0; text-align:center;
          font-size: clamp(15px, 3.8vw, 18px); line-height:2; }
  .note b { color:var(--gold); font-weight:600; }
  .credit { margin-top: 22px; font-size: clamp(13px, 3.3vw, 15px); line-height:1.9; color:var(--dim); text-align:center; }
  .hint { margin-top: 18px; font-size: clamp(12px, 3.1vw, 14px); color:var(--dim); text-align:center; }
</style>
</head>
<body>
  <p class="kicker">伝説のキッチンシュガーⅢ ／ 第16回 出逢いが未来を変える大交流会</p>
  <h1>出逢いが、<br>未来を変える。</h1>
  <p class="date">2026年11月22日（日）　大阪　kitchen Sugar</p>

  <div class="stage">
    <video controls playsinline preload="metadata" poster="poster.jpg?v=19">
      <source src="yoin.mp4?v=19" type="video/mp4">
    </video>
  </div>

  <div class="note">
    <p>あの夜の余韻を、2分45秒にまとめました。<br>
    <b>音を出して</b>、できれば横向きの大きな画面でどうぞ。</p>
  </div>

  <p class="credit">
    主催　JACKさん　／　幹事　ゆうりんさん・ますまるさん　／　サンクス　ちょるさん<br>
    会場　kitchen Sugar　moriさん<br>
    この夜が、kitchen Sugar としての最後の貸し切りでした。ありがとうございました。
  </p>
  <p class="hint">参加したみなさんへの共有用です。このページの URL は、会のチャットの中だけでお願いします。</p>
</body>
</html>

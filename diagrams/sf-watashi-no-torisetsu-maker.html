<!DOCTYPE html>
<html lang="ja" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>わたしのトリセツ画像メーカー｜ストレングス初心者オフ会</title>
<style>
  /* ---------------------------------------------------------------
     配色は明るい紙の1本だけ。OS追従の分岐は持たない（持てば両方測る必要が出るし、
     端末が暗い設定の人に明るい姿を一度も見せられなくなる）。
     文字の色は --ink / --muted / --primary / --accent-ink の4つ、
     加えて濃い面に乗る時だけ --white。ワークシートの8色は「面」にだけ通す。
     --------------------------------------------------------------- */
  :root{
    --paper:#FBF8F3;
    --paper-deep:#F5F0E8;
    --line:#E4DACB;
    --line-soft:#EFE8DC;
    --ink:#1F1B16;
    --muted:#5F574C;
    --primary:#2C5F4B;
    --primary-deep:#20493A;
    --primary-tint:#E6EFEA;
    --accent-ink:#8A5A2B;
    --accent-line:#C4915E;
    --white:#FFFFFF;
    --radius:16px;
    --radius-sm:11px;
    --maxw:640px;

    /* SF4ドメイン色（上位5資質チップの面）。姉妹アプリのトークンをそのまま使う */
    --dom-exec-bg:#EFEAF6;   --dom-exec-ink:#5B4B8A;   --dom-exec-line:#B9A9D8;
    --dom-infl-bg:#FBEEDD;   --dom-infl-ink:#8F5C00;   --dom-infl-line:#DDB980;
    --dom-rel-bg:#E9F0F8;    --dom-rel-ink:#3D5E8C;    --dom-rel-line:#A9C0DC;
    --dom-think-bg:#E1F1F0;  --dom-think-ink:#0B6670;  --dom-think-line:#8FC2C4;
  }

  /* 紙のワークシートと同じ8色。--face=丸バッジと左の帯、--tint=カードの地、
     --deep=線画アイコンの線。文字はどこも --ink のまま。 */
  .w1{--face:#F0A050;--tint:#FCEEE0;--deep:#9E6A35;}
  .w2{--face:#4FA37A;--tint:#DFEEE7;--deep:#3E8160;}
  .w3{--face:#E58A9C;--tint:#FAEAED;--deep:#A3626F;}
  .w4{--face:#F2D25A;--tint:#FDF7E1;--deep:#857331;}
  .w5{--face:#5FB3D0;--tint:#E2F1F7;--deep:#427C90;}
  .w6{--face:#9B7CC0;--tint:#EDE7F4;--deep:#8469A3;}
  .w7{--face:#F07A3A;--tint:#FCE7DC;--deep:#B45C2C;}
  .w8{--face:#2C6B5A;--tint:#D9E4E1;--deep:#2C6B5A;}

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.85;
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3{
    margin:0 0 .5em;
    font-weight:700;
    text-wrap:balance;
    line-break:strict;
    word-break:auto-phrase;
  }
  p{margin:0 0 1em;}
  ul{margin:0 0 1em;padding-left:1.15em;}
  li{margin-bottom:.35em;}
  img{max-width:100%;}

  /* ---- JSが無い時 ---- */
  .noscript-banner{
    max-width:var(--maxw);
    margin:24px auto;
    padding:20px;
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--ink);
  }
  .noscript-banner h1{font-size:19px;color:var(--primary);}
  #app{display:none;}
  html.js-ready #app{display:block;}

  /* ---- 骨格 ---- */
  .shell{max-width:var(--maxw);margin:0 auto;padding:0 0 56px;min-height:100vh;}
  .topbar{
    position:sticky;top:0;z-index:5;
    background:var(--paper);
    padding:12px 20px 10px;
    border-bottom:1px solid var(--line);
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .brand{font-size:12.5px;color:var(--muted);letter-spacing:.02em;min-width:0;}
  .progress-track{height:6px;background:var(--paper-deep);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--primary);border-radius:99px;width:0%;transition:width .3s ease;}
  .step-label{font-size:12.5px;color:var(--muted);margin-top:6px;}
  main{padding:22px 20px 8px;}
  .footer-note{
    max-width:var(--maxw);margin:0 auto;padding:0 20px;
    font-size:12.5px;color:var(--muted);line-height:1.75;
  }

  /* ---- カード ---- */
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px;
    margin-bottom:16px;
  }
  .card-quiet{background:var(--paper-deep);border-color:var(--line-soft);}
  .eyebrow{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:700;
    color:var(--accent-ink);
    border:1px solid var(--accent-line);
    border-radius:99px;
    padding:2px 11px;margin-bottom:12px;
  }
  h1{font-size:23px;color:var(--primary);line-height:1.55;}
  .question{font-size:19px;color:var(--ink);margin-bottom:10px;line-height:1.6;word-break:auto-phrase;}
  h3{font-size:16.5px;color:var(--primary);}
  .lead-sm{font-size:14.5px;color:var(--muted);margin-bottom:14px;word-break:auto-phrase;}
  .hint{font-size:13.5px;color:var(--muted);margin:8px 0 0;}
  .body{font-size:15.5px;}

  /* ---- ボタン ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:46px;padding:10px 18px;
    border-radius:999px;
    font-size:15.5px;font-weight:700;font-family:inherit;line-height:1.5;
    border:1.5px solid transparent;
    cursor:pointer;text-decoration:none;
    transition:transform .12s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--primary);color:var(--white);}
  .btn-primary:hover{box-shadow:0 2px 10px rgba(32,73,58,.22);}
  .btn-ghost{background:var(--white);color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--accent-line);}
  .btn-sm{min-height:34px;padding:5px 13px;font-size:13px;}
  .btn[disabled]{background:var(--paper-deep);color:var(--muted);border-color:var(--line);cursor:not-allowed;}
  .btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
    outline:2.5px solid var(--primary);outline-offset:2px;
  }
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .btnrow .btn{flex:1 1 auto;}
  .btnrow-stack{flex-direction:column;}
  .btnrow-stack .btn{width:100%;}

  /* ---- 線画アイコン（絵文字は使わない） ---- */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .ico svg{width:20px;height:20px;display:block;}
  .ico-lg svg{width:26px;height:26px;}
  .ico-sm svg{width:16px;height:16px;}

  /* ---- 入力 ---- */
  label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  input[type=text],textarea{
    width:100%;
    font-family:inherit;font-size:15.5px;line-height:1.75;
    color:var(--ink);background:var(--white);
    border:1.5px solid var(--line);border-radius:var(--radius-sm);
    padding:9px 12px;
    transition:border-color .18s ease,box-shadow .18s ease;
  }
  input[type=text]:focus,textarea:focus{border-color:var(--primary);}
  textarea{resize:vertical;min-height:74px;}
  ::placeholder{color:var(--muted);opacity:1;}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .visually-hidden{
    position:absolute;width:1px;height:1px;
    overflow:hidden;clip-path:inset(50%);white-space:nowrap;
  }

  /* ---- チップ（選択肢はカード並びにしない） ---- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-family:inherit;font-size:14.5px;font-weight:600;line-height:1.5;
    color:var(--ink);background:var(--white);
    border:1.5px solid var(--line);border-radius:999px;
    padding:7px 14px;min-height:38px;
    cursor:pointer;
    transition:border-color .18s ease,box-shadow .18s ease,transform .12s ease;
  }
  .chip:hover{border-color:var(--accent-line);}
  .chip:active{transform:translateY(1px);}
  .chip.on{border-color:var(--primary);border-width:2px;background:var(--primary-tint);padding:6px 13px;}
  .chip .ico{color:var(--primary);}
  .chip-word{
    font-size:13.5px;font-weight:600;
    background:var(--paper-deep);border-color:var(--line-soft);
    min-height:33px;padding:4px 12px;
  }
  .bank{margin-top:10px;}
  .bank-label{font-size:12.5px;color:var(--muted);margin:0 0 6px;}

  /* ---- 1画面に複数の問いを置く時の小見出し ---- */
  .sub-q{
    font-size:15.5px;color:var(--ink);
    margin:26px 0 10px;padding-top:20px;
    border-top:1px solid var(--line-soft);
    line-height:1.6;word-break:auto-phrase;
  }

  /* ---- 上位5資質 ---- */
  .top5-grid{display:flex;flex-direction:column;gap:9px;}
  .top5-row{display:flex;align-items:center;gap:9px;}
  .top5-no{
    flex:none;width:26px;height:26px;border-radius:50%;
    background:var(--paper-deep);color:var(--muted);
    font-size:12.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .dom-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
  .dom-chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:700;color:var(--ink);
    border:1.5px solid var(--line);border-radius:999px;
    padding:4px 12px;background:var(--paper-deep);
  }
  .dom-chip .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;}
  .dom-exec{background:var(--dom-exec-bg);border-color:var(--dom-exec-line);}
  .dom-exec .dot{background:var(--dom-exec-ink);}
  .dom-infl{background:var(--dom-infl-bg);border-color:var(--dom-infl-line);}
  .dom-infl .dot{background:var(--dom-infl-ink);}
  .dom-rel{background:var(--dom-rel-bg);border-color:var(--dom-rel-line);}
  .dom-rel .dot{background:var(--dom-rel-ink);}
  .dom-think{background:var(--dom-think-bg);border-color:var(--dom-think-line);}
  .dom-think .dot{background:var(--dom-think-ink);}
  .dom-legend{font-size:12.5px;color:var(--muted);margin-top:9px;}

  /* ---- トリセツ7項目＋ギフト（紙と同じ色を面に通す） ---- */
  .item{
    background:var(--tint);
    border:1px solid var(--line-soft);
    border-left:5px solid var(--face);
    border-radius:var(--radius-sm);
    padding:15px 15px 16px;
    margin-bottom:13px;
  }
  .item-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .badge{
    flex:none;width:25px;height:25px;border-radius:50%;
    background:var(--face);color:var(--ink);
    font-size:13px;font-weight:700;line-height:25px;text-align:center;
  }
  .badge-star{display:flex;align-items:center;justify-content:center;color:var(--white);}
  .item-title{font-size:16px;color:var(--ink);margin:0;flex:1 1 auto;min-width:0;word-break:auto-phrase;}
  .item-head .ico{color:var(--deep);}
  .item-lead{font-size:14px;color:var(--muted);margin:0 0 9px;line-height:1.7;word-break:auto-phrase;}
  .item textarea{border-color:var(--line-soft);}
  .item textarea:focus{border-color:var(--deep);}

  /* ---- 第一稿OKの知らせ ---- */
  .ok-note{
    display:flex;align-items:flex-start;gap:10px;
    background:var(--primary-tint);
    border:1px solid #B9D2C6;
    border-radius:var(--radius-sm);
    padding:12px 14px;margin-bottom:16px;
  }
  .ok-note .ico{color:var(--primary);margin-top:3px;}
  .ok-note p{margin:0;font-size:14.5px;color:var(--ink);line-height:1.7;}

  /* ---- 画像まわり ---- */
  .ref-figure{margin:0 0 14px;}
  .ref-figure img{
    width:100%;height:auto;display:block;
    border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--white);
  }
  .ref-cap{font-size:12.5px;color:var(--muted);margin-top:7px;}
  .worksheet-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;}
  .worksheet-row img{
    width:96px;height:auto;flex:none;display:block;
    border:1px solid var(--line);border-radius:8px;
  }
  .worksheet-row p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7;}

  .caution{
    background:var(--paper-deep);
    border:1px solid var(--accent-line);
    border-radius:var(--radius-sm);
    padding:14px 15px;
  }
  .caution p{margin:0 0 .6em;font-size:14.5px;line-height:1.8;}
  .caution p:last-child{margin-bottom:0;}
  .caution strong{color:var(--accent-ink);}

  /* ---- アイコン投入 ---- */
  .drop{
    display:block;position:relative;
    border:2px dashed var(--accent-line);
    border-radius:var(--radius);
    background:var(--paper-deep);
    padding:26px 18px;text-align:center;cursor:pointer;
    transition:border-color .18s ease,box-shadow .18s ease;
  }
  .drop:hover{border-color:var(--primary);}
  .drop .ico{color:var(--accent-ink);margin-bottom:6px;}
  .drop-title{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 4px;}
  .drop-sub{font-size:13px;color:var(--muted);margin:0;}
  .preview-row{display:flex;align-items:center;gap:14px;margin-top:16px;}
  .preview-row img{
    width:88px;height:88px;flex:none;
    object-fit:cover;border-radius:14px;
    border:1px solid var(--line);background:var(--white);
  }
  .preview-meta{font-size:13.5px;color:var(--muted);line-height:1.7;min-width:0;word-break:break-all;}

  /* ---- 確認・完成 ---- */
  .sum-row{
    border-bottom:1px solid var(--line-soft);
    padding:11px 0;
  }
  .sum-row:last-child{border-bottom:0;}
  .sum-key{font-size:12.5px;color:var(--muted);margin:0 0 2px;}
  .sum-val{font-size:15px;color:var(--ink);margin:0;line-height:1.75;}
  .sum-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .sum-head h3{flex:1 1 11em;min-width:0;margin:0;}
  .sum-head .btn{flex:none;white-space:nowrap;}
  .prompt-box{
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:14px 15px;
    margin:0;
    font-family:inherit;
    font-size:13.5px;line-height:1.85;color:var(--ink);
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .status{font-size:13.5px;color:var(--accent-ink);margin:8px 0 0;min-height:1.2em;}
  .set-list{list-style:none;margin:0;padding:0;}
  .set-list li{
    display:flex;align-items:flex-start;gap:10px;
    font-size:15px;line-height:1.75;
    padding:9px 0;border-bottom:1px solid var(--line-soft);
  }
  .set-list li:last-child{border-bottom:0;}
  .set-no{
    flex:none;width:24px;height:24px;border-radius:50%;
    background:var(--primary);color:var(--white);
    font-size:12.5px;font-weight:700;line-height:24px;text-align:center;
  }
  .fallback-ta{display:none;margin-top:10px;font-size:13px;min-height:120px;}
  details{
    border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--white);padding:10px 14px;margin-top:12px;
  }
  summary{cursor:pointer;font-size:14.5px;font-weight:700;color:var(--primary);}
  details p,details li{font-size:14px;color:var(--ink);}

  /* 実際にプロンプトへ入る文を、書いた本人に見せる */
  .assembled{
    margin:8px 0 0;
    font-size:13.5px;line-height:1.7;color:var(--muted);
    background:var(--white);
    border:1px dashed var(--line);
    border-radius:9px;
    padding:7px 10px;
    word-break:auto-phrase;
  }
  .assembled b{color:var(--ink);font-weight:700;}
  .assembled-note{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.7;}

  /* STEP 2 の下部固定バー。3つ目を書いた瞬間に、その場で状態が変わる。
     いちばん上にいる間は貼りつかない——最初の画面で上位5資質のチップを
     バーが覆っていた（doc_check の隠れテキスト検出で発覚）。指が動いたら出す。 */
  .stickybar{
    position:static;z-index:4;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius) var(--radius) 0 0;
    box-shadow:0 -4px 14px rgba(31,27,22,.07);
    padding:10px 14px 12px;
    margin-top:8px;
  }
  .stickybar.is-stuck{position:sticky;bottom:0;}
  .stickybar .btnrow{margin-top:8px;}
  .stickybar-status{
    display:flex;align-items:flex-start;gap:8px;
    margin:0;font-size:13.5px;line-height:1.65;color:var(--muted);
  }
  .stickybar-status .ico{color:var(--primary);margin-top:2px;}
  .stickybar-status.ready{color:var(--ink);}
  .sticky-spacer{height:8px;}

  /* 見えない file input のフォーカスを、枠の側で見せる */
  .drop:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
  .file-error{font-size:13.5px;color:var(--accent-ink);margin:10px 0 0;line-height:1.7;}

  /* STEP 0：同じ仕組みで、こう変わる（外部画像は使わない。SVGとCSSだけ） */
  .samples{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 0;}
  .sample{min-width:0;}
  .sample-art{
    background:var(--s4);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 8px 9px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    min-height:112px;
  }
  .sample-art .ico{color:var(--s1);}
  .sample-title{
    font-size:12.5px;font-weight:700;color:var(--ink);
    text-align:center;line-height:1.5;word-break:auto-phrase;
  }
  .sample-bars{display:flex;gap:4px;margin-top:auto;}
  .sample-bars i{display:block;width:14px;height:6px;border-radius:99px;}
  .sample-bars i:nth-child(1){background:var(--s1);}
  .sample-bars i:nth-child(2){background:var(--s2);}
  .sample-bars i:nth-child(3){background:var(--s3);}
  .sample-cap{font-size:12.5px;color:var(--muted);margin:6px 0 0;text-align:center;line-height:1.5;}
  .sm-city{--s1:#1E2A44;--s2:#3E5C86;--s3:#93A7C4;--s4:#DDE4EE;}
  .sm-pop{--s1:#C6412A;--s2:#E0A21A;--s3:#2E8CA8;--s4:#FBEBD8;}
  .sm-book{--s1:#4F7A3A;--s2:#C08A3E;--s3:#B45E51;--s4:#F4EDDE;}

  @media (min-width:700px){
    main{padding:28px 24px 8px;}
    .card{padding:26px 24px;}
    h1{font-size:26px;}
    .btnrow .btn{flex:0 1 auto;min-width:160px;}
  }
</style>
</head>
<body>

<noscript>
  <div class="noscript-banner">
    <h1>このページはJavaScriptが必要です</h1>
    <p>お使いのブラウザでJavaScriptがオフになっているため、入力画面を出せません。設定でJavaScriptをオンにして、もう一度開いてください。</p>
    <p>入力した内容や画像は、このページ内でのみ扱い、MVPではサーバーへ送信しません。</p>
  </div>
</noscript>

<div id="app">
  <div class="shell">
    <div class="topbar">
      <div class="topbar-row">
        <span class="brand">わたしのトリセツ画像メーカー</span>
        <button type="button" class="btn btn-ghost btn-sm" id="resetBtn">最初からやり直す</button>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="step-label" id="stepLabel"></div>
    </div>
    <main id="main"></main>
    <p class="footer-note">入力した内容や画像は、このページ内でのみ扱い、MVPではサーバーへ送信しません。</p>
  </div>
</div>

<datalist id="themes"></datalist>

<script>
(function(){
  document.documentElement.classList.remove('no-js');
  document.documentElement.classList.add('js-ready');
})();
</script>
<script>
(function(){
"use strict";

/* ==========================================================================
   わたしのトリセツ画像メーカー（MVP）

function icon(name, extraClass){
  var span = document.createElement("span");
  span.className = "ico" + (extraClass ? " " + extraClass : "");
  span.setAttribute("aria-hidden","true");
  span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + "</svg>";
  return span;
}

/* ---- 穴埋め文のつなぎ ----
   ワークシートは穴埋めだが、実際には「散歩する」「一人の時間」のように文や名詞で書く人が多い。
   下の「言葉を借りる」チップも動詞の形で入る。テンプレートをそのまま当てると
   「散歩するすると戻りやすい。」「一人の時間な時に」になるので、重なった分だけ落とす。
   足りない言葉を足すことはしない（空欄はそのまま空欄で扱う）。

   規則は保守的に。
   ① 本人の文に、その型の固定尾（力が出やすい／している／嬉しい／暴走しやすい／
      戻りやすい／起きやすい）がすでに入っていたら、何も足さずそのまま通す。
   ② 機械が外すことは必ずあるので、STEP 2 と STEP 5 で「こう入ります：」と
      組み立てた文をそのまま見せる。本人が見て文ごと書き直せる。 */
var VERB_END = "るうくぐすつぬぶむただ";
function tidyJoin(v){
  return String(v == null ? "" : v).replace(/\s+/g," ").replace(/[。、．，]+$/,"").trim();
}
function tidyRaw(v){
  return String(v == null ? "" : v).trim();
}
function endsWithAny(s, list){
  for(var i=0;i<list.length;i++){ if(s.slice(-list[i].length) === list[i]) return true; }
  return false;
}
function isVerbEnd(s){ return VERB_END.indexOf(s.slice(-1)) > -1; }
function isAdjEnd(s){ return s.slice(-1) === "い"; }
/* 型の固定尾がもう入っている＝本人が文で書いている。触らない */
function alreadyWhole(s, tail){ return s.indexOf(tail) > -1; }

var defaultState = {
  stepIndex:0,
  name:"",
  top5:["","","","",""],
  happy:"", habit:"", glad:"", warning:"", recover:"", impact:"", weekly:"", gift:"",
  iconData:"", iconName:"",
  iconUse:"", photoUse:"",
  mood:[],
  world:[], worldOther:"",
  prefs:"",
  tagline:""
};
var state = loadState();

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(defaultState));
    var parsed = JSON.parse(raw);
    var merged = JSON.parse(JSON.stringify(defaultState));
    for(var k in merged){ if(Object.prototype.hasOwnProperty.call(parsed,k)) merged[k] = parsed[k]; }
    if(!merged.top5 || merged.top5.length !== 5) merged.top5 = ["","","","",""];
    return merged;
  }catch(e){
    return JSON.parse(JSON.stringify(defaultState));
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ /* 保存できなくても入力は続けられる */ }
}
function resetAll(){
  if(!window.confirm("入力した内容とアイコンを、すべて消します。よろしいですか？")) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state = JSON.parse(JSON.stringify(defaultState));
  saveState();
  render();
  window.scrollTo(0,0);
}

/* ==========================================================================
   ステップ
   ========================================================================== */
var STEPS = [
  {id:"welcome",   label:"はじめに"},
  {id:"icon",      label:"アイコン"},
  {id:"torisetsu", label:"トリセツの中身"},
  {id:"world",     label:"世界観"},
  {id:"intro",     label:"短い紹介文"},
  {id:"confirm",   label:"確認"},
  {id:"done",      label:"AIへ渡す"}
];
function clampStepIndex(){
  if(!(state.stepIndex >= 0)) state.stepIndex = 0;
  if(state.stepIndex >= STEPS.length) state.stepIndex = STEPS.length - 1;
}
function goNext(){
  var nextIndex = Math.min(STEPS.length-1, state.stepIndex+1);
  /* 確認 → 完成 だけは、条件を満たすまで進まない */
  if(STEPS[nextIndex].id === "done" && !canBuild()){ render(); return; }
  state.stepIndex = nextIndex; saveState(); render(); window.scrollTo(0,0);
}
function goPrev(){ state.stepIndex = Math.max(0, state.stepIndex-1); saveState(); render(); window.scrollTo(0,0); }
function goTo(id){
  for(var i=0;i<STEPS.length;i++){ if(STEPS[i].id === id){ state.stepIndex = i; break; } }
  saveState(); render(); window.scrollTo(0,0);
}

/* 画面ごとに品質を測るための入り口。
   ?step=3 でも <html data-step="3"> でも同じ画面が開く
   （測定コマンドがクエリ付きURLを受け取れないので、属性側も見る）。 */
function forcedStep(){
  var q = null;
  try{ q = new URLSearchParams(window.location.search).get("step"); }catch(e){}
  if(!q) q = document.documentElement.getAttribute("data-step");
  if(!q) return null;
  var n = parseInt(q,10);
  if(!isNaN(n) && n >= 1 && n <= STEPS.length) return n - 1;
  for(var i=0;i<STEPS.length;i++){ if(STEPS[i].id === q) return i; }
  return null;
}

/* ==========================================================================

function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "text") e.textContent = attrs[k];
    else if(k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function(c){
    if(c === null || c === undefined) return;
    if(typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function card(children, extraClass){
  return el("div", {class:"card" + (extraClass ? " " + extraClass : "")}, children);
}
function t(v){ return (v === null || v === undefined) ? "" : String(v).trim(); }
function has(v){ return t(v).length > 0; }
function joinAll(arr, other){
  var xs = (arr || []).slice();
  if(has(other)) xs.push(t(other));
  return xs.join("、");
}
function navRow(opts){
  opts = opts || {};
  var kids = [];
  if(opts.showBack !== false){
    kids.push(el("button", {class:"btn btn-ghost", type:"button",
      onclick:function(){ opts.onBack ? opts.onBack() : goPrev(); }}, [icon("back"), "もどる"]));
  }
  var next = el("button", {class:"btn btn-primary", type:"button",
    onclick:function(){ opts.onNext ? opts.onNext() : goNext(); }},
    [opts.nextLabel || "つぎへ", icon("next")]);
  if(opts.nextDisabled) next.disabled = true;
  kids.push(next);
  return el("div", {class:"btnrow"}, kids);
}
function chipList(options, isOn, onToggle, extraClass){
  var ul = el("ul", {class:"chips"});
  options.forEach(function(opt){
    var on = isOn(opt);
    var li = el("li");
    var btn = el("button", {
      class:"chip" + (on ? " on" : "") + (extraClass ? " " + extraClass : ""),
      type:"button",
      "aria-pressed": on ? "true" : "false",
      onclick:function(){ onToggle(opt); }
    }, [on ? icon("check","ico-sm") : null, opt]);
    li.appendChild(btn);
    ul.appendChild(li);
  });
  return ul;
}
function toggleIn(arr, v){
  var i = arr.indexOf(v);
  if(i > -1) arr.splice(i,1); else arr.push(v);
}
function filledCount(){
  var n = 0;
  ITEMS.forEach(function(it){ if(has(state[it.key])) n++; });
  if(has(state.gift)) n++;
  return n;
}
/* プロンプトを作ってよいか。アイコン1枚＋トリセツ8欄のどれか1つ。
   3項目を必須にはしない（空欄を肯定するのが仕様の芯）。 */
function canBuild(){ return has(state.iconData) && filledCount() >= 1; }
function gateReasons(){
  var out = [];
  if(!has(state.iconData)) out.push({msg:"アイコンを1枚貼ると、プロンプトを作れます。", to:"icon", label:"アイコンを貼りに行く", ico:"upload"});

/* ==========================================================================
   コピー・保存
   ========================================================================== */
function copyText(text, statusEl, fallbackTa){
  function ok(){ statusEl.textContent = "コピーしました。ChatGPT等の入力欄に貼り付けてください。"; }
  function fail(){
    statusEl.textContent = "自動コピーができませんでした。下の枠の文章を選んでコピーしてください。";
    if(fallbackTa){
      fallbackTa.style.display = "block";
      fallbackTa.value = text;
      fallbackTa.focus();
      fallbackTa.select();
    }
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, fail);
      return;
    }
    throw new Error("clipboard api なし");
  }catch(e){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var done = document.execCommand("copy");
      document.body.removeChild(ta);
      if(done) ok(); else fail();
    }catch(e2){ fail(); }
  }
}
function saveTxt(text, statusEl){
  try{
    var blob = new Blob([text], {type:"text/plain;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = (has(state.name) ? t(state.name) : "わたし") + "のトリセツ_画像生成プロンプト.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    statusEl.textContent = "TXTを保存しました。";
  }catch(e){
    statusEl.textContent = "TXTの保存ができませんでした。プロンプトをコピーして使ってください。";
  }
}

/* ---- 画像を長辺512pxへ縮めてから持つ（原寸のまま保存すると容量上限を超える） ---- */
function shrinkToDataUrl(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      try{
        var max = 512;
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var scale = Math.min(1, max / Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale));
        var ch = Math.max(1, Math.round(h*scale));
        var cv = document.createElement("canvas");
        cv.width = cw; cv.height = ch;
        cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
        var out = cv.toDataURL("image/webp", 0.85);
        if(out.indexOf("data:image/webp") !== 0) out = cv.toDataURL("image/png");
        cb(out, reader.result);
      }catch(e){ cb(reader.result, reader.result); }
    };
    img.onerror = function(){ cb("", ""); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb("", ""); };
  reader.readAsDataURL(file);
}

  else b.classList.remove("is-stuck");
}

function render(){
  clampStepIndex();
  /* 測定用の入り口（?step / data-step）から直接ここへ来ても、
     条件を満たしていなければ完成画面は出さず、確認画面へ落とす。 */
  if(STEPS[state.stepIndex].id === "done" && !canBuild()){
    for(var k=0;k<STEPS.length;k++){ if(STEPS[k].id === "confirm"){ state.stepIndex = k; break; } }
    saveState();
  }
  updateProgress();
  mainEl.innerHTML = "";
  var fn = RENDERERS[STEPS[state.stepIndex].id];
  if(fn) mainEl.appendChild(fn());
  syncStickyBar();
}

    drawLive();
    if(it.bank){
      var bank = el("div", {class:"bank"}, [ el("p", {class:"bank-label"}, [it.bank.label]) ]);
      bank.appendChild(chipList(it.bank.words,
        function(){ return false; },
        function(w){
          var cur = t(ta.value);
          ta.value = cur ? cur + "、" + w : w;
          state[it.key] = ta.value;
          saveState();
          drawOk();
          drawLive();
          ta.focus();
        }, "chip-word"));
      kids.push(bank);
    }
    itemsCard.push(el("div", {class:"item " + it.cls}, kids));
  });
  wrap.appendChild(card(itemsCard));

  drawOk();
  /* この画面は長い。もどる／つぎへと状態を、いつでも手の届く場所に置く */
  wrap.appendChild(el("div", {class:"stickybar", id:"stickybar"}, [
    barStatus,
    el("div", {class:"btnrow"}, [
      el("button", {class:"btn btn-ghost", type:"button", onclick:goPrev}, [icon("back"), "もどる"]),
      el("button", {class:"btn btn-primary", type:"button", onclick:goNext}, ["つぎへ", icon("next")])
    ])
  ]));
  return wrap;
}

/* ---- STEP 3 世界観（1画面）----
   3つの塊を上から：世界観チップ（おまかせ排他）／感じたい印象（任意）／こだわり（任意）。
   どれも選ばずに「つぎへ」で通る。その時はプロンプト側が「おまかせ」を書く。 */
function renderWorld(){
  var wrap = document.createDocumentFragment();

  var worldOther = el("input", {type:"text", id:"worldOther", value:state.worldOther,
    placeholder:"その他（例：夜の街、レトロゲーム風）", autocomplete:"off"});
  worldOther.addEventListener("input", function(){ state.worldOther = worldOther.value; saveState(); });

  var prefs = el("textarea", {rows:"2", id:"prefs",
    placeholder:"例：ネイビーとシルバー。星だけ入れたい。森や暖色は避けたい",
    "aria-label":"色や入れたいもの、避けたいものがあれば"});
  prefs.value = state.prefs;
  prefs.addEventListener("input", function(){ state.prefs = prefs.value; saveState(); });

  /* 「おまかせ」と他のチップは同時に立たない */
  function toggleWorld(v){
    if(v === OMAKASE){
      state.world = (state.world.indexOf(v) > -1) ? [] : [v];
    }else{
      var i = state.world.indexOf(OMAKASE);
      if(i > -1) state.world.splice(i,1);
      toggleIn(state.world, v);
    }
    saveState(); render();
  }

  wrap.appendChild(card([
    el("span", {class:"eyebrow"}, [icon("palette","ico-sm"), "世界観"]),
    el("h2", {class:"question"}, ["どんな雰囲気の1枚にしますか？"]),
    el("p", {class:"lead-sm"}, ["決めきれない時は、いちばん上の「アイコンに合わせておまかせ」だけ選んで進んで大丈夫です。"]),

    chipList(WORLD_OPTIONS, function(v){ return state.world.indexOf(v) > -1; }, toggleWorld),
    el("div", {class:"field", style:"margin-top:16px;"}, [
      el("label", {for:"worldOther"}, ["その他"]), worldOther
    ]),

    el("h3", {class:"sub-q"}, ["できた1枚を見て、どんな気持ちになれたら嬉しいですか？（任意）"]),
    chipList(MOOD_OPTIONS, function(v){ return state.mood.indexOf(v) > -1; },
      function(v){ toggleIn(state.mood, v); saveState(); render(); }),

    el("h3", {class:"sub-q"}, ["色や入れたいもの、避けたいものがあれば"]),
    el("div", {class:"field"}, [prefs])
  ]));
  wrap.appendChild(navRow({}));
  return wrap;
}

/* ---- STEP 4 短い紹介文 ---- */
function renderIntro(){
  var wrap = document.createDocumentFragment();
  var ta = el("textarea", {rows:"2", id:"tagline", "aria-label":"一言でいうと？"});
  ta.value = state.tagline;
  ta.addEventListener("input", function(){ state.tagline = ta.value; saveState(); });
  wrap.appendChild(card([
    el("span", {class:"eyebrow"}, ["STEP 4"]),
    el("h2", {class:"question"}, ["一言でいうと？"]),
    el("p", {class:"lead-sm"}, ["浮かばなければ空欄のままで大丈夫です。空欄のときは、あなたが書いた言葉から2〜3案を考えるようAIへ頼みます。"]),
    ta
  ]));
  wrap.appendChild(navRow({}));
  return wrap;
}

/* ---- STEP 5 確認（長文はここで直せる） ---- */
function domChipRow(list){
  var row = el("div", {class:"dom-chips"});
  (list || []).forEach(function(v){
    if(!has(v)) return;
    var d = domainOf(v);
    row.appendChild(el("span", {class:"dom-chip" + (d ? " " + d.cls : "")}, [
      el("span", {class:"dot", "aria-hidden":"true"}), t(v)
    ]));
  });
  return row;
}
function sumRow(key, value){
  return el("div", {class:"sum-row"}, [
    el("p", {class:"sum-key"}, [key]),
    el("p", {class:"sum-val"}, [has(value) ? t(value) : "（未記入）"])
  ]);
}
function renderConfirm(){
  var wrap = document.createDocumentFragment();

  wrap.appendChild(card([
    el("span", {class:"eyebrow"}, ["STEP 5"]),
    el("h2", {class:"question"}, ["この内容でプロンプトを作ります"]),
    el("p", {class:"lead-sm"}, ["気になるところは、ここで直せます。空欄はそのままで大丈夫です。"])
  ]));

  /* 名前・アイコン・資質 */
  var nameInput = el("input", {type:"text", id:"cName", value:state.name, autocomplete:"off"});
  nameInput.addEventListener("input", function(){ state.name = nameInput.value; saveState(); });
  var iconBlock = has(state.iconData)
    ? el("div", {class:"preview-row"}, [
        el("img", {src:state.iconData, alt:"選んだアイコンのプレビュー"}),
        el("div", {class:"preview-meta"}, [
          el("p", {class:"sum-key"}, ["アイコン"]),
          el("p", {class:"sum-val"}, [t(state.iconName) || "（名前なし）"])
        ])
      ])
    : el("p", {class:"sum-val"}, ["まだ貼っていません"]);

  wrap.appendChild(card([
    el("div", {class:"sum-head"}, [
      el("h3", {}, ["お名前とアイコンを見ておきます"]),
      el("button", {class:"btn btn-ghost btn-sm", type:"button", onclick:function(){ goTo("icon"); }}, [icon("pen","ico-sm"), "アイコンを直す"])
    ]),
    el("div", {class:"field"}, [ el("label", {for:"cName"}, ["お名前"]), nameInput ]),
    iconBlock,
    el("div", {class:"sum-row"}, [
      el("p", {class:"sum-key"}, ["上位5資質"]),
      state.top5.map(t).filter(has).length
        ? domChipRow(state.top5)
        : el("p", {class:"sum-val"}, ["（未記入）"])
    ])
  ]));

  /* トリセツ本文 */
  var itemKids = [ el("h3", {}, ["書いた言葉は、ここで直せます"]) ];
  ITEMS.concat([GIFT]).forEach(function(it){
    var ta = el("textarea", {rows:"2", id:"c-"+it.key, "aria-label":it.title});
    ta.value = state[it.key];
    ta.addEventListener("input", function(){ state[it.key] = ta.value; saveState(); });
    itemKids.push(el("div", {class:"item " + it.cls}, [
      el("div", {class:"item-head"}, [
        it.key === "gift"
          ? el("span", {class:"badge badge-star", "aria-hidden":"true"}, [icon("star","ico-sm")])
          : el("span", {class:"badge", "aria-hidden":"true"}, [it.no]),
        el("h3", {class:"item-title"}, [it.title])
      ]),
      ta
    ]));
  });
  wrap.appendChild(card(itemKids));

  /* 世界観 */
  wrap.appendChild(card([
    el("div", {class:"sum-head"}, [
      el("h3", {}, ["選んだ世界観は、これでいいですか？"]),
      el("button", {class:"btn btn-ghost btn-sm", type:"button", onclick:function(){ goTo("world"); }}, [icon("pen","ico-sm"), "質問に戻る"])
    ]),
    sumRow("感じたい印象", joinAll(state.mood)),
    sumRow("世界観", joinAll(state.world, state.worldOther)),
    sumRow("こだわり", state.prefs),
    sumRow("一言でいうと", state.tagline)
  ]));

  /* プロンプトを作れる条件は「アイコン1枚」＋「トリセツ8欄のどれか1つ」。
     足りない理由の数だけ、案内文とその場所へ戻るボタンを出す。
     残り項目数は数えない（空欄を肯定するのが仕様の芯）。 */
  var ready = canBuild();
  var nav = navRow({nextLabel:"プロンプトを作る", nextDisabled:!ready,
    onNext:function(){ if(canBuild()) goNext(); else render(); }});
  var kids = [nav];
  if(!ready){
    var msgBox = el("div", {});
    var btnBox = el("div", {class:"btnrow btnrow-stack"});
    gateReasons().forEach(function(r){
      msgBox.appendChild(el("p", {class:"hint"}, [r.msg]));
      btnBox.appendChild(el("button", {class:"btn btn-ghost", type:"button",
        onclick:function(){ goTo(r.to); }}, [icon(r.ico), r.label]));
    });
    kids.unshift(msgBox);
    kids.push(btnBox);
  }
  wrap.appendChild(el("div", {}, kids));
  return wrap;
}

/* ---- STEP 6 AIへ渡す ---- */
function renderDone(){
  /* ?step=11 の直開きや、古い保存状態からここへ来た場合の受け止め。
     render() 側でも落としているが、この関数単体でも完成画面は描かない。 */
  if(!canBuild()) return renderConfirm();
  var wrap = document.createDocumentFragment();
  var prompt = buildPrompt();

  wrap.appendChild(card([
    el("span", {class:"eyebrow"}, ["STEP 6"]),
    el("h1", {}, ["できた！あとはAIに渡すだけ"]),
    el("p", {class:"body"}, ["下の3つをChatGPT等の新しいチャットに貼れば、あなた専用の1枚ができます。ファイルの添付は、ご自身で行ってください。"])
  ]));

  var setList = el("ul", {class:"set-list"}, [
    el("li", {}, [el("span", {class:"set-no", "aria-hidden":"true"}, ["1"]), el("span", {}, ["あなたのアイコン"])]),
    el("li", {}, [el("span", {class:"set-no", "aria-hidden":"true"}, ["2"]), el("span", {}, ["おけもんの完成見本画像"])]),
    el("li", {}, [el("span", {class:"set-no", "aria-hidden":"true"}, ["3"]), el("span", {}, ["下の専用プロンプト"])])
  ]);
  var setKids = [ el("h3", {}, ["ChatGPT等へ貼るもの"]), setList ];
  setKids.push(el("p", {class:"hint"}, ["ワークシートの写真がある場合は、一緒に貼るとさらに安心です。"]));
  wrap.appendChild(card(setKids));

  /* 手元にあるもの */
  var haveKids = [ el("h3", {}, ["見本の画像も、保存しておきます"]) ];
  if(has(state.iconData)){
    haveKids.push(el("div", {class:"preview-row"}, [
      el("img", {src:state.iconData, alt:"あなたのアイコン"}),
      el("div", {class:"preview-meta"}, [
        el("p", {class:"sum-key"}, ["あなたのアイコン"]),
        el("p", {class:"sum-val"}, [t(state.iconName) || "（名前なし）"])
      ])
    ]));
  }
  haveKids.push(el("div", {class:"btnrow btnrow-stack"}, [
    el("a", {class:"btn btn-ghost", href:"sf-watashi-no-torisetsu-maker-assets/okemon_torisetsu_reference.jpg",
             download:"okemon_torisetsu_reference.jpg"}, [icon("download"), "おけもん完成見本を保存"])
  ]));
  wrap.appendChild(card(haveKids));

  /* プロンプト */
  var status = el("p", {class:"status", role:"status"});
  var fallback = el("textarea", {class:"fallback-ta", "aria-label":"コピー用のプロンプト"});
  var pre = el("pre", {class:"prompt-box"}, [prompt]);
  wrap.appendChild(card([
    el("h3", {}, ["これが、あなた専用のプロンプトです"]),
    el("div", {class:"btnrow btnrow-stack"}, [
      el("button", {class:"btn btn-primary", type:"button", onclick:function(){ copyText(prompt, status, fallback); }}, [icon("copy"), "プロンプトをコピー"]),
      el("button", {class:"btn btn-ghost", type:"button", onclick:function(){ saveTxt(prompt, status); }}, [icon("download"), "TXTで保存"])
    ]),
    status,
    fallback,
    pre
  ]));

  wrap.appendChild(card([
    el("h3", {}, ["新しいチャットを開きます"]),
    el("p", {class:"lead-sm"}, ["新しいチャットを開いて、上の3点を貼り付けてください。"]),
    el("div", {class:"btnrow btnrow-stack"}, [
      el("a", {class:"btn btn-primary", href:"https://chatgpt.com/", target:"_blank", rel:"noopener"}, [icon("external"), "ChatGPTで新しいチャットを開く"])
    ]),
    el("details", {}, [
      el("summary", {}, ["うまく貼れない時は"]),
      el("p", {}, ["「プロンプトをコピー」を押したあと、チャットの入力欄を長押しして貼り付けてください。画像は、入力欄のクリップのマークから選べます。"])
    ])
  ]));

  wrap.appendChild(card([
    el("h3", {}, ["この取扱説明書は、まだ第一稿。"]),
    el("p", {class:"body"}, ["使ってみる → 気づく → 更新する。このトリセツは、あなたと一緒に育ちます。"]),
    el("div", {class:"btnrow"}, [
      el("button", {class:"btn btn-ghost", type:"button", onclick:goPrev}, [icon("back"), "内容を直す"])
    ])
  ], "card-quiet"));

  return wrap;
}

var RENDERERS = {
  welcome:renderWelcome, icon:renderIcon, torisetsu:renderTorisetsu,
  world:renderWorld,
  intro:renderIntro, confirm:renderConfirm, done:renderDone
};

/* ==========================================================================
   起動
   ========================================================================== */
(function boot(){
  var dl = document.getElementById("themes");
  DOMAINS.forEach(function(d){
    d.list.forEach(function(name){
      dl.appendChild(el("option", {value:name}));
    });
  });
  document.getElementById("resetBtn").addEventListener("click", resetAll);
  var f = forcedStep();
  if(f !== null) state.stepIndex = f;
  render();
})();

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>もしもお金の目的で性格がバレたら？｜4タイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a2a2e;
  --muted:#8a8790;
  --pink:#ff8fb8;
  --pink-soft:#ffd6e7;
  --pink-mark:#ffb6d2;
  --bg:#ffffff;
  --card:#fff;
  --line:#1a1a1a;
  --soft:#f7f4f8;
  --mint:#7dd3c0;
  --sun:#ffc857;
  --sky:#7eb6ff;
  --coral:#ff7a6e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'M PLUS Rounded 1c',sans-serif;
  color:var(--ink);
  background:var(--bg);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.display{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900}

/* floating décor */
.sky{
  position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
}
.sky .star{
  position:absolute; color:var(--pink-soft); font-size:18px; opacity:.9;
  animation:twinkle 3.2s ease-in-out infinite;
}
.sky .spark{
  position:absolute; width:8px; height:8px; background:var(--ink);
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  opacity:.35;
}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}

.app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30;
  background:rgba(255,255,255,.86); backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,0,0,.04);
  padding:10px 16px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.brand-lockup{display:flex; align-items:center; gap:10px}
.logo-mark{
  width:34px; height:34px; border-radius:50%;
  background:
    conic-gradient(from 20deg, var(--sky), var(--mint), var(--sun), var(--coral), var(--pink), var(--sky));
  box-shadow:0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.08);
  flex-shrink:0;
}
.brand-name{font-weight:800; font-size:15px; letter-spacing:.02em}
.meta{font-size:12px; color:var(--muted); font-weight:700}
.wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:20px 16px 96px}
.stage{width:100%; max-width:720px}

/* hard-offset card (MyPersonality vibe) */
.panel{
  background:#fff;
  border:2.5px solid var(--line);
  border-radius:22px;
  box-shadow:5px 5px 0 var(--line);
  padding:28px 24px;
  animation:rise .45s cubic-bezier(.34,1.3,.64,1);
  position:relative;
}
@keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}

.hl{
  display:inline;
  background:linear-gradient(transparent 62%, var(--pink-mark) 62%);
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone;
  padding:0 .08em;
}
.hero-title{
  font-size:clamp(26px, 5.4vw, 38px);
  line-height:1.45;
  letter-spacing:-.02em;
  margin:10px 0 8px;
}
.hero-sub{font-size:18px; font-weight:800; margin:6px 0 14px}
.lead{font-size:14px; color:var(--muted); max-width:32em; margin:0 auto}

/* intro landing */
.landing{text-align:center; position:relative; padding:8px 0 12px}
.landing-board{
  position:relative;
  min-height:320px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin:8px 0 22px;
}
.review{
  position:absolute;
  width:min(200px, 42vw);
  background:#fff;
  border:2.5px solid var(--line);
  border-radius:16px;
  box-shadow:4px 4px 0 var(--line);
  padding:12px 12px 10px;
  text-align:left;
  font-size:11.5px;
  line-height:1.45;
  z-index:1;
}
.review .stars{color:#f5b400; letter-spacing:1px; font-size:12px; margin-bottom:4px}
.review .score{color:var(--muted); font-weight:700; margin-left:4px; font-size:11px}
.review .who{margin-top:6px; font-weight:800; font-size:11px}
.r1{top:8%; left:0; transform:rotate(-8deg)}
.r2{top:4%; right:0; transform:rotate(7deg)}
.r3{bottom:6%; left:4%; transform:rotate(5deg)}
.r4{bottom:2%; right:2%; transform:rotate(-6deg)}
.hero-core{position:relative; z-index:2; max-width:22em; padding:8px 10px}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:18px 0 8px}
.chip{
  border:2px solid var(--line); border-radius:999px; padding:7px 12px;
  font-size:12px; font-weight:800; background:#fff;
  box-shadow:2px 2px 0 var(--line);
}
.chip.a{background:#fff1f6}
.chip.b{background:#eefaf6}
.chip.c{background:#fff8e8}
.chip.d{background:#eef5ff}

.btn{
  font-family:inherit; font-weight:800; font-size:16px; cursor:pointer;
  border:2.5px solid var(--line); border-radius:999px;
  padding:14px 26px; transition:.15s; display:inline-flex; align-items:center; justify-content:center;
  box-shadow:3px 3px 0 var(--line); background:#fff; color:var(--ink);
}
.btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line)}
.btn-primary{background:var(--pink); color:#fff; flex:1}
.btn-ghost{background:#fff; color:var(--ink)}
.btn-accent{background:var(--sun); flex:1}
.btn-wide{width:100%}
.nav{display:flex; gap:10px; margin-top:22px; align-items:center; justify-content:center}
.btn-skip{background:none; border:none; box-shadow:none; color:var(--muted); text-decoration:underline;
  cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; padding:8px}
.btn-skip:hover{transform:none; box-shadow:none}

.section-tag{
  display:inline-block; font-size:12px; font-weight:800; color:#fff;
  background:var(--ink); border-radius:999px; padding:4px 12px; margin-bottom:12px;
}
h1.q{font-size:clamp(20px,4.6vw,26px); line-height:1.45; margin-bottom:8px}
.hint{font-size:13px; color:var(--muted); margin:0 0 16px; font-weight:500}
.choice-list{display:flex; flex-direction:column; gap:10px}
.choice{
  font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; text-align:left;
  border:2.5px solid var(--line); border-radius:18px; padding:14px 16px;
  background:#fff; color:var(--ink); display:flex; gap:12px; align-items:center;
  box-shadow:3px 3px 0 var(--line); transition:.15s;
}
.choice:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--line); background:#fff7fb}
.choice.on{background:var(--pink-soft); transform:translate(1px,1px); box-shadow:2px 2px 0 var(--line)}
.choice .mark{
  width:28px; height:28px; border-radius:50%; border:2px solid var(--line);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:900; flex-shrink:0; background:#fff;
}
.choice.on .mark{background:var(--pink); color:#fff; border-color:var(--line)}

.center{text-align:center}
.note{font-size:12px; color:var(--muted); margin-top:14px}
.break-emoji{font-size:42px; margin-bottom:8px}

.type-hero{
  border:2.5px solid var(--line); border-radius:22px; padding:22px 16px;
  background:linear-gradient(180deg,#fff7fb 0%, #fff 70%);
  box-shadow:4px 4px 0 var(--line); margin:8px 0 16px;
}
.type-code{
  display:inline-block; font-weight:900; font-size:12px; letter-spacing:.08em;
  background:var(--ink); color:#fff; border-radius:999px; padding:4px 12px; margin-bottom:8px;
}
.type-name{font-size:clamp(26px,5vw,34px); margin:4px 0; line-height:1.3}
.type-one{font-size:15px; font-weight:800; color:#d4497d}
.axes{display:grid; gap:10px; margin:14px 0}
.axis{
  border:2px solid var(--line); border-radius:16px; padding:12px 14px; background:#fff;
  box-shadow:2px 2px 0 var(--line); text-align:left;
}
.axis-head{display:flex; justify-content:space-between; font-size:12px; font-weight:800; color:var(--muted); margin-bottom:6px}
.axis-track{height:12px; background:#f0eef2; border-radius:99px; overflow:hidden; border:1.5px solid rgba(0,0,0,.08)}
.axis-fill{height:100%; width:50%; background:linear-gradient(90deg,var(--pink),var(--sun)); border-radius:99px; transition:width .55s ease}
.bullets{
  text-align:left; margin:10px 0 14px; padding:14px 16px;
  border:2px solid var(--line); border-radius:18px; background:var(--soft);
  box-shadow:2px 2px 0 var(--line);
}
.bullets h3{font-size:13px; font-weight:900; margin-bottom:8px}
.bullets li{margin:5px 0 5px 1.1em; font-size:14px; font-weight:500}
.cta-box{
  border:2.5px solid var(--line); border-radius:20px; padding:16px; margin:10px 0;
  text-align:left; background:#fff; box-shadow:3px 3px 0 var(--line);
}
.cta-box.rec{background:#fff1f6}
.cta-box .rec-label{
  display:inline-block; font-size:11px; font-weight:900; color:#fff;
  background:var(--pink); border:2px solid var(--line); border-radius:999px;
  padding:3px 10px; margin-bottom:8px;
}
.cta-box h3{font-size:17px; font-weight:900; margin-bottom:4px}
.cta-box p{font-size:13px; color:var(--muted); margin-bottom:12px}
.res-actions{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 4px}
.res-actions .btn{flex:1; min-width:140px; font-size:14px; padding:12px 16px}

/* bottom progress pill */
.dock{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  z-index:40; width:min(280px, 70vw);
  height:14px; border-radius:999px; background:#eceaef;
  border:2px solid var(--line); box-shadow:2px 2px 0 var(--line); overflow:hidden;
}
.dock-fill{
  height:100%; width:0; background:linear-gradient(90deg, var(--ink) 0%, var(--pink) 100%);
  transition:width .35s ease;
}

.toast{
  position:fixed; bottom:48px; left:50%; transform:translateX(-50%) translateY(16px);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px;
  font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:.28s; z-index:50;
  max-width:90vw; text-align:center; border:2px solid #000;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media(max-width:560px){
  .review{width:46vw; font-size:10.5px; padding:10px}
  .r3,.r4{display:none}
  .panel{padding:24px 18px}
  .landing-board{min-height:260px}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <span class="star" style="top:8%;left:8%">★</span>
  <span class="star" style="top:14%;right:12%;animation-delay:.4s">★</span>
  <span class="star" style="top:42%;left:5%;font-size:14px;animation-delay:.8s">★</span>
  <span class="star" style="bottom:22%;right:8%;animation-delay:1.1s">★</span>
  <span class="star" style="top:70%;left:14%;font-size:12px;animation-delay:.2s">★</span>
  <span class="spark" style="top:22%;left:22%"></span>
  <span class="spark" style="top:18%;right:24%"></span>
  <span class="spark" style="bottom:30%;left:40%"></span>
</div>

<div class="app">
  <div class="topbar">
    <div class="brand-lockup">
      <div class="logo-mark" aria-hidden="true"></div>
      <div class="brand-name">MoneyPurpose</div>
    </div>
    <div class="meta"><span id="secTag">スタート</span> · <span id="count">全8問</span></div>
  </div>

  <div class="wrap"><div class="stage" id="stage"></div></div>
  <div class="dock" aria-hidden="true"><div class="dock-fill" id="bar"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* v0.4 UI: MyPersonality-inspired かっこかわいい / copy from v0.3 */
const QUESTIONS = [
  {id:"q1", tag:"夜ふけの本音", q:"給料日の夜、つい頭に浮かぶのは？",
    opts:[
      {t:"まず残高を見て、安心したい", a:{safe:2}},
      {t:"「これ、増やせたら？」と妄想が始まる", a:{grow:2}},
      {t:"どっちも来る。日による", a:{safe:1,grow:1}}
    ]},
  {id:"q2", tag:"本音くじ", q:"正直、いま一番ほしいのはどれ？",
    opts:[
      {t:"不安が消えて、よく眠れること", a:{safe:2}},
      {t:"「ちゃんと育ってる」手応え", a:{grow:2}},
      {t:"我慢せず、今を楽しむ余白", a:{grow:1,safe:1}},
      {t:"ごちゃついた頭と口座のリセット", a:{safe:1,fog:1}}
    ]},
  {id:"q3", tag:"バレる一言", q:"友だちに聞かれたら、答えられる？\n「それ、何のためのお金？」",
    opts:[
      {t:"だいたい言える（言葉にできる）", a:{clear:2}},
      {t:"雰囲気では分かる…でも説明は弱い", a:{clear:1,fog:1}},
      {t:"うっ、詰まる。まだふわっとしてる", a:{fog:2}}
    ]},
  {id:"q4", tag:"未来のワンシーン", q:"もしお金が味方してくれたら、見たい景色は？",
    opts:[
      {t:"家族も自分も、慌てない毎日", a:{safe:2,scene:"安心"}},
      {t:"時間に追われない、余白のある暮らし", a:{grow:1,clear:1,scene:"自由"}},
      {t:"挑戦や仕事に、思いっきり賭けられる状態", a:{grow:2,scene:"挑戦"}},
      {t:"旅も体験も、「行きたい」で動ける自分", a:{grow:1,scene:"体験"}},
      {t:"景色自体がまだピンボケ", a:{fog:2,scene:"未定"}}
    ]},
  {id:"q5", tag:"タイムマシン", q:"その景色、いつごろの自分？",
    opts:[
      {t:"わりと近め（1〜3年で見たい）", a:{clear:1,grow:1}},
      {t:"じっくり先（5〜10年、もっと先）", a:{grow:1}},
      {t:"日程より、まず土台の安心が先", a:{safe:2}},
      {t:"まだカレンダーに落とせてない", a:{fog:1}}
    ]},
  {id:"q6", tag:"シーズン感", q:"いまの自分、どっちの季節？",
    opts:[
      {t:"積み上げシーズン（貯め時っぽい）", a:{grow:1,clear:1}},
      {t:"整え＆使いどき（かかり時っぽい）", a:{safe:1}},
      {t:"季節感が混線中…わからない", a:{fog:1}}
    ]},
  {id:"q7", tag:"引き出しチェック", q:"お金の置き場、分かれてる？",
    opts:[
      {t:"分かれてる派（生活／備え／将来など）", a:{clear:2}},
      {t:"一部だけ分かれてる", a:{clear:1}},
      {t:"ほぼひとまとめ／正直わかってない", a:{fog:2,safe:1}}
    ]},
  {id:"q8", tag:"ついやりたいこと", q:"次の一歩、いまの気分に近いのは？",
    opts:[
      {t:"まず学べる場で、地図を手に入れたい", a:{cta:"seminar",fog:1}},
      {t:"30分だけ、誰かに壁打ちしたい", a:{cta:"consult",clear:1}},
      {t:"もう少し自分の頭でこねてから", a:{cta:"self",fog:1}}
    ]},
];

const TYPES = {
  safe_clear: {
    code:"SC型", name:"あんしん番長", emoji:"🛡️",
    one:"守り上手。しかも「何を守るか」は言える人",
    blurb:"不安を減らすのが得意技。でも迷子じゃない——目的のある安心屋さん。焦って増やさず、守りと景色をセットにすると一番強い。",
    aruaru:["増やす話より、守る話の方がスッと入る","いきなりリスクの話はちょっと重い","家族や将来の安全が頭の片隅にある","分かってから動く派"],
    next:"まず地図（学べる場）で守り方を掴んで、30分で自分の景色を一言にすると加速する。"
  },
  grow_clear: {
    code:"GC型", name:"みらい設計士", emoji:"🗺️",
    one:"景色が見えてる。あとは順番を決めるだけの人",
    blurb:"「なんとなく増やしたい」じゃ満足できない設計者タイプ。手段より設計図。短時間の壁打ちで一点に絞ると、一気に前へ出る。",
    aruaru:["期限や景色があると急に動ける","情報は集めるのに、決断で止まることも","ワクワクと計画の両方ほしい","一人で考えすぎて夜更かししがち"],
    next:"学べる場で型を見たあと、30分相談で設計図を一点に落とすと速い。"
  },
  safe_fog: {
    code:"SF型", name:"ととのえ職人", emoji:"🧹",
    one:"景色の前に、まず散らかった盤面を整えたい人",
    blurb:"不安やごちゃつきが先に立つタイプ。目的を探す前に「置き場」を整えると、景色が勝手に言葉になってくる。",
    aruaru:["口座や家計が気になると手が止まる","投資より見える化が先にほしい","完璧にしてから動きたい衝動","土台ができると急に前向きになる"],
    next:"学べる場でお金の置き場の型を知るのが最短。整ったあと、景色の話が一気に楽になる。"
  },
  grow_fog: {
    code:"GF型", name:"きづき冒険家", emoji:"🌱",
    one:"伸ばしたい熱はある。目的はこれから芽が出る人",
    blurb:"成長意欲は本物。でも景色がまだふわっとしてる——だから手段の比較で迷子になりやすい。先に「景色の種」を見つけるのが正解ルート。",
    aruaru:["増やしたい気持ちが先走る","何から聞けばいいか迷う","比較しすぎて疲れる","ワクワクする話にはすぐ乗れる"],
    next:"セミナーで全体像→景色を1つ選ぶ、の順が合ってる。商品対決はあとでいい。"
  }
};

let idx=0, answers={}, scores={safe:0,grow:0,clear:0,fog:0}, scene="", ctaPref="";
const KEY="kadocchi_money_type_diag_v4";
const stage=document.getElementById('stage');
const bar=document.getElementById('bar');
const secTag=document.getElementById('secTag');
const count=document.getElementById('count');

function save(){localStorage.setItem(KEY,JSON.stringify({answers,idx,scores,scene,ctaPref}));}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setProgress(pct){ bar.style.width = Math.max(0, Math.min(100, pct)) + '%'; }

function recompute(){
  scores={safe:0,grow:0,clear:0,fog:0}; scene=""; ctaPref="";
  QUESTIONS.forEach(q=>{
    const pick=answers[q.id]; if(pick==null) return;
    const opt=q.opts[pick]; if(!opt) return;
    Object.keys(opt.a).forEach(k=>{
      if(k==='scene') scene=opt.a.scene;
      else if(k==='cta') ctaPref=opt.a.cta;
      else scores[k]=(scores[k]||0)+opt.a[k];
    });
  });
}

function diagnose(){
  recompute();
  const axisSafeGrow = scores.safe>=scores.grow ? 'safe' : 'grow';
  const axisClearFog = scores.clear>=scores.fog ? 'clear' : 'fog';
  const key = axisSafeGrow + '_' + axisClearFog;
  const type = TYPES[key];
  const totalSG = Math.max(1, scores.safe+scores.grow);
  const totalCF = Math.max(1, scores.clear+scores.fog);
  const pctGrow = Math.round(scores.grow/totalSG*100);
  const pctClear = Math.round(scores.clear/totalCF*100);
  let recommend = ctaPref==='consult' ? 'consult' : 'seminar';
  if(ctaPref==='self') recommend = axisClearFog==='fog' ? 'seminar' : 'consult';
  if(key==='grow_clear') recommend = ctaPref==='seminar' ? 'seminar' : 'consult';
  if(key==='safe_fog' || key==='grow_fog') recommend = 'seminar';
  if(key==='safe_clear' && ctaPref==='consult') recommend = 'consult';
  return {key,type,pctGrow,pctClear,recommend};
}

function render(){
  const total=QUESTIONS.length;
  const cur=QUESTIONS[idx];
  setProgress(!cur ? 100 : Math.round(idx/total*100));
  if(!cur){renderResult();return;}
  secTag.textContent=cur.tag;
  count.textContent=`${idx+1} / ${total}`;
  const selected=answers[cur.id];
  const letters="ABCDEFGH";
  const qHtml=esc(cur.q).replace(/\n/g,'<br>');
  stage.innerHTML=`<div class="panel">
    <span class="section-tag">Q${idx+1} · ${esc(cur.tag)}</span>
    <h1 class="q display">${qHtml}</h1>
    <p class="hint">考えすぎ禁止。いちばん「うわ、私」な方を押して</p>
    <div class="choice-list">
      ${cur.opts.map((o,i)=>`<button type="button" class="choice ${selected===i?'on':''}" data-i="${i}" onclick="pick(${i})">
        <span class="mark">${letters[i]}</span><span>${esc(o.t)}</span>
      </button>`).join('')}
    </div>
    <div class="nav">${idx>0?`<button class="btn btn-ghost" onclick="prev()">← 戻る</button>`:''}</div>
    <p class="note">タップで次へ · 途中離脱しても続きからOK</p>
  </div>`;
}

function pick(i){
  answers[QUESTIONS[idx].id]=i; save();
  document.querySelectorAll('.choice').forEach(el=>el.classList.remove('on'));
  const el=document.querySelector(`.choice[data-i="${i}"]`);
  if(el) el.classList.add('on');
  setTimeout(()=>next(true), 200);
}
function next(fromAuto){
  if(answers[QUESTIONS[idx].id]==null){ toast("ひとつ選んでね"); return; }
  idx++; save();
  if(idx===4 && fromAuto){ showBreak(); return; }
  if(idx>=QUESTIONS.length){ renderResult(); return; }
  render();
}
function showBreak(){
  secTag.textContent="判定中…"; count.textContent="折り返し"; setProgress(50);
  stage.innerHTML=`<div class="panel center">
    <div class="break-emoji">✨</div>
    <p class="display" style="font-size:24px;margin-bottom:8px">お、景色のヒントは拾えた</p>
    <p class="hint" style="margin:0 auto 8px">後半は「いまのクセ」チェック。<br>ここでタイプ名が決まります。</p>
    <div class="nav"><button class="btn btn-primary" onclick="render()">続きを見る →</button></div>
  </div>`;
}
function prev(){ if(idx<=0) return; idx--; save(); render(); }

function intro(){
  setProgress(0); secTag.textContent="スタート"; count.textContent="全8問";
  stage.innerHTML=`<div class="landing">
    <div class="landing-board">
      <div class="review r1">
        <div class="stars">★★★★★ <span class="score">4.9</span></div>
        貯金してるのにモヤモヤしてた理由、タイプ名で腑に落ちた
        <div class="who">— miki</div>
      </div>
      <div class="review r2">
        <div class="stars">★★★★☆ <span class="score">4.6</span></div>
        商品の話の前にこれ受けたかった。2分で終わるの偉い
        <div class="who">— ken</div>
      </div>
      <div class="review r3">
        <div class="stars">★★★★★ <span class="score">5.0</span></div>
        「あんしん番長」出て友達に自慢した
        <div class="who">— aya</div>
      </div>
      <div class="review r4">
        <div class="stars">★★★★☆ <span class="score">4.7</span></div>
        売り込み感ゼロで安心。あるあるが刺さりすぎ
        <div class="who">— rio</div>
      </div>
      <div class="hero-core">
        <p class="display hero-title"><span class="hl">もしもお金の目的で</span><br><span class="hl">性格がバレたら？</span></p>
        <p class="hero-sub">次はあなたです</p>
        <p class="lead">貯金はしてるのに、なんかモヤモヤ。<br>商品の話の前に、あなたの「お金の取説」を4タイプで出します。</p>
      </div>
    </div>
    <div class="chip-row">
      <span class="chip a">🛡️ あんしん番長</span>
      <span class="chip b">🗺️ みらい設計士</span>
      <span class="chip c">🧹 ととのえ職人</span>
      <span class="chip d">🌱 きづき冒険家</span>
    </div>
    <div class="nav" style="margin-top:10px">
      <button class="btn btn-primary" style="min-width:240px" onclick="start()">私のタイプを見る →</button>
    </div>
    <p class="note">正解なし · 売り込みなし · 約2分 · モック</p>
  </div>`;
}

function resumeScreen(){
  setProgress(10); secTag.textContent="再開"; count.textContent="続きから";
  stage.innerHTML=`<div class="panel center">
    <div class="break-emoji">👀</div>
    <p class="display" style="font-size:22px;margin-bottom:8px">おっと、診断の途中だった</p>
    <p class="hint">タイプ、まだ出てないよ。続きからいく？</p>
    <div class="nav" style="flex-direction:column;width:100%">
      <button class="btn btn-primary btn-wide" onclick="continueSaved()">続きからやる →</button>
      <button class="btn btn-ghost btn-wide" onclick="resetAll()" style="margin-top:8px">最初からやり直す</button>
    </div>
  </div>`;
}

function start(){ idx=0; answers={}; scores={safe:0,grow:0,clear:0,fog:0}; scene=""; ctaPref=""; save(); render(); }
function continueSaved(){
  const s=load()||{}; answers=s.answers||{}; idx=Math.min(s.idx||0,QUESTIONS.length); scene=s.scene||""; ctaPref=s.ctaPref||"";
  if(idx>=QUESTIONS.length) renderResult(); else render();
}
function resetAll(){ localStorage.removeItem(KEY); answers={}; idx=0; intro(); }

function renderResult(){
  const d=diagnose(); const t=d.type;
  setProgress(100); secTag.textContent="結果"; count.textContent="診断完了";
  const seminarRec = d.recommend==='seminar';
  const seminarBox = `<div class="cta-box ${seminarRec?'rec':''}">
    ${seminarRec?'<span class="rec-label">このタイプの最短ルート</span>':''}
    <h3>まず地図を手に入れる（セミナー）</h3>
    <p>ひとりで調べる前に、全体像をサクッと掴みたい人向け。</p>
    <button type="button" class="btn ${seminarRec?'btn-primary':'btn-ghost'} btn-wide" onclick="mockCta('seminar')">セミナーをのぞく（モック）</button>
  </div>`;
  const consultBox = `<div class="cta-box ${!seminarRec?'rec':''}">
    ${!seminarRec?'<span class="rec-label">このタイプの最短ルート</span>':''}
    <h3>30分だけ壁打ち</h3>
    <p>タイプは分かった。景色と次の一手だけ、短時間で整理したい人向け。</p>
    <button type="button" class="btn ${!seminarRec?'btn-accent':'btn-ghost'} btn-wide" onclick="mockCta('consult')">30分相談してみる（モック）</button>
  </div>`;

  stage.innerHTML=`<div class="panel center">
    <div class="type-hero">
      <div class="type-code">あなたは ${esc(t.code)}</div>
      <div style="font-size:42px;line-height:1">${t.emoji}</div>
      <div class="type-name display">${esc(t.name)}</div>
      <div class="type-one">${esc(t.one)}</div>
    </div>
    <p class="hint" style="text-align:left;max-width:36em;margin:0 auto 4px">${esc(t.blurb)}</p>
    <div class="axes">
      <div class="axis">
        <div class="axis-head"><span>安心寄り</span><span>成長寄り ${d.pctGrow}%</span></div>
        <div class="axis-track"><div class="axis-fill" style="width:${d.pctGrow}%"></div></div>
      </div>
      <div class="axis">
        <div class="axis-head"><span>きづき中</span><span>はっきり ${d.pctClear}%</span></div>
        <div class="axis-track"><div class="axis-fill" style="width:${d.pctClear}%"></div></div>
      </div>
    </div>
    <div class="bullets">
      <h3>このタイプ、あるある</h3>
      <ul>${t.aruaru.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    </div>
    <div class="bullets">
      <h3>いまのあなたへの一言</h3>
      <p style="font-size:14px;margin:0;font-weight:500">${esc(t.next)}${scene?`<br><span style="color:var(--muted)">景色キーワード：${esc(scene)}</span>`:''}</p>
    </div>
    ${seminarRec ? seminarBox+consultBox : consultBox+seminarBox}
    <div class="res-actions">
      <button class="btn btn-ghost" onclick="copyResult()">結果をコピーしてシェア</button>
      <button class="btn btn-ghost" onclick="idx=QUESTIONS.length-1;render()">← 答えを変える</button>
    </div>
    <button class="btn-skip" onclick="resetAll()">もう一回やってみる</button>
    <p class="note">モック：リンク接続は本番で</p>
  </div>`;
}

function copyResult(){
  const d=diagnose(); const t=d.type;
  const text = [
    `【もしもお金の目的で性格がバレたら？】`,
    `${t.emoji} あなたは「${t.name}」（${t.code}）`,
    t.one, ``, t.blurb, ``,
    `あるある：`, ...t.aruaru.map(x=>`・${x}`), ``,
    `いまの一言：${t.next}`,
    scene?`景色キーワード：${scene}`:'',
  ].filter(Boolean).join('\n');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast(ok?'コピーした！ストーリーに貼ってね':'コピーできなかった…');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('コピーした！ストーリーに貼ってね')).catch(fallback);}
  else fallback();
}
function mockCta(kind){
  toast(kind==='seminar' ? "モックなので未接続。本番はセミナー案内へ" : "モックなので未接続。本番は30分相談へ");
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

const saved=load();
if(saved&&saved.answers&&Object.keys(saved.answers).length){resumeScreen();}else{intro();}
</script>

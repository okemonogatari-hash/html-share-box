<!DOCTYPE html>
<html lang="ja" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自分の言葉ワーク｜読んだだけで終わらせないストレングスファインダー活用会</title>
<style>
  :root{
    --paper:#FBF8F3;
    --paper-deep:#F5F0E8;
    --line:#E4DACB;
    --ink:#1F1B16;
    --muted:#5F574C;
    --primary:#2C5F4B;
    --primary-deep:#20493A;
    --accent-ink:#8A5A2B;
    --accent-line:#C4915E;
    --white:#FFFFFF;
    --radius:16px;
    --radius-sm:10px;
    --maxw:640px;
    /* SF4ドメイン色（意味を持つ色。バッジ・ボーダー・チップの面だけに使う。本文地と文字4トークンは不変） */
    --dom-exec-bg:#EFEAF6;   /* 実行力＝パープル系 */
    --dom-exec-ink:#5B4B8A;
    --dom-infl-bg:#FBEEDD;   /* 影響力＝アンバー系 */
    --dom-infl-ink:#8F5C00;
    --dom-rel-bg:#E9F0F8;    /* 人間関係構築力＝ブルー系 */
    --dom-rel-ink:#3D5E8C;
    --dom-think-bg:#E1F1F0;  /* 戦略的思考力＝グリーン系（既存primaryとは明度・色相を分離） */
    --dom-think-ink:#0B6670;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.9;
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3{
    text-wrap:balance;
    line-break:strict;
    margin:0 0 .5em;
    color:var(--primary);
    font-weight:700;
  }
  p{margin:0 0 1em;}
  .noscript-banner{
    max-width:var(--maxw);
    margin:24px auto;
    padding:20px;
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--ink);
  }
  .noscript-banner a{color:var(--accent-ink);}
  #app{display:none;}
  html.js-ready #app{display:block;}
  html.js-ready .noscript-only{display:none;}

  .shell{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 0 48px;
    min-height:100vh;
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--paper);
    padding:14px 20px 10px;
    border-bottom:1px solid var(--line);
  }
  .topbar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:8px;
  }
  .brand{
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .privacy-note{
    font-size:12.5px;
    color:var(--muted);
  }
  .progress-track{
    height:6px;
    background:var(--paper-deep);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--primary);
    border-radius:99px;
    transition:width .3s ease;
    width:0%;
  }
  .step-label{
    font-size:12.5px;
    color:var(--muted);
    margin-top:6px;
  }

  main{padding:24px 20px 8px;}
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px;
    margin-bottom:16px;
  }
  .eyebrow{
    display:inline-block;
    font-size:12.5px;
    color:var(--accent-ink);
    border:1px solid var(--accent-line);
    border-radius:99px;
    padding:3px 10px;
    margin-bottom:12px;
    font-weight:600;
  }
  .eyebrow.gallup{color:var(--primary);border-color:var(--primary);}
  .eyebrow.aim{color:var(--dom-exec-ink);border-color:var(--dom-exec-ink);}
  .question{
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:14px;
    text-wrap:balance;
    line-break:strict;
  }
  .hint{
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:14px;
  }
  textarea, input[type="text"]{
    width:100%;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    line-height:1.8;
  }
  textarea{min-height:110px;resize:vertical;}
  textarea:focus, input[type="text"]:focus{
    outline:2px solid var(--primary);
    outline-offset:1px;
  }
  label.field-label{
    display:block;
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  .field{margin-bottom:16px;}

  .btnrow{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn{
    appearance:none;
    border:none;
    border-radius:99px;
    padding:13px 22px;
    font-size:15px;
    font-weight:700;
    transition:background-color .15s ease, opacity .15s ease, transform .1s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--primary);
    color:var(--white);
  }
  .btn-primary:disabled{
    background:#A9BDB4;
    color:var(--ink);
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
  }
  .btn-reset-armed{
    background:transparent;
    color:var(--accent-ink);
    border:1px solid var(--accent-ink);
  }
  .btn-outline{
    background:var(--paper);
    color:var(--primary);
    border:1px solid var(--primary);
  }
  .btn-sm{padding:9px 14px;font-size:13.5px;}
  .btn-block{width:100%;}

  .theme-tools{margin-bottom:14px;}
  .search-input{margin-bottom:10px;}
  .chip-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--muted);
    border-radius:99px;
    padding:6px 12px;
    font-size:12.5px;
  }
  .chip.is-active{
    background:var(--primary);
    color:var(--white);
    border-color:var(--primary);
  }
  .slot-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .slot{
    flex:1 1 auto;
    min-width:60px;
    border:1px dashed var(--line);
    border-radius:var(--radius-sm);
    padding:8px 6px;
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    background:var(--paper);
  }
  .slot.filled{
    border-style:solid;
    border-color:var(--primary);
    background:var(--paper-deep);
    color:var(--ink);
    font-weight:700;
    cursor:pointer;
  }
  .slot .slot-rank{
    display:block;
    font-size:12.5px;
    color:var(--accent-ink);
    font-weight:700;
    margin-bottom:2px;
  }
  .theme-list{
    max-height:340px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:8px;
  }
  .theme-btn{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    text-align:left;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    margin-bottom:6px;
    font-size:14px;
    color:var(--ink);
  }
  .theme-btn:last-child{margin-bottom:0;}
  .theme-btn.is-picked{
    background:var(--paper-deep);
    border-color:var(--primary);
  }
  .theme-btn.is-disabled{
    opacity:.4;
  }
  .theme-btn small{
    display:block;
    color:var(--muted);
    font-size:12.5px;
    font-weight:400;
    margin-top:2px;
  }
  .badge-chip{
    display:inline-block;
    font-size:12.5px;
    font-weight:600;
    border-radius:99px;
    padding:2px 10px;
    white-space:nowrap;
  }
  .theme-btn .badge-chip{margin-left:8px;}
  .badge-rank{background:var(--accent-ink);color:var(--white);}
  .dom-badge.dom-exec{background:var(--dom-exec-bg);color:var(--dom-exec-ink);}
  .dom-badge.dom-infl{background:var(--dom-infl-bg);color:var(--dom-infl-ink);}
  .dom-badge.dom-rel{background:var(--dom-rel-bg);color:var(--dom-rel-ink);}
  .dom-badge.dom-think{background:var(--dom-think-bg);color:var(--dom-think-ink);}
  .chip.is-active.chip-dom-exec{background:var(--dom-exec-bg);color:var(--dom-exec-ink);border-color:var(--dom-exec-ink);}
  .chip.is-active.chip-dom-infl{background:var(--dom-infl-bg);color:var(--dom-infl-ink);border-color:var(--dom-infl-ink);}
  .chip.is-active.chip-dom-rel{background:var(--dom-rel-bg);color:var(--dom-rel-ink);border-color:var(--dom-rel-ink);}
  .chip.is-active.chip-dom-think{background:var(--dom-think-bg);color:var(--dom-think-ink);border-color:var(--dom-think-ink);}

  .pick-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .pick-item{
    display:block;
    width:100%;
    text-align:left;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    font-size:15px;
    color:var(--ink);
  }
  .pick-item.is-selected{
    background:var(--paper-deep);
    border-color:var(--primary);
    font-weight:700;
  }
  .pick-item .rank{
    display:inline-block;
    font-size:12.5px;
    color:var(--accent-ink);
    font-weight:700;
    margin-right:6px;
  }
  .desc-box{
    background:var(--paper-deep);
    border-left:3px solid var(--primary);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    padding:14px 16px;
    margin-top:12px;
    font-size:14.5px;
  }
  .desc-source{
    display:block;
    font-size:12.5px;
    color:var(--accent-ink);
    margin-top:8px;
  }
  .echo-box p{margin:6px 0 0;font-size:13.5px;}
  .echo-box p:first-child{margin-top:8px;}

  .sentence-block{
    background:var(--paper-deep);
    border-radius:var(--radius-sm);
    padding:18px 16px;
    font-size:17px;
    line-height:2;
    margin-bottom:8px;
  }
  .sentence-block input[type="text"]{
    display:inline-block;
    width:auto;
    min-width:90px;
    max-width:100%;
    font-size:16px;
    font-weight:700;
    color:var(--primary);
    background:var(--white);
    border:1px solid var(--accent-line);
    border-radius:6px;
    padding:4px 8px;
    margin:2px 2px;
  }
  .exp-card, .reflect-card{
    background:var(--paper-deep);
    border-radius:var(--radius-sm);
    padding:16px;
    margin-bottom:14px;
    font-size:14.5px;
  }
  .exp-card dt{color:var(--muted);font-size:12.5px;margin-top:10px;}
  .exp-card dt:first-child{margin-top:0;}
  .exp-card dd{margin:2px 0 0;color:var(--ink);font-weight:600;}
  .reflect-card label{display:block;color:var(--muted);font-size:12.5px;margin:10px 0 4px;}
  .reflect-card label:first-child{margin-top:0;}
  .reflect-card textarea{min-height:56px;}

  .footer-note{
    font-size:12.5px;
    color:var(--muted);
    text-align:center;
    padding:18px 20px 0;
  }
  .article-card{
    display:block;
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    color:var(--ink);
    text-decoration:none;
    margin-top:10px;
  }
  .article-card strong{color:var(--primary);}
  .article-card span{
    display:block;
    font-size:12.5px;
    color:var(--accent-ink);
    margin-top:6px;
  }
  .copy-status{
    font-size:12.5px;
    color:var(--primary);
    margin-top:8px;
    min-height:1.2em;
  }
  .fallback-textarea{
    width:100%;
    min-height:120px;
    margin-top:8px;
    font-size:13px;
    font-family:ui-monospace,monospace;
  }
  .two-col{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  .mini-dots{
    display:flex;
    gap:6px;
    margin-bottom:14px;
  }
  .mini-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--line);
  }
  .mini-dot.is-done{background:var(--primary);}
  .mini-dot.is-current{background:var(--accent-ink);}

  /* ===== v2 追加分 ===== */
  .phil-line{
    font-size:13.5px;
    color:var(--ink);
    background:var(--paper-deep);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    margin-bottom:10px;
  }
  .phil-tag{
    display:inline-block;
    font-size:12.5px;
    font-weight:700;
    margin-right:6px;
  }
  .phil-tag.gallup{color:var(--primary);}
  .phil-tag.okemon{color:var(--accent-ink);}

  /* 資質解説カード（2層構造を廃止し1枚に統合。pick1・nameit共通） */
  .theme-guide{
    margin-top:14px;
    border:1px solid var(--line);
    border-left-width:3px;
    border-left-style:solid;
    border-left-color:var(--line);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    padding:16px;
    background:var(--paper);
  }
  .theme-guide-header{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .theme-guide-name{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
  }
  .theme-guide-metaphor{
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 6px;
    text-wrap:balance;
    line-break:strict;
  }
  .theme-guide-catch{
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 12px;
  }
  .theme-guide-section-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    margin:14px 0 6px;
  }
  .theme-guide-section-label:first-of-type{margin-top:0;}
  .theme-guide-features{
    margin:0;
    padding-left:18px;
    font-size:14px;
    color:var(--ink);
  }
  .theme-guide-features li{margin-bottom:6px;}
  .theme-guide-joy, .theme-guide-hint{
    font-size:13.5px;
    color:var(--muted);
    margin:0;
  }
  .theme-guide-source{
    display:block;
    font-size:12.5px;
    color:var(--accent-ink);
    margin-top:14px;
  }

  .import-dropzone{
    border:1px dashed var(--line);
    border-radius:var(--radius-sm);
    padding:16px;
    margin-bottom:12px;
    background:var(--paper);
  }
  .import-dropzone input[type="file"]{
    font-size:13.5px;
    color:var(--muted);
    width:100%;
    margin-bottom:8px;
  }
  .import-dropzone.is-dragover{
    border:2px dashed var(--primary);
    background:#EEF3F0;
  }
  .import-status{
    font-size:12.5px;
    color:var(--accent-ink);
    margin:8px 0 14px;
    min-height:1.2em;
  }
</style>
</head>
<body>

<noscript>
  <div class="noscript-banner">
    <h1 style="font-size:18px;">このワークはJavaScriptが必要です</h1>
    <p>お使いのブラウザでJavaScriptがオフになっているため、このアプリは動きません。</p>
    <p>かわりに、記事のコピペ用プロンプト版をご利用ください。ChatGPTやClaudeに貼り付けると、同じ内容をAIが1問ずつ訊いてくれます。</p>
    <p><a href="https://library.libecity.com/articles/01M13PRT7HV6ZHFD7GM7WS975J" target="_blank" rel="noopener">【受けたけど、読んだだけ・・】認定コーチが伝える、ストレングスファインダーを「使える」に変える15分（記事を開く）</a></p>
  </div>
</noscript>

<div id="app">
  <div class="shell">
    <div class="topbar">
      <div class="topbar-row">
        <span class="brand">読んだだけで終わらせないSF活用会</span>
        <button type="button" class="btn btn-ghost btn-sm" id="resetBtn">最初からやり直す</button>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="step-label" id="stepLabel"></div>
    </div>
    <main id="main"></main>
    <p class="footer-note">入力内容はこの端末のブラウザだけに保存されます。外部には一切送信されません。</p>
  </div>
</div>

<script>
(function(){
  document.documentElement.classList.remove('no-js');
  document.documentElement.classList.add('js-ready');
})();
</script>
<script>
(function(){
"use strict";

/* ============== 34資質データ ==============
   short: おけもん式ストレングスホーム #themes を一字一句転記（v1採用分）
   metaphor / features / joy / hint: sf-app-v2-data.md §C（PDF自作教材の図解ガイドより）を採用
*/
var THEMES = [
  {name:"達成欲", domain:"実行力", short:"完了と前進に喜びを感じる。", metaphor:"マラソンランナー", features:["並外れたスタミナで目標に向かって走り続ける", "長い距離も諦めずにやり遂げる力がある。働き者で、常に生産性を高めるペースを設定する。一日の終わりに何かを成し遂げたという実感がないと満足できない。", "常に前進し続ける継続力があり、チームを引っ張る持続力を持つ。目標達成に向けて着実に歩み続け、「やり遂げる」ことに価値を見出す。完了することに大きな喜びを感じる。"], joy:"仕事を完遂すること成し遂げた実感・ゴールや成果の積み重ね・生産性の高い一日を過ごすこと・目に見える成果が出ること", hint:"目標やタスクを小さく分割し、達成感を増やす"},
  {name:"アレンジ", domain:"実行力", short:"状況に合わせて段取りを変える。", metaphor:"オーケストラの指揮者", features:["複数のことを整理して組織化し、柔軟に対応する", "動かせるパーツがたくさんあると心地よい。様々な要素を最適に組み合わせることで、最高の成果を出すことを楽しむ人。異なる資源や人を柔軟に組み合わせるのが得意。", "物事に効率よく対処し、成果を上げる。柔軟に、いろんな方向から対処できる。マルチタスクが得意で、様々なリソースを最適配置して生産性を高める。"], joy:"環境が動的であること・必要な変化を起こして対応すること・複数の要素やプロジェクトを同時に進める・効率化や生産性向上のための工夫", hint:"変化自体が目的にならないよう、成果を意識する"},
  {name:"信念", domain:"実行力", short:"大切なものに沿って動く。", metaphor:"灯台", features:["大切な価値観を絶対に守り抜く強さ", "大切な価値観には強いこだわりがあり、絶対に妥協しません。人生の意味や目的を見つけることに重きを置き、その信念に基づいて行動します。", "大切なことのためなら、多少の犠牲もいとわない姿勢を持っています。安定感や明確な方向性、確かな信念を周囲にもたらします。"], joy:"他者のために尽くすこと・自分の信念に沿った行動ができること・人生の意味や目的を感じられること・自分の価値観と合った環境で働くこと", hint:"自分の価値観を明文化してみる"},
  {name:"公平性", domain:"実行力", short:"一貫性と納得感を大切にする。", metaphor:"天秤", features:["すべての人を平等に扱う・明確なルールで安心を作る", "個人の要望よりも、グループ全体のニーズに関心がある。公平性を重視し、誰に対しても同じ基準で接する人。明確なルールや手順があると安心する。", "違いをなくして、みんな同じ状況を作り出すことに努める。規則や方針を決めて、予測しやすい職場や環境を作ることが得意。平等な扱いで信頼を得る。"], joy:"仕事の手順がしっかりと定まっていること・同じ方法で物事を繰り返すこと・誰もが従える明確なルールがあること・みんなが平等に扱われる環境", hint:"公平性と効率性のバランスを取る"},
  {name:"慎重さ", domain:"実行力", short:"失敗を防ぐために先回りする。", metaphor:"石橋を叩く探検家", features:["リスクを丁寧に見極め、細心の注意を払う力", "潜在的なリスクに常に警戒し、決定する前に細心の注意を払います。安全を確保するために十分な準備と確認を行い、慎重に判断を下す人。", "真っ先に危険や課題を考え、リスク評価と事前準備を徹底します。深い配慮と計画性で周囲に安全な環境と安心感を提供します。"], joy:"安全が確保された状態で行動すること・計画通りに物事が進むこと・リスクを事前に防ぐこと・十分な情報と準備の時間があること", hint:"リスクの説明や懸念点を具体的に共有する"},
  {name:"規律性", domain:"実行力", short:"秩序と習慣で安定する。", metaphor:"時計", features:["計画的・いつも同じリズムで整える", "計画的で秩序を大切にする人。スケジュールを遵守し、整理整頓が得意。安定した日常や誰もが従える明確なルールや手順を求める。", "ルール・スケジュール順守で混乱を防止する。計画を立てて効率よく管理し、周囲に一貫性と安定感を提供する。"], joy:"毎日同じリズムで安定していること・整理整頓された環境・明確な手順やマニュアルがあること・混乱のない状態で進められること", hint:"ルールや目的を明文化して共有する"},
  {name:"目標志向", domain:"実行力", short:"目的地が見えると集中する。", metaphor:"矢", features:["明確なゴールにまっすぐ進む／迷いが少ない", "一つのことに打ち込む。明確な目標があると集中できて力を発揮する。何かするときは「そのゴール/目的は何か？」を意識する人。", "優先順位と目的を明確化して効率的に行動する。迷いの時に方向性を示し、周囲を目標に向かって導くことができる。"], joy:"ゴールイメージから開始すること・ゴールや進捗が一目でわかること・明確なゴールと期限がある状況・目的が明確で意味のある作業", hint:"進捗確認や目標振り返りを定期的に行う"},
  {name:"責任感", domain:"実行力", short:"引き受けたことを最後まで果たす。", metaphor:"約束を守る武士", features:["頼られたことを最後までやり抜く・約束を守る", "他者から信頼される人。決めたことに強い責任感を持ち、誠実さや正直さを大切にする。「頼まれたことは必ずやる」という心構えの持ち主。", "約束を守りやり抜く姿勢で周囲に安心感を与える。信頼と行動の倫理観でチームに貢献。「自分が引き受けた」という自覚が強く、最後までやり切る。"], joy:"他者から尊重され、信頼されること・約束どおりに物事が進むこと・明確な期待値や役割があること・自分の言葉に責任を持てること", hint:"NOのテンプレートを作成し、適切に断る練習をする"},
  {name:"回復志向", domain:"実行力", short:"不具合を改善するほど燃える。", metaphor:"お医者さん", features:["問題・トラブルを見つけて治す力", "問題発見・解決が得意。痛みを恐れず課題解決に取り組む人。困難な状況に立ち向かい、物事を改善することにやりがいを感じる。", "真っ先に問題点を見つけ、根本原因を究明する。困難に切り込み、チームの問題解決役として頼られる。解決策を教え、周囲に貢献する。"], joy:"問題を解決できた時の達成感・問題点の発見原因究明のプロセス・「あなたのおかげで解決した」と言われること・困難な状況を改善する取り組み", hint:"問題解決プロセスの知見を記録・共有する"},
  {name:"活発性", domain:"影響力", short:"考えるより始めると動き出す。", metaphor:"エンジン", features:["アイデアをすぐに行動に移し、結果を出す力", "何もしていないことに我慢できない人。話しているだけではなく、すぐに行動に移したくなる。「やってみよう！」が口癖。", "周囲の迷いを見抜き、率先して動く。プレッシャーの中でも前進し、周囲に動きとアクションをもたらす。誰かの背中を押す\"無言の信頼感\"。"], joy:"始めること、人を動かせること・自由に動ける環境・議論よりも行動・「それ、よくやったね」と言われること", hint:"会議の最後にアクションを促す役割を担う"},
  {name:"指令性", domain:"影響力", short:"必要なことをはっきり言う。", metaphor:"船長", features:["自分の意見をはっきり示し、率先してリードする", "リーダータイプと呼ばれることが多く、物事をはっきり言える。相手が気づいていない課題をズバッと指摘でき、怖がらずに意見をぶつけられる人。", "YES/NOをハッキリ伝え、リーダー不在だと自然に仕切り役になる。決断力があり、混乱した場を引き締め、曖昧な状況をはっきりさせて物事を前に進める。"], joy:"リーダーシップを発揮すること・率直な意見交換や議論・決断の場修羅場混乱を収める場面・自分の力で場を動かすこと", hint:"言葉の強さを意識し、時に和らげる"},
  {name:"コミュニケーション", domain:"影響力", short:"伝えることで価値を生む。", metaphor:"通訳", features:["感じたことを言葉にして伝えるのが得意", "自分の考えを言葉に表すことが簡単にできる人。話術に優れ、物事を印象的に説明するのが上手。言葉を通じて人とつながることで満足感を得る。", "相手の考えや感情に合った言葉で、他人とつながる。重要なメッセージに注意を払わせ、抽象的な概念を分かりやすく言語化できる。ストーリーテリングで聴衆を惹きつける。"], joy:"話を聞いてくれる聴衆がいること・ストーリーを話す機会があること・自分の言葉に反応が返ってくること・他の人がアイデアや感情を言葉にするのを手助けできること", hint:"聴衆の声に耳を傾け、関心を引いた部分を特定する"},
  {name:"競争性", domain:"影響力", short:"比較や勝利がエネルギーになる。", metaphor:"レーサー", features:["一番になりたい・勝つために全力を尽くす", "勝負事になると本気になる。ランキングや成果が見えるとやる気が出る。トップを目指すことが自然で、ライバルを見つけると一気に燃え上がる。", "「誰よりも上に行きたい」と思い、本番で実力を発揮する。勝敗や結果にこだわり、チームに勢いを与え、周囲の基準を引き上げる推進力になる。"], joy:"勝負事（ゲーム、ランキング、コンテスト）・1位になること表彰されること・実力勝負自分の成長が数字で見えること・強いライバルと競い合うこと", hint:"「勝つ」を自分らしく定義してみる"},
  {name:"最上志向", domain:"影響力", short:"良いものをもっと良くする。", metaphor:"職人", features:["より良い・最高を求める、強みに着目する", "卓越したものにコミットする。「良い」で満足せず「最高」を追求する。強みを見出し、それを磨き上げるのが得意。質と効率にこだわり、常に改善の余地を探している。", "強みに集中し、弱みにうまく対処する。質へのこだわりを持ち、個人や集団の卓越性を高め、効果を最大化するための手段を常に追求する。"], joy:"投資効果の最大化・効率化・最高一流のものに触れる機会・強みを活かせる環境・量だけでなく質も重視してくれる環境", hint:"自分が熱中できるものを見つける"},
  {name:"自己確信", domain:"影響力", short:"自分の判断を信じて進む。", metaphor:"羅針盤", features:["内なる声と直感を信じて行動する", "\"ブレない軸\"がある人。他人の意見に左右されず、自分の信じる道を迷いなく進む力がある。責任を取る覚悟と、自分の判断に自信を持てる芯の強さが特徴。", "周囲の迷いを見抜き率先して動く。\"自分を信じる姿\"が周囲に安心感を与える。プレッシャーの中でも冷静に判断し、周囲に勇気と自信を与える\"内なるリーダー\"。"], joy:"一人で決めて、一人でやり遂げること・「それ、よく決断したね」と言われること・自分を信じることで誰かの力になれること・自分で選べる裁量や自由度のある環境", hint:"「なぜ自分はこれが正しいと思うのか？」を言語化する"},
  {name:"自我", domain:"影響力", short:"重要な役割を担うと燃える。", metaphor:"舞台の主役", features:["重要な存在でありたい・影響を与えたい", "「あなたがいてくれて良かった！」と言われると最高に嬉しい人。注目されることでモチベーションが高まり、社会や周囲に貢献したいという強い気持ちがある。", "「前例がない」「誰もやっていない」ことに挑戦したくなる。周囲を鼓舞し、大きな目標に向かって突き進むエネルギーを与える。"], joy:"大きな目標を持ち、それを達成するプロセス・影響力を発揮できる舞台（SNS、スピーチなど）・自分の実績を誇れる仕事や活動・「あなたのおかげで」と言われること", hint:"「自分が成し遂げたいこと」を明確にする"},
  {name:"社交性", domain:"影響力", short:"初対面や場づくりで力を出す。", metaphor:"パーティーの司会者", features:["知らない人と出会い、自分を好きになってもらうのが好き", "付き合いが広く交際好き。人と打ち解けて親しくなることに満足感を覚える。初対面の人にも気軽に声をかけられ、すぐに打ち解ける。", "自分から積極的に声をかけ、場を盛り上げる。初対面の人ともすぐに関係を築き、大規模なネットワークを構築・維持する。多様な人と交流し、視野を広げる。"], joy:"今まで会ったことがない人に会うこと・多様性のある交流の場・人々を繋げる架け橋になること・社交の場で人間関係を広げること", hint:"多くの知らない人との出会いがある場に自ら身を置く"},
  {name:"適応性", domain:"人間関係構築力", short:"変化に合わせて流れをつかむ。", metaphor:"川の流れ", features:["変化や予測不可能にも柔軟に対応する力", "「今ここ」を大切にする人。変化や予測不可能な状況に柔軟に対応でき、緊急事態にもすぐ対応できる。流れに身を任せながら状況に合わせて動くことが得意。", "状況に合わせて素早く動く。変化を受け入れ、迅速に対処することで周囲に安心感を与える。予期せぬ出来事にも柔軟に対応し、チームの安定に貢献する。"], joy:"自由自分で選べる裁量がある環境・「今」に集中できること・変化ある環境や多様な状況・自発的に取り組める課題", hint:"変化のある環境や役割を選ぶ"},
  {name:"運命思考", domain:"人間関係構築力", short:"関係性や意味のつながりを見る。", metaphor:"糸", features:["すべてはどこかでつながっていると感じる力", "人類や世界がつながっていると感じる。様々な出来事や人々の間に意味ある関連性を見出し、「私たちはみな同じもの」という意識を持つ。", "つながりを説明し安心を与える。広い視野でモノゴトを捉え、細部だけでなく全体像を考慮する。チームや組織に一体感をもたらす。"], joy:"生命の環とつながりを感じられること・全体感や一体感のある環境・偶然の出会いや不思議な縁・人と人をつなぐ役割", hint:"「つながり」や「意味」を言葉にして共有する"},
  {name:"成長促進", domain:"人間関係構築力", short:"人の伸びしろに目が向く。", metaphor:"コーチ", features:["人の成長や変化を見守りサポートする力", "未経験者にも忍耐強く、人の可能性を信じる人。小さな進歩や成長を見逃さず、相手の成長を自分のことのように喜ぶ。人が力を発揮する瞬間に立ち会うことが好き。", "人の潜在能力を見つけて引き出す。学びや挑戦を応援し、小さな成長も見逃さず褒める。相手が主役で自分は裏方に徹し、成長のプロセスを大切にしながら支援する。"], joy:"誰かの成長や変化に立ち会うこと・人の「できた！」という瞬間を見ること・教える育てるサポートする役割・赤ちゃんの成長を見守るような忍耐", hint:"メンター・研修係・育成担当の役割を引き受ける"},
  {name:"共感性", domain:"人間関係構築力", short:"言葉にならない気持ちに気づく。", metaphor:"心の温度計", features:["他人の感情を察し柔軟に対応できる力", "場の空気や人の気持ちに敏感で、感情豊か。他者の感情や状況を察知するアンテナを持ち、周りの感情の変化に自然と反応できる人。", "相手の感情をよく察して対応を変える。言葉にされていない気持ちを汲み取り、寄り添うことで他者との信頼関係を構築できる。"], joy:"素直な感情表現ができる環境・感情や心情を大切にする場・人の気持ちを考慮した丁寧なコミュニケーション・感情的なつながりを感じられる関係性", hint:"感情表現を大切にする環境づくりをする"},
  {name:"調和性", domain:"人間関係構築力", short:"衝突より合意点を探す。", metaphor:"平和の使者", features:["衝突や争いを静かにまとめる・合意点を探す力", "穏やかな人。対立よりも合意点を探そうとする。全員が納得できる道を見つけることに満足感を覚える。争いごとを避け、調和のとれた環境を好む。", "逆立った羽を滑らかにするように、異なる意見を調整し平和的な問題解決をもたらす。対立を避け、共通点を見出すことで協力関係を強化する。"], joy:"合意点が見つかる場面全員の同意・穏やかな雰囲気調和のとれた環境・みんなが協力し合える場・対立を回避できる解決策", hint:"対話・交渉・意見調整の経験を積む"},
  {name:"包含", domain:"人間関係構築力", short:"輪の外にいる人に気づく。", metaphor:"大きな木", features:["みんなを仲間に迎え入れる・誰も取り残さない", "除外への感度が高く、誰かが仲間はずれになっていないか常に気にする。多様な人を受け入れ、誰も取り残されないよう気を配る人。", "孤立した人を見つけて輪に入れる。誰もが参加できる環境を整え、新しいメンバーを温かく迎え入れる。メンバー全体を巻き込むリーダー役になる。"], joy:"皆を受け入れる開かれた環境・誰とでも打ち解けられる場・多様な人との交流の機会・新しい人を迎え入れる役割", hint:"多様性を尊重する環境づくりを担当する"},
  {name:"個別化", domain:"人間関係構築力", short:"その人らしさに合わせる。", metaphor:"庭師", features:["一人ひとりの違いに目を向け、それぞれの個性を大切にする", "一人ひとりの個性や特徴に興味を持ち、それぞれに合わせたアプローチをする。「カスタマイズ」が好きで、画一的な方法より個別対応の方が自然。", "適材適所を考え、一人ひとりに丁寧に接する。その人の強みを見つけ、活かせる場所に配置できる。公平に機会を提供し、本来の力を発揮できる環境づくりができる。"], joy:"個性が認められること・個々の特徴や強みについて話を聞くこと・その人に合わせた対応ができる自由度・多様性のある環境チーム", hint:"役割分担や個別フィードバックの担当になる"},
  {name:"ポジティブ", domain:"人間関係構築力", short:"前向きな空気をつくる。", metaphor:"太陽", features:["周囲を明るく元気にする前向きな力", "楽観的で周囲を明るくする人。熱意と明るさを持ち、その前向きさが人に伝染する。どんな状況でも良い面を見つけ出し、ポジティブなエネルギーを発散する。", "場を盛り上げ、能動的に周囲を元気づける。明るさを伝染させ、チームに活気とエネルギーを与える。暗い雰囲気を一変させる力がある。"], joy:"楽しく精一杯生きること・笑顔や前向きな雰囲気・人々の気持ちを高める活動・明るいイベントや集まり", hint:"チームのムードメーカーとして役割を担う"},
  {name:"親密性", domain:"人間関係構築力", short:"少人数で濃くつながる。", metaphor:"親友", features:["深い信頼関係や身近な絆を大切にする", "誠実で信頼される人柄。限られた人との深いつながりを大切にし、お互いの本音や価値観を共有することで満足感を得る。一度信頼関係を築いたら長く続く絆を持つ。", "1対1の関係を大切にし、相手の内面まで深く理解しようとする。強い信頼関係を基盤に目標達成に向けて協力し、チームに安定感と一体感をもたらす。"], joy:"家族のような親しい関係・本音で話せる仲間と過ごす時間・長期的な関係の中で互いに成長すること・信頼を深める1対1の対話", hint:"少人数グループのサポート役を担当する"},

var PDFJS_SCRIPT_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js";
var PDFJS_WORKER_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js";
var pdfJsLoadState = "idle"; /* idle | loading | ready | error */
var pdfJsCallbacks = [];
function loadPdfJsThen(onReady, onError){
  if(pdfJsLoadState==="ready" && window.pdfjsLib){ onReady(); return; }
  if(pdfJsLoadState==="error"){ onError(new Error("pdfjs load failed previously")); return; }
  pdfJsCallbacks.push({ok:onReady, err:onError});
  if(pdfJsLoadState==="loading") return;
  pdfJsLoadState = "loading";
  try{
    var s = document.createElement("script");
    s.src = PDFJS_SCRIPT_URL;
    s.onload = function(){
      try{
        if(window.pdfjsLib){
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
          pdfJsLoadState = "ready";
          var cbs = pdfJsCallbacks; pdfJsCallbacks = [];
          cbs.forEach(function(cb){ cb.ok(); });
        } else {
          throw new Error("pdfjsLib not found after load");
        }
      }catch(e){
        pdfJsLoadState = "error";
        var cbs2 = pdfJsCallbacks; pdfJsCallbacks = [];
        cbs2.forEach(function(cb){ cb.err(e); });
      }
    };
    s.onerror = function(e){
      pdfJsLoadState = "error";
      var cbs3 = pdfJsCallbacks; pdfJsCallbacks = [];
      cbs3.forEach(function(cb){ cb.err(e); });
    };
    document.head.appendChild(s);
  }catch(e){
    pdfJsLoadState = "error";
    var cbs4 = pdfJsCallbacks; pdfJsCallbacks = [];
    cbs4.forEach(function(cb){ cb.err(e); });
  }
}
function extractPdfText(arrayBuffer){
  return new Promise(function(resolve, reject){
    try{
      var loadingTask = window.pdfjsLib.getDocument({data:arrayBuffer});
      loadingTask.promise.then(function(pdf){
        var pagePromises = [];
        for(var i=1;i<=pdf.numPages;i++){
          (function(pageNum){
            pagePromises.push(
              pdf.getPage(pageNum).then(function(page){
                return page.getTextContent().then(function(content){
                  return content.items.map(function(it){ return it.str; }).join(" ");
                });
              })
            );
          })(i);
        }
        Promise.all(pagePromises).then(function(pageTexts){
          resolve(pageTexts.join("\n"));
        }, reject);
      }, reject);
    }catch(e){
      reject(e);
    }
  });
}
function detectTop5FromText(text){
  var found = [];
  THEMES.forEach(function(t){
    var idx = text.indexOf(t.name);
    if(idx > -1){ found.push({name:t.name, idx:idx}); }
  });
  found.sort(function(a,b){ return a.idx - b.idx; });
  var names = [];
  found.forEach(function(f){
    if(names.indexOf(f.name)===-1 && names.length<5) names.push(f.name);
  });
  return names;
}

function loadState(){

    if(!raw) return JSON.parse(JSON.stringify(defaultState));
    var parsed = JSON.parse(raw);
    var merged = JSON.parse(JSON.stringify(defaultState));
    for(var k in merged){ if(parsed.hasOwnProperty(k)) merged[k] = parsed[k]; }
    return merged;
  }catch(e){
    return JSON.parse(JSON.stringify(defaultState));
  }
}

var STEPS = [
  {id:"welcome"},
  {id:"branch"},
  {id:"top5entry", applicable:function(s){return s.hasResults===true;}},
  {id:"reportimport", applicable:function(s){return s.hasResults===true && s.entryMethod==="upload";}},
  {id:"top5", applicable:function(s){return s.hasResults===true;}},
  {id:"scene", applicable:function(s){return s.hasResults===false;}},
  {id:"customname", applicable:function(s){return s.hasResults===false;}},
  {id:"pick1", applicable:function(s){return s.hasResults===true;}},
  {id:"confirmcustom", applicable:function(s){return s.hasResults===false;}},
  {id:"nameit"},
  {id:"claimit"},
  {id:"thanks"},
  {id:"aim"},
  {id:"expchoice"},
  {id:"expwhen"},
  {id:"expwhere"},
  {id:"expwho"},
  {id:"expsign"},
  {id:"done"}
];

function isApplicable(step){
  return !step.applicable || step.applicable(state);
}
function applicableSteps(){
  var list = [];
  for(var i=0;i<STEPS.length;i++){ if(isApplicable(STEPS[i])) list.push(i); }
  return list;
}
function currentStepId(){
  return STEPS[state.stepIndex].id;
}
function clampStepIndex(){
  if(state.stepIndex<0) state.stepIndex=0;
  if(state.stepIndex>=STEPS.length) state.stepIndex=STEPS.length-1;
  if(!isApplicable(STEPS[state.stepIndex])){
    // 現在地が非適用なら、直近の適用ステップへ寄せる
    var list = applicableSteps();
    var best = list[0];
    for(var i=0;i<list.length;i++){ if(list[i]<=state.stepIndex) best=list[i]; }
    state.stepIndex = best;
  }
}

function goNext(){
  var list = applicableSteps();
  var pos = list.indexOf(state.stepIndex);
  if(pos>-1 && pos<list.length-1){
    state.stepIndex = list[pos+1];
  }
  saveState();
  render();
  window.scrollTo(0,0);
}
function goPrev(){
  var list = applicableSteps();
  var pos = list.indexOf(state.stepIndex);
  if(pos>0){
    state.stepIndex = list[pos-1];
  }
  saveState();
  render();
  window.scrollTo(0,0);
}
function goTo(id){
  for(var i=0;i<STEPS.length;i++){ if(STEPS[i].id===id){ state.stepIndex=i; break; } }
  saveState();
  render();
  window.scrollTo(0,0);
}

function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.indexOf("on")===0 && typeof attrs[k]==="function") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children = children || [];
  children.forEach(function(c){
    if(c==null) return;
    if(typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function copyText(text, statusEl, fallbackHolder){
  function ok(){ statusEl.textContent = "コピーしました。"; }
  function fail(){
    statusEl.textContent = "自動コピーできませんでした。下のテキストを選択してコピーしてください。";
    if(fallbackHolder){
      fallbackHolder.style.display = "block";
      fallbackHolder.value = text;
      fallbackHolder.focus();
      fallbackHolder.select();
    }
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, fail);
    } else {
      throw new Error("no clipboard api");
    }
  }catch(e){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var success = document.execCommand("copy");
      document.body.removeChild(ta);
      if(success) ok(); else fail();
    }catch(e2){
      fail();
    }
  }
}

var mainEl = document.getElementById("main");
var progressFill = document.getElementById("progressFill");
var stepLabel = document.getElementById("stepLabel");

function updateProgress(){
  var list = applicableSteps();
  var pos = list.indexOf(state.stepIndex);
  /* 分岐前（hasResultsが未確定）は分母が定まらないので数字を出さない */
  if(state.hasResults===null){
    progressFill.style.width = "6%";
    stepLabel.textContent = "はじめに";
    return;
  }
  var pct = list.length>1 ? Math.round((pos/(list.length-1))*100) : 0;
  progressFill.style.width = pct + "%";
  stepLabel.textContent = "ステップ " + (pos+1) + " / " + list.length;
}

function render(){
  clampStepIndex();
  updateProgress();
  mainEl.innerHTML = "";
  var id = currentStepId();
  var renderer = RENDERERS[id];
  if(renderer) mainEl.appendChild(renderer());
}

/* ---- reportimport: PDF/テキストの読み込み ---- */
function renderReportImport(){
  var container = el("div", {});
  container.appendChild(el("div", {class:"question"}, ["結果のPDF、またはテキストを読み込みます。"]));
  container.appendChild(el("p", {class:"hint"}, ["ファイルは端末の中だけで処理されます。どこにも送信されません。"]));

  var dropzone = el("div", {class:"import-dropzone"});
  var fileInput = el("input", {type:"file", accept:".pdf,.txt,text/plain,application/pdf"});
  dropzone.appendChild(fileInput);
  dropzone.appendChild(el("p", {class:"hint", style:"margin:0;"}, ["PDFまたはテキストファイルを選ぶか、ここにファイルをドロップしてください。画像スキャンPDFなど文字が取り出せない場合は、下の欄に直接貼り付けてください。"]));
  container.appendChild(dropzone);

  var statusEl = el("p", {class:"import-status"}, [""]);
  container.appendChild(statusEl);

  var textarea = el("textarea", {placeholder:"ここに直接貼り付けることもできます。PDFを開いて全選択コピー→貼り付けでもOKです。"});
  textarea.value = state.reportText || "";
  container.appendChild(el("div", {class:"field"}, [textarea]));

  var row;
  function syncNext(){
    var btn = row && row.querySelector(".btn-primary");
    if(btn) btn.disabled = !textarea.value.trim();
  }
  textarea.addEventListener("input", syncNext);

  row = navRow({
    nextDisabled: !textarea.value.trim(),
    nextLabel:"資質を検出してTOP5へ",
    onNext:function(){
      var text = textarea.value || "";
      state.reportText = text.slice(0,15000);
      var detected = detectTop5FromText(text);
      if(detected.length){ state.top5 = detected; }
      saveState();
      goNext();
    }
  });
  container.appendChild(row);

  var skipBtn = el("button", {type:"button", class:"btn btn-ghost btn-sm", style:"margin-top:4px;"}, ["読み込まずに自分でTOP5を選ぶ"]);
  skipBtn.addEventListener("click", function(){
    state.entryMethod = "manual";
    saveState();
    goTo("top5");
  });
  container.appendChild(skipBtn);

  fileInput.addEventListener("change", function(){
    var f = fileInput.files && fileInput.files[0];
    if(!f) return;
    handleImportFile(f, statusEl, textarea, syncNext);
  });

  /* ドラッグ＆ドロップでも読み込めるように（ドロップ先はカード全体、目印はdropzone） */
  ["dragenter","dragover"].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.add("is-dragover");
    });
  });
  ["dragleave","dragend"].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){
      e.preventDefault();
      dropzone.classList.remove("is-dragover");
    });
  });
  dropzone.addEventListener("drop", function(e){
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.remove("is-dragover");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(!f){
      statusEl.textContent = "ファイルを受け取れませんでした。ファイル選択か貼り付けをお使いください。";
      return;
    }
    handleImportFile(f, statusEl, textarea, syncNext);
  });
  /* dropzone外に落として画面ごとPDFが開いてしまう事故を防ぐ */
  container.addEventListener("dragover", function(e){ e.preventDefault(); });
  container.addEventListener("drop", function(e){ e.preventDefault(); });

  return card([container]);
}

function handleImportFile(file, statusEl, textarea, syncNext){
  statusEl.textContent = "読み込み中…";
  var isPdf = /\.pdf$/i.test(file.name||"") || file.type === "application/pdf";
  try{
    var reader = new FileReader();
    reader.onerror = function(){
      statusEl.textContent = "ファイルを読み込めませんでした。下の欄に直接貼り付けてください。";
    };
    if(isPdf){
      reader.onload = function(){
        try{
          var arrayBuffer = reader.result;
          loadPdfJsThen(function(){
            extractPdfText(arrayBuffer).then(function(text){
              if(!text || !text.trim()){
                statusEl.textContent = "このPDFからは文字を取り出せませんでした（画像スキャンPDFの可能性）。PDFを開いて全選択コピーし、下の欄に貼り付けてください。";
                return;
              }
              textarea.value = text;
              try{ state.reportText = text.slice(0,15000); saveState(); }catch(e){}
              syncNext();
              statusEl.textContent = "PDFからテキストを読み取りました。内容を確認してください。";
            }, function(){
              statusEl.textContent = "PDFの読み取りに失敗しました。PDFを開いて全選択コピーし、下の欄に貼り付けてください。";
            });
          }, function(){
            statusEl.textContent = "PDF読み取り機能を読み込めませんでした（オフラインの可能性）。PDFを開いて全選択コピーし、下の欄に貼り付けてください。";
          });
        }catch(e){
          statusEl.textContent = "PDFの読み取り中にエラーが発生しました。PDFを開いて全選択コピーし、下の欄に貼り付けてください。";
        }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = function(){
        try{
          textarea.value = reader.result || "";
          try{ state.reportText = textarea.value.slice(0,15000); saveState(); }catch(e){}
          syncNext();
          statusEl.textContent = "テキストを読み込みました。内容を確認してください。";
        }catch(e){
          statusEl.textContent = "ファイルの内容を読み取れませんでした。下の欄に直接貼り付けてください。";
        }
      };
      reader.readAsText(file);
    }
  }catch(e){
    statusEl.textContent = "ファイルを読み込めませんでした。下の欄に直接貼り付けてください。";
  }
}

/* ---- top5 select（検索語・スクロール位置を保ったまま局所更新／検出済み5枠埋まりは専用の見せ方） ---- */
function renderTop5(){
  var container = el("div", {});
  var headerBox = el("div", {});
  var slotRow = el("div", {class:"slot-row"});
  var confirmBox = el("div", {});
  var searchInput = el("input", {type:"text", class:"search-input", placeholder:"資質名で検索（例：共感性）"});
  searchInput.value = "";
  var chipRow = el("div", {class:"chip-row"});
  var domains = ["all","実行力","影響力","人間関係構築力","戦略的思考力"];
  var list = el("div", {class:"theme-list"});
  var navRowEl;

  function isDetectedComplete(){
    return state.entryMethod==="upload" && state.top5.length===5;
  }
  function renderHeaderBox(){
    headerBox.innerHTML = "";
    if(isDetectedComplete()){
      headerBox.appendChild(el("div", {class:"question"}, ["読み取った結果から、TOP5をこの順で入れました。"]));
      headerBox.appendChild(el("p", {class:"hint"}, ["合っていれば、そのまま「この5つで進む」でOK。違うところだけタップして直せます。"]));
    } else {
      headerBox.appendChild(el("div", {class:"question"}, ["TOP5を、順位が上の資質から順に5つ選んでください。"]));
      headerBox.appendChild(el("p", {class:"hint"}, ["資質名を選ぶと、下の枠に順番に入っていきます。枠をタップすると取り消せます。"]));
    }
  }
  function renderConfirmBox(){
    confirmBox.innerHTML = "";
    if(isDetectedComplete()){
      var confirmBtn = el("button", {type:"button", class:"btn btn-primary btn-block"}, ["この5つで進む"]);
      confirmBtn.addEventListener("click", function(){ goNext(); });
      confirmBox.appendChild(confirmBtn);
    }
  }
  function syncNav(){
    var btn = navRowEl && navRowEl.querySelector(".btn-primary");
    if(!btn) return;
    btn.disabled = state.top5.length!==5;
    btn.textContent = state.top5.length===5 ? "つぎへ" : ("あと" + (5-state.top5.length) + "個");
  }
  function renderSlots(){
    slotRow.innerHTML = "";
    for(var i=0;i<5;i++){
      (function(idx){
        var val = state.top5[idx];
        var slot = el("div", {class:"slot" + (val?" filled":"")}, [
          el("span", {class:"slot-rank"}, ["TOP"+(idx+1)]),
          document.createTextNode(val || "未選択")
        ]);
        if(val){
          var theme = findTheme(val);
          var domCls = theme ? DOMAIN_CLASS[theme.domain] : null;
          if(domCls){
            slot.style.borderTopWidth = "3px";
            slot.style.borderTopStyle = "solid";
            slot.style.borderTopColor = "var(--" + domCls + "-ink)";
          }
          slot.addEventListener("click", function(){
            state.top5.splice(idx,1);
            saveState();
            syncAll();
          });
        }
        slotRow.appendChild(slot);
      })(i);
    }
  }
  function renderList(){
    var scrollTop = list.scrollTop;
    list.innerHTML = "";
    var q2 = (searchInput.value||"").trim();
    var shown = THEMES.filter(function(t){
      var matchDomain = state.domainFilter==="all" || t.domain===state.domainFilter;
      var matchQuery = !q2 || t.name.indexOf(q2)>-1;
      return matchDomain && matchQuery;
    });
    if(!shown.length){
      list.appendChild(el("p", {class:"hint", style:"margin:8px;"}, ["該当する資質が見つかりません。"]));
      list.scrollTop = scrollTop;
      return;
    }
    shown.forEach(function(t){
      var picked = state.top5.indexOf(t.name) > -1;
      var full = state.top5.length>=5 && !picked;
      var domCls = DOMAIN_CLASS[t.domain];
      var badgeEl = picked
        ? el("span", {class:"badge-chip badge-rank"}, ["TOP"+(state.top5.indexOf(t.name)+1)])
        : el("span", {class:"badge-chip dom-badge " + domCls}, [DOMAIN_LABEL[t.domain]]);
      var btn = el("button", {type:"button", class:"theme-btn" + (picked?" is-picked":"") + (full?" is-disabled":"")}, [
        el("span", {}, [t.name, el("small", {}, [t.short])]),
        badgeEl
      ]);
      if(!picked && !full){
        btn.addEventListener("click", function(){
          state.top5.push(t.name);
          saveState();
          syncAll();
        });
      } else if(picked){
        btn.addEventListener("click", function(){
          var i2 = state.top5.indexOf(t.name);
          if(i2>-1){ state.top5.splice(i2,1); saveState(); syncAll(); }
        });
      }
      list.appendChild(btn);
    });
    list.scrollTop = scrollTop;
  }
  function updateChipActive(){
    Array.prototype.forEach.call(chipRow.children, function(ch, idx){
      var d = domains[idx];
      if(d===state.domainFilter) ch.classList.add("is-active"); else ch.classList.remove("is-active");
    });
  }
  function syncAll(){
    renderSlots();
    renderList();
    syncNav();
    renderHeaderBox();
    renderConfirmBox();
  }

  domains.forEach(function(d){
    var label = d==="all" ? "すべて" : DOMAIN_LABEL[d];
    var domCls = d==="all" ? "" : DOMAIN_CLASS[d];
    var chip = el("button", {type:"button", class:"chip" + (domCls?" chip-"+domCls:"") + (state.domainFilter===d?" is-active":"")}, [label]);
    chip.addEventListener("click", function(){
      state.domainFilter = d;
      saveState();
      updateChipActive();
      renderList();
    });
    chipRow.appendChild(chip);
  });
  searchInput.addEventListener("input", renderList);

  renderHeaderBox();
  renderSlots();
  renderConfirmBox();
  renderList();

  container.appendChild(headerBox);
  container.appendChild(slotRow);
  container.appendChild(confirmBox);
  container.appendChild(searchInput);
  container.appendChild(chipRow);
  container.appendChild(list);
  navRowEl = navRow({
    nextDisabled: state.top5.length!==5,
    nextLabel: state.top5.length===5 ? "つぎへ" : ("あと" + (5-state.top5.length) + "個")
  });
  container.appendChild(navRowEl);

  return card([container]);
}

function textareaScreen(opts){
  var ta = el("textarea", {placeholder: opts.placeholder||""});
  ta.value = state[opts.field];
  var row;
  ta.addEventListener("input", function(){
    state[opts.field] = ta.value;
    saveState();
    var btn = row && row.querySelector(".btn-primary");
    if(btn) btn.disabled = (opts.required!==false && !state[opts.field].trim());
  });
  var kids = [];
  if(opts.badge){
    kids.push(el("span", {class:"eyebrow" + (opts.badge==="gallup"?" gallup":"")}, [opts.badgeLabel]));
  }
  kids.push(el("div", {class:"question"}, [opts.question]));
  if(opts.hint) kids.push(el("p", {class:"hint"}, [opts.hint]));
  kids.push(el("div", {class:"field"}, [ta]));
  row = navRow({nextDisabled: opts.required!==false && !state[opts.field].trim()});
  kids.push(row);
  return card(kids);
}
function renderNameIt(){
  if(state.hasResults===false){
    return textareaScreen({
      field:"nameIt",
      badge:"okemon",
      badgeLabel:"おけもん流",
      question:"その場面でのあなたの動きの中で、いちばん「自分らしい」と思うのはどこですか？",
      placeholder:"思い当たる動きや、自分の言葉で書いてみてください"
    });
  }
  var t = findTheme(state.selectedTheme);
  var screen = textareaScreen({
    field:"nameIt",
    badge:"gallup",
    badgeLabel:"Gallup公式の問い",
    question:"「" + displayName() + "」の説明の中で、強く共感できる説明は何ですか？",
    placeholder:"思い当たるエピソードや、自分の言葉で書いてみてください",
    hint:"一般的な説明とズレていてもOKです。そのズレの中に自分だけの言葉があります。下の解説カードが、答えを探す材料になります。"
  });
  if(t){
    var guide = renderThemeGuide(state.selectedTheme);
    if(guide){
      var questionEl = screen.querySelector(".question");
      if(questionEl && questionEl.parentNode){
        questionEl.parentNode.insertBefore(guide, questionEl.nextSibling);
      }
    }
  }
  return screen;
}
function renderClaimIt(){
  return textareaScreen({
    field:"claimIt",
    badge:"claim",
    badgeLabel:"Gallup公式の問い",
    question:"「" + displayName() + "」が、過去、あなたの成功に役立ったのはいつですか？",
    placeholder:"具体的な場面を1つ思い出して書いてみてください"

}
function renderThanks(){

    field:"thanks",
    badge:"okemon",
    badgeLabel:"おけもん流",
    question:"「" + displayName() + "」にひとこと感謝を言うとしたら、何に対して言いますか？"
  });
}

/* ---- aim it (2 inputs) ---- */
function renderAim(){
  var i1 = el("input", {type:"text", placeholder:"方法1"});
  i1.value = state.aim1;
  var row;
  function syncAimBtn(){
    var btn = row && row.querySelector(".btn-primary");
    if(btn) btn.disabled = !state.aim1.trim() && !state.aim2.trim();
  }
  i1.addEventListener("input", function(){ state.aim1 = i1.value; saveState(); syncAimBtn(); });
  var i2 = el("input", {type:"text", placeholder:"方法2"});
  i2.value = state.aim2;
  i2.addEventListener("input", function(){ state.aim2 = i2.value; saveState(); syncAimBtn(); });
  row = navRow({nextDisabled: !state.aim1.trim() && !state.aim2.trim()});
  return card([
    el("span", {class:"eyebrow aim"}, ["Gallup公式の問い"]),
    el("div", {class:"question"}, ["これからもっと意図的に「" + displayName() + "」を利用できる方法を2つ挙げてください。"]),
    el("p", {class:"hint"}, ["［おけもん式の解釈］Name it→Claim it→Aim itは1回で終わりではなく、そのつど足りない段階を確認しながら回していくサイクルです。"]),
    el("div", {class:"field"}, [el("label", {class:"field-label"}, ["方法1"]), i1]),
    el("div", {class:"field"}, [el("label", {class:"field-label"}, ["方法2"]), i2]),
    row
  ]);
}

/* ---- experiment micro-steps ---- */
function miniDots(current, total){
  var row = el("div", {class:"mini-dots"});
  for(var i=0;i<total;i++){
    var cls = "mini-dot" + (i<current?" is-done":"") + (i===current?" is-current":"");
    row.appendChild(el("span", {class:cls}));
  }
  return row;
}
function renderExpChoice(){
  var options = [];
  if(state.aim1.trim()) options.push(state.aim1.trim());
  if(state.aim2.trim()) options.push(state.aim2.trim());
  var container = el("div", {});
  container.appendChild(miniDots(0,5));

  if(options.length<=1){
    var only = options[0] || "";
    if(only && !state.expChoiceText){
      state.expChoiceText = only;
      state.expChoice = only;
      saveState();
    }
    container.appendChild(el("div", {class:"question"}, ["さきほどの案を、明日試してみましょう。"]));
    if(only){
      container.appendChild(el("div", {class:"desc-box"}, [only]));
    }
  } else {
    container.appendChild(el("div", {class:"question"}, ["さきほどの2案から、明日試す1つを選んでください。"]));
    var list = el("div", {class:"pick-list"});
    options.forEach(function(opt){
      var btn = el("button", {type:"button", class:"pick-item" + (state.expChoiceText===opt?" is-selected":"")}, [opt]);
      btn.addEventListener("click", function(){
        state.expChoice = opt;
        state.expChoiceText = opt;
        saveState();
        render();
      });
      list.appendChild(btn);
    });
    container.appendChild(list);
  }

  var customInput = el("input", {type:"text", placeholder: options.length<=1 ? "書き直したい場合はここに書けます（任意）" : "それ以外を試す場合はここに書けます（任意）"});
  customInput.value = options.indexOf(state.expChoiceText)>-1 ? "" : state.expChoiceText;
  var expChoiceRow;
  customInput.addEventListener("input", function(){
    state.expChoiceText = customInput.value;
    saveState();
    var btn = expChoiceRow && expChoiceRow.querySelector(".btn-primary");
    if(btn) btn.disabled = !state.expChoiceText.trim();
  });
  container.appendChild(el("div", {class:"field", style:"margin-top:10px;"}, [customInput]));
  expChoiceRow = navRow({nextDisabled: !state.expChoiceText.trim()});
  container.appendChild(expChoiceRow);
  return card([container]);
}
function expMicroScreen(opts, dotIndex){
  var container = el("div", {});
  container.appendChild(miniDots(dotIndex,5));
  container.appendChild(el("div", {class:"question"}, [opts.question]));
  var input = el("input", {type:"text", placeholder:opts.placeholder||""});
  input.value = state[opts.field];
  var row;
  input.addEventListener("input", function(){
    state[opts.field] = input.value;
    saveState();
    var btn = row && row.querySelector(".btn-primary");
    if(btn) btn.disabled = !state[opts.field].trim();
  });
  container.appendChild(el("div", {class:"field"}, [input]));
  row = navRow({nextDisabled: !state[opts.field].trim()});
  container.appendChild(row);
  return card([container]);
}
function renderExpWhen(){
  return expMicroScreen({field:"expWhen", question:"いつ試しますか？", placeholder:"例：明日の朝礼で"}, 1);
}
function renderExpWhere(){
  return expMicroScreen({field:"expWhere", question:"どこで試しますか？", placeholder:"例：オフィスの自分の席で"}, 2);
}
function renderExpWho(){
  return expMicroScreen({field:"expWho", question:"誰に対して試しますか？", placeholder:"例：後輩のAさんに"}, 3);
}
function renderExpSign(){
  var container = el("div", {});
  container.appendChild(miniDots(4,5));
  container.appendChild(el("div", {class:"question"}, ["できたと判断する目印は何ですか？"]));
  container.appendChild(el("p", {class:"hint"}, ["「これができていたら合格」と言えるくらい具体的だと、あとで振り返りやすくなります。"]));
  var input = el("input", {type:"text", placeholder:"例：相手が最後まで話し切って、ありがとうと言ってくれたら"});

  input.addEventListener("input", function(){

  });
  container.appendChild(el("div", {class:"field"}, [input]));
  expSignRow = navRow({
    nextDisabled: !state.expSign.trim(),
    nextLabel:"できあがりを見る"
  });
  container.appendChild(expSignRow);
  return card([container]);
}

/* ---- done ---- */
function buildSentence(){
  var p1 = (state.sentencePart1||"").trim();
  var p2 = (state.sentencePart2||"").trim();
  return "私は" + (p1 || "◯◯") + "が苦もなくできる。だから" + (p2 || "◯◯") + "で困っている人の役に立てる。";
}
function buildCopyAll(){
  var lines = [];
  lines.push("【今日の1文】");
  lines.push(buildSentence());
  lines.push("");
  lines.push("【資質】" + displayName());
  lines.push("");
  lines.push("【明日の実験カード】");
  lines.push("いつ：" + safe(state.expWhen,""));
  lines.push("どこで：" + safe(state.expWhere,""));
  lines.push("誰に対して：" + safe(state.expWho,""));
  lines.push("すること：" + safe(state.expChoiceText,""));
  lines.push("できたと判断する目印：" + safe(state.expSign,""));
  lines.push("");
  lines.push("【3行振り返り（明日やってから書く）】");
  lines.push("やったこと：" + (state.reflect1||""));
  lines.push("起きたこと：" + (state.reflect2||""));
  lines.push("次に変えること：" + (state.reflect3||""));
  return lines.join("\n");
}
function buildHonninLine(){
  var report = (state.reportText||"").trim();
  if(report){
    return "本人レポート：\n" + report + "\n";
  }
  return PROMPT_HONNIN_LINE;
}
function buildDeepDivePrompt(){
  var top5Line;
  if(state.hasResults===true && state.top5.length===5){
    top5Line = "TOP5：" + state.top5.join("・") + "\n";
  } else {
    top5Line = "TOP5：未受験・診断結果なし（今日はこの仮の強みで進めています：" + safe(state.customName, displayName()) + "）\n";
  }
  var progressNote = "今日のワークでName it〜Aim itまで1周済みです。【進め方】①〜⑤は完了しているので、⑥⑦と、出てきた言葉の深掘りから続けてください。最初の自己紹介や資質説明からはやり直さないでください。\n";
  var todayLog =
    "\n【このアプリで先に答えた内容（続きから深掘りしてください）】\n" +
    progressNote +
    "選んだ資質／仮の強み：" + safe(displayName(),"未記入") + "\n" +
    "Name it（強く共感できた説明）：" + safe(state.nameIt,"未記入") + "\n" +
    "Claim it（過去に役立った場面）：" + safe(state.claimIt,"未記入") + "\n" +
    "感謝のひとこと：" + safe(state.thanks,"未記入") + "\n" +
    "Aim it 案1：" + safe(state.aim1,"未記入") + "\n" +
    "Aim it 案2：" + safe(state.aim2,"未記入") + "\n" +
    "明日試すと決めた案：" + safe(state.expChoiceText,"未記入") + "\n" +
    "いつ／どこで／誰に対して：" + safe(state.expWhen,"未記入") + "／" + safe(state.expWhere,"未記入") + "／" + safe(state.expWho,"未記入") + "\n" +
    "できたと判断する目印：" + safe(state.expSign,"未記入") + "\n" +
    "ここまでの答えから組み立てた1文（◯◯は本人がまだ埋めていない箇所）：" + buildSentence() + "\n";
  return PROMPT_HEAD + top5Line + buildHonninLine() + todayLog + PROMPT_TAIL;
}

function startNewLap(){
  var keep = {
    top5: state.top5.slice(),
    scene: state.scene,
    customName: state.customName,
    hasResults: state.hasResults,
    entryMethod: state.entryMethod,
    reportText: state.reportText,
    domainFilter: state.domainFilter,
    lapCount: (state.lapCount||1) + 1
  };
  var fresh = JSON.parse(JSON.stringify(defaultState));
  for(var k in keep){ fresh[k] = keep[k]; }
  state = fresh;
  saveState();
  goTo("pick1");
}

function renderDone(){
  var container = el("div", {});
  container.appendChild(el("span", {class:"eyebrow"}, ["できあがり"]));
  if(state.lapCount && state.lapCount>1){
    container.appendChild(el("span", {class:"eyebrow", style:"margin-left:6px;"}, [state.lapCount + "周目"]));
  }
  container.appendChild(el("h2", {}, ["今日、資質が「自分の言葉」に変わりました。"]));

  container.appendChild(el("div", {class:"desc-box echo-box"}, [
    el("strong", {}, ["今日、あなたが話した言葉"]),
    el("p", {}, ["Name it：" + safe(state.nameIt, "（まだ書いていません）")]),
    el("p", {}, ["Claim it：" + safe(state.claimIt, "（まだ書いていません）")])
  ]));
  container.appendChild(el("p", {class:"hint"}, ["この中の言葉を、そのまま下の空欄に当てはめてみてください。埋まらないところは空欄のままでOKです。"]));

  var sentenceBox = el("div", {class:"sentence-block"});

  input1.addEventListener("input", function(){ state.sentencePart1 = input1.value; saveState(); });
  var input2 = el("input", {type:"text", placeholder:"（ここに書く）"});
  input2.value = state.sentencePart2;
  input2.addEventListener("input", function(){ state.sentencePart2 = input2.value; saveState(); });
  sentenceBox.appendChild(document.createTextNode("私は"));
  sentenceBox.appendChild(input1);
  sentenceBox.appendChild(document.createTextNode("が苦もなくできる。だから"));
  sentenceBox.appendChild(input2);
  sentenceBox.appendChild(document.createTextNode("で困っている人の役に立てる。"));
  container.appendChild(sentenceBox);
  container.appendChild(el("p", {class:"hint"}, ["空欄のままコピーすると「◯◯」のままコピーされます。あとから書き足しても大丈夫です。"]));

  var expCard = el("dl", {class:"exp-card"}, [
    el("dt", {}, ["いつ／どこで／誰に対して"]),
    el("dd", {}, [safe(state.expWhen,"（未記入）") + "／" + safe(state.expWhere,"（未記入）") + "／" + safe(state.expWho,"（未記入）")]),
    el("dt", {}, ["すること"]),
    el("dd", {}, [safe(state.expChoiceText,"（未記入）")]),
    el("dt", {}, ["できたと判断する目印"]),
    el("dd", {}, [safe(state.expSign,"（未記入）")])
  ]);
  container.appendChild(el("h3", {style:"font-size:15px;margin-top:20px;"}, ["明日の実験カード"]));
  container.appendChild(expCard);

  var r1 = el("textarea", {placeholder:"（明日やってから書く）"});
  r1.value = state.reflect1;
  r1.addEventListener("input", function(){ state.reflect1 = r1.value; saveState(); });
  var r2 = el("textarea", {placeholder:"（明日やってから書く）"});
  r2.value = state.reflect2;
  r2.addEventListener("input", function(){ state.reflect2 = r2.value; saveState(); });
  var r3 = el("textarea", {placeholder:"（明日やってから書く）"});
  r3.value = state.reflect3;
  r3.addEventListener("input", function(){ state.reflect3 = r3.value; saveState(); });
  var reflectCard = el("div", {class:"reflect-card"}, [
    el("label", {}, ["やったこと"]), r1,
    el("label", {}, ["起きたこと"]), r2,
    el("label", {}, ["次に変えること"]), r3
  ]);
  container.appendChild(el("h3", {style:"font-size:15px;margin-top:20px;"}, ["3行振り返り（空欄でOK）"]));
  container.appendChild(reflectCard);

  var statusEl = el("p", {class:"copy-status"}, [""]);
  var fallback1 = el("textarea", {class:"fallback-textarea", style:"display:none;"});
  var fallback2 = el("textarea", {class:"fallback-textarea", style:"display:none;"});
  var fallback3 = el("textarea", {class:"fallback-textarea", style:"display:none;"});

  var btn1 = el("button", {class:"btn btn-primary btn-block", type:"button"}, ["シェア用に1文だけコピー"]);
  btn1.addEventListener("click", function(){ copyText(buildSentence(), statusEl, fallback1); });
  var btn2 = el("button", {class:"btn btn-outline btn-block", type:"button"}, ["全部コピー（メモ用）"]);
  btn2.addEventListener("click", function(){ copyText(buildCopyAll(), statusEl, fallback2); });
  var btn3 = el("button", {class:"btn btn-outline btn-block", type:"button"}, ["AIでさらに深掘りする（プロンプトをコピー）"]);
  btn3.addEventListener("click", function(){ copyText(buildDeepDivePrompt(), statusEl, fallback3); });

  container.appendChild(el("div", {class:"btnrow", style:"flex-direction:column;align-items:stretch;margin-top:22px;"}, [btn1, btn2, btn3]));
  container.appendChild(statusEl);
  container.appendChild(fallback1);
  container.appendChild(fallback2);
  container.appendChild(fallback3);

  if(state.hasResults===true){
    container.appendChild(el("p", {class:"hint", style:"margin-top:18px;"}, ["［おけもん式の解釈］1つ深掘りしたら、また別の資質で同じサイクルを回してみると、TOP5全体が「自分の言葉」に変わっていきます。"]));
    var lapBtn = el("button", {class:"btn btn-outline btn-block", type:"button"}, ["別の資質でもう1周する"]);
    lapBtn.addEventListener("click", function(){ startNewLap(); });
    container.appendChild(lapBtn);
  }

  var article = el("a", {class:"article-card", href:ARTICLE_URL, target:"_blank", rel:"noopener"}, [
    el("strong", {}, ["続きを読む"]),
    document.createTextNode(ARTICLE_TITLE),
    el("span", {}, ["元記事：Gallup公式の3ステップとAIプロンプトの解説"])
  ]);
  container.appendChild(article);

  container.appendChild(el("div", {class:"btnrow"}, [
    el("button", {class:"btn btn-ghost", type:"button", onclick:goPrev}, ["もどる"])
  ]));

  return card([container]);
}

/* window.confirm はアプリ内ブラウザで無効化されることがあるため、2度押し方式にする */
(function(){
  var resetBtnEl = document.getElementById("resetBtn");
  var resetArmed = false;
  var resetTimer = null;
  function disarmReset(){
    resetArmed = false;
    if(resetTimer){ clearTimeout(resetTimer); resetTimer = null; }
    resetBtnEl.textContent = "最初からやり直す";
    resetBtnEl.classList.remove("btn-reset-armed");
  }
  resetBtnEl.addEventListener("click", function(){
    if(!resetArmed){
      resetArmed = true;
      resetBtnEl.textContent = "ほんとに消す？";
      resetBtnEl.classList.add("btn-reset-armed");
      resetTimer = setTimeout(disarmReset, 4000);
      return;
    }
    disarmReset();
    state = JSON.parse(JSON.stringify(defaultState));
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    render();
    window.scrollTo(0,0);
  });
})();

render();
})();

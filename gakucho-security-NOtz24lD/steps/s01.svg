<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" role="img">
<title>設定を開いたら 自分の名前 画面の一番上を押す</title>
<g font-family="Noto Sans CJK JP, sans-serif">
<rect x="2" y="2" width="436" height="426" rx="23" fill="#fffdfa" stroke="#d9e5df" stroke-width="2"/>
<circle cx="37" cy="37" r="21" fill="#cf6f28"/>
<text x="37" y="45" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="72" y="46" font-size="24" fill="#203b36" font-weight="700" text-anchor="start">設定を開いたら</text>
<rect x="40" y="78" width="360" height="255" rx="25" fill="#ffffff" stroke="#506767" stroke-width="4"/>
<rect x="177" y="86" width="86" height="7" rx="3" fill="#a9b8b0"/>
<text x="60" y="129" font-size="22" fill="#566d68" font-weight="500" text-anchor="start">設定</text>
<line x1="57" y1="146" x2="383" y2="146" stroke="#d9e5df" stroke-width="2"/>
<rect x="56" y="162" width="328" height="101" rx="13" fill="#fff0d9" stroke="#cf6f28" stroke-width="3"/>
<text x="75" y="215" font-size="25" fill="#102e29" font-weight="700" text-anchor="start">自分の名前</text>
<path d="M350 292 L350 252" fill="none" stroke="#cf6f28" stroke-width="5" stroke-linecap="round"/>
<path d="M341 263 L350 252 L359 263" fill="none" stroke="#cf6f28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="61" y="295" font-size="21" fill="#9d551b" font-weight="700" text-anchor="start">色のついた項目を押す</text>
<text x="220" y="373" font-size="22" fill="#27463c" font-weight="700" text-anchor="middle">画面の一番上を押す</text>
<text x="220" y="405" font-size="14" fill="#62746d" font-weight="400" text-anchor="middle">操作場所を説明する図  実画面ではありません</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" role="img">
<title>2つとも確認できたら 盗難保護がオン 「常に」を選択済み メニュー名だけでは完了にしない</title>
<g font-family="Noto Sans CJK JP, sans-serif">
<rect x="2" y="2" width="436" height="426" rx="23" fill="#fffdfa" stroke="#d9e5df" stroke-width="2"/>
<circle cx="37" cy="37" r="21" fill="#25785e"/>
<text x="37" y="45" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="72" y="46" font-size="24" fill="#203b36" font-weight="700" text-anchor="start">2つとも確認できたら</text>
<rect x="40" y="78" width="360" height="255" rx="25" fill="#ffffff" stroke="#506767" stroke-width="4"/>
<rect x="177" y="86" width="86" height="7" rx="3" fill="#a9b8b0"/>
<text x="60" y="129" font-size="22" fill="#566d68" font-weight="500" text-anchor="start">完了の目安</text>
<line x1="57" y1="146" x2="383" y2="146" stroke="#d9e5df" stroke-width="2"/>
<rect x="56" y="162" width="328" height="101" rx="13" fill="#e8f3ec" stroke="#25785e" stroke-width="3"/>
<text x="75" y="202" font-size="25" fill="#102e29" font-weight="700" text-anchor="start">盗難保護がオン</text>
<text x="75" y="234" font-size="25" fill="#102e29" font-weight="700" text-anchor="start">「常に」を選択済み</text>
<circle cx="353" cy="286" r="19" fill="#25785e"/>
<path d="M343 286 L350 293 L364 277" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="295" font-size="22" fill="#25785e" font-weight="700" text-anchor="start">こうなれば OK</text>
<text x="220" y="373" font-size="22" fill="#27463c" font-weight="700" text-anchor="middle">メニュー名だけでは完了にしない</text>
<text x="220" y="405" font-size="14" fill="#62746d" font-weight="400" text-anchor="middle">操作場所を説明する図  実画面ではありません</text>
</g></svg>
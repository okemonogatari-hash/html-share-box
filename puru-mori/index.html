<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2e8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="カピバラとインコのゼリーを、つついて、つまんで、はなして遊ぶ小さな窓辺。">
  <meta property="og:title" content="ぷるもり。 — つまんで、はなして、ぷるん。">
  <meta property="og:description" content="カピバラとインコの、ぷにぷにゼリー。指でつついて遊んでみてね。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://okemonogatari-hash.github.io/html-share-box/puru-mori/">
  <meta property="og:image" content="https://okemonogatari-hash.github.io/html-share-box/puru-mori/poster.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>ぷるもり。 — つまんで、はなして、ぷるん。</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="jelly-room">
    <header>
      <p class="eyebrow"><span></span> 窓辺に、ちいさないきもの。</p>
      <h1>ぷるもり<span>。</span></h1>
      <p class="tagline">つまんで、はなして、ぷるん。</p>
      <div class="companions" role="group" aria-label="いきものを選ぶ"><button type="button" class="chosen" data-pet="capybara" aria-pressed="true">カピバラ</button><button type="button" data-pet="parakeet" aria-pressed="false">インコ</button></div>
    </header>
    <section class="stage" aria-label="透明なゼリーの子と遊ぶ場所">
      <canvas tabindex="0" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight" id="jelly-canvas" aria-label="透明な水色のゼリー。クリックやタップでつつく、ドラッグで持ち上げ、離すと弾みます。下のボタンでも遊べます。"></canvas>
      <div class="touch-ring" aria-hidden="true"></div>
      <span class="whisper" aria-hidden="true">ぷる…</span>
      <div class="failure" role="alert" hidden><strong>この窓では、ぷるもりを表示できませんでした。</strong><p>WebGLに対応したブラウザで開いてみてください。</p></div>
    </section>
    <footer>
      <p class="hint">指でつつく。つまんで、ひょい。</p>
      <div class="actions" aria-label="ボタンで遊ぶ">
        <button type="button" id="poke"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v5M5 6l3 3M19 6l-3 3M5 17c0-4 3-6 7-6s7 2 7 6c0 3-14 3-14 0Z"/></svg>つつく</button>
        <button type="button" id="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10M8 9l4 4 4-4M5 18c2 3 12 3 14 0M7 16l-2 2M17 16l2 2"/></svg>もち上げて、ぽとん</button>
        <button type="button" id="sleep" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4A8 8 0 1 0 20 16 8 8 0 0 1 16 4Z"/></svg><span>おやすみ</span></button>
      </div>
      <div class="little-things">
        <div class="flavors" role="group" aria-label="ゼリーの色">
          <button type="button" class="flavor mint selected" data-flavor="mint" aria-label="はちみつ色" aria-pressed="true"><i></i></button>
          <button type="button" class="flavor peach" data-flavor="peach" aria-label="しずく色" aria-pressed="false"><i></i></button>
          <button type="button" class="flavor grape" data-flavor="grape" aria-label="すみれ色" aria-pressed="false"><i></i></button>
        </div>
        <p id="mood" role="status" aria-live="polite">ぷるぷる、してる。</p>
        <button type="button" class="save-photo" id="photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l1-2h6l1 2h4v14H4V6h4Z"/><circle cx="12" cy="12.5" r="3.5"/></svg><span>写真</span></button>
      </div>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>

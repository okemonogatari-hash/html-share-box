<style>
  :root { color-scheme: light; --c: #F28B1E; --soft: #FFE7CC; --ink: #1E1A16; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--soft); color: var(--ink); font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 22px 16px 40px; }
  .tag { font-size: 14px; color: #5A5048; margin: 0; }
  h1 { font-size: 40px; margin: 2px 0 14px; color: var(--c); line-height: 1.15; }
  h1 small { font-size: 18px; color: var(--ink); }
  video { width: 100%; aspect-ratio: 16/9; border-radius: 16px; background: #000; display: block; border: 3px solid var(--ink); box-shadow: 6px 7px 0 var(--c); }
  .vbox { text-align: center; }
  .vbox.tall video { aspect-ratio: 9/16; width: auto; max-width: 100%; height: min(78vh, 900px); margin: 0 auto; }
  .seg { display: flex; gap: 6px; margin: 0 0 10px; }
  .seg button { flex: 1; font: inherit; font-weight: 800; font-size: 14px; padding: 8px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--ink); color: #fff; }
  .seg small { font-weight: 600; font-size: 11px; display: block; }
  .quote { margin: 18px 0 8px; font-size: 22px; font-weight: 800; line-height: 1.5; background: #fff; border-radius: 14px; padding: 12px 16px; }
  .quote span { display: block; font-size: 12px; color: var(--c); }
  .share { margin-top: 18px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 16px; }
  .share h2 { margin: 0 0 4px; font-size: 18px; }
  .share p { margin: 0 0 12px; font-size: 13px; color: #6A6058; line-height: 1.6; }
  .btn { display: block; width: 100%; margin-top: 10px; text-align: center; font: inherit; font-weight: 800; font-size: 17px; padding: 14px; border-radius: 14px; text-decoration: none; border: 0; cursor: pointer; }
  .copy { background: var(--c); color: #fff; }
  #done { margin-top: 8px; font-size: 14px; font-weight: 800; color: var(--c); text-align: center; }
  .url { margin: 8px 0 0; font-size: 12px; color: #6A6058; text-align: center; word-break: break-all; }
  .sub { margin: 16px 0 0; font-size: 13px; color: #6A6058; text-align: center; line-height: 1.8; }
  .sub a { color: var(--ink); }
  .all { display: block; margin-top: 22px; text-align: center; font-size: 14px; color: var(--ink); }
</style>
</head>
<body>
<main>
  <p class="tag">やさしいホームページ屋　｜　共催</p>
  <h1>りんつ<small>さん</small></h1>
  <div class="seg" role="group" aria-label="動画の向き"><button type="button" id="bw" aria-pressed="true">横 16:9<small>X・リベ・PCで</small></button><button type="button" id="bt" aria-pressed="false">縦 9:16<small>インスタのリール・ストーリーズに</small></button></div>
  <div class="vbox" id="vb"><video id="mv" controls playsinline preload="metadata" poster="../og1.jpg" src="../v1.mp4"></video></div>
  <p class="quote"><span>✍️ りんつさんのことば</span>Webデザインで、人と人をつなぐ。</p>
  <section class="share">
    <button class="btn copy" id="cp" type="button">🔗 このページのリンクをコピー</button>
    <p class="url" id="t">https://okemonogatari-hash.github.io/html-share-box/friend-share-g-9CIJPK2fWtSeIZBW/rintsu/</p>
    <div id="done" hidden>リンクをコピーしました</div>
  </section>
  <p class="sub">動画ファイルを保存する：<a href="../vv1.mp4" download="りんつさん_紹介ムービー_縦_20261016.mp4">縦（リール・ストーリーズ用）</a>　／　<a href="../v1.mp4" download="りんつさん_紹介ムービー_横_20261016.mp4">横</a></p>
  <a class="all" href="../">もくもく作業会の7人のムービーを見る →</a>
</main>
<script>
  // 横／縦の切り替え（スマホ幅では最初から縦。JSが動かない時は横のまま見える）
  (function () {
    const v = document.getElementById('mv'), vb = document.getElementById('vb'), bw = document.getElementById('bw'), bt = document.getElementById('bt');
    const SRC = { w: ['../v1.mp4', '../og1.jpg'], t: ['../vv1.mp4', '../vp1.jpg'] };
    function set(m) { if (vb.dataset.m === m) return; vb.dataset.m = m; v.pause(); v.poster = SRC[m][1]; v.src = SRC[m][0]; vb.classList.toggle('tall', m === 't'); bw.setAttribute('aria-pressed', m === 'w'); bt.setAttribute('aria-pressed', m === 't'); }
    vb.dataset.m = 'w';
    bw.addEventListener('click', () => set('w')); bt.addEventListener('click', () => set('t'));
    if (window.matchMedia('(max-width: 600px)').matches) set('t');
  })();
  const T = "https://okemonogatari-hash.github.io/html-share-box/friend-share-g-9CIJPK2fWtSeIZBW/rintsu/";
  document.getElementById('cp').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(T); }
    catch (e) { const a = document.createElement('textarea'); a.value = T; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
    document.getElementById('done').hidden = false;
  });
</script>
</body>
</html>

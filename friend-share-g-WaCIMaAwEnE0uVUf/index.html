  .stage button { background: #222; cursor: pointer; }
  .stage button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stage button i { position: absolute; left: 50%; top: 64%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: rgba(255,210,31,.96); border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
  .stage button i::after { content: ""; position: absolute; left: 34px; top: 24px; border-left: 34px solid var(--ink); border-top: 21px solid transparent; border-bottom: 21px solid transparent; }
  .stage button em { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #fff; font-style: normal; font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px #000; }

<script>
const T = 'https://okemonogatari-hash.github.io/html-share-box/friend-share-g-WaCIMaAwEnE0uVUf/';
document.getElementById('play').addEventListener('click', (e) => {
  const v = document.createElement('video');
  Object.assign(v, { src: 'intro.mp4', poster: 'poster.jpg', controls: true, playsInline: true, autoplay: true });
  v.setAttribute('playsinline', ''); e.currentTarget.replaceWith(v); v.play().catch(() => {});

document.getElementById('cp').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(T); }
  catch (e) { const a = document.createElement('textarea'); a.value = T; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  document.getElementById('note').textContent = 'リンクをコピーしました';
});

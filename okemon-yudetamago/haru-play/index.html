sition:opacity .15s}.whisper.visible{opacity:1}.touch-ring{position:absolute;width:32px;height:32px;margin:-16px;transform:scale(.6);border:1px solid #ffffffb0;border-radius:50%;opacity:0;pointer-events:none;box-shadow:0 0 0 6px #ffffff15;transition:opacity .12s,transform .12s}.touch-ring.visible{opacity:1;transform:scale(1)}.loading,.failure{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#eef2e5e8;color:#6e7c64;font-size:13px}.loading[hidden],.failure[hidden]{display:none}.little-egg{width:32px;height:39px;border-radius:55% 55% 48% 48%;background:linear-gradient(135deg,#fff,#fff9e7);box-shadow:0 8px 12px #6b765826}.controls{display:grid;grid-template-columns:1fr auto;gap:14px 24px;align-items:center;padding:24px 12px 0}.hint{font-size:15px;letter-spacing:.12em;margin:0 0 6px}.subhint{font-size:12px;color:var(--muted);line-height:1.7;margin:0}.tools{display:flex;gap:8px}.mood{grid-column:1/-1;text-align:center;min-height:24px;margin:7px 0 0;color:#87937a;font-size:12px;letter-spacing:.1em}.colophon{font-size:10px;color:#9ca48f;text-align:center;margin:28px 0 0;letter-spacing:.04em}.colophon span{margin-left:16px}

<body>
  <main class="egg-room">
    <header class="intro">
      <p class="eyebrow"><span></span> OKE MORI / LITTLE TOUCH</p>
      <h1>ぷにっと、ゆで卵<span>。</span></h1>
      <p class="lead">つつく、つまむ、はなす。<br class="phone-only">今日は、ちょっとやわらかく。</p>
    </header>
    <section class="stage" aria-label="ゆで卵と遊ぶ場所">
      <canvas id="egg-canvas" tabindex="0" aria-label="白い卵の3Dモデル。押すとその場所がへこみ、ドラッグすると持ち上がり、離すと弾んで戻ります。キーボードはEnterでつつく、Spaceを押して持ち上げて離す、矢印キーでも動かせます。"></canvas>
      <div class="loading" id="loading"><span class="little-egg"></span><p>やわらかく、準備中…</p></div>
      <div class="failure" id="failure" role="alert" hidden><strong>卵を読み込めませんでした。</strong><p>ページを読み込み直してください。</p></div>
      <div class="touch-ring" aria-hidden="true"></div>
      <span class="stage-note" aria-hidden="true">TOUCH & FEEL</span>
      <div class="whisper" aria-hidden="true"></div>
    </section>
    <footer class="controls">
      <div class="instructions"><p class="hint">押したところが、ふにっ。</p><p class="subhint">そのままつまんで、ひょい。はなすと、ぽよん。</p></div>
      <div class="tools"><button id="gentle" type="button" aria-pressed="false">ゆっくり</button><button id="reset" type="button">もとの場所へ</button></div>
      <p id="mood" class="mood" role="status" aria-live="polite">さわってみてね。</p>
    </footer>
    <p class="colophon">おけもんゆで卵計画の卵から。<span>なでるように、やさしく。</span></p>
    <output id="qa" hidden aria-hidden="true"></output>
  </main>

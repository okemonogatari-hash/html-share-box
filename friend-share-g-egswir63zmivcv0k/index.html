<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<meta name="okemori-audience" content="external">
<title>AIブースのお知らせ、教えて！（1分）</title>
<style>
:root{
  color-scheme: light;
  --bg1:#fff6ec; --bg2:#e9f8f1; --ink:#2b3350; --sub:#6b7391;
  --mint:#7fd8bb; --mint-d:#3fae8a; --pink:#ff9db8; --pink-d:#e8567f; --yellow:#ffd966; --card:#ffffff; --line:#e6e9f2;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 12% 8%,#ffe4ee 0,transparent 38%),radial-gradient(circle at 92% 20%,#d9f5ea 0,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-color:#fff6ec;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;padding:10px 0 8px;background:linear-gradient(#fff6ecf0 70%,#fff6ec00)}
.pg-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px}
.bar{height:12px;border-radius:99px;background:#fff;border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--pink));transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.stage{position:relative;margin-top:8px}
.guide{display:flex;align-items:flex-end;gap:8px;min-height:116px;padding:0 4px}
.guide img{width:104px;height:104px;object-fit:contain;flex:none;transform-origin:50% 100%}
.guide img.hop{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
.say{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-size:14px;line-height:1.5;font-weight:700;margin-bottom:22px;max-width:calc(100% - 116px);box-shadow:0 4px 0 #eef0f7}
.say:before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-22px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.card{background:var(--card);border-radius:28px;padding:22px 18px 18px;border:2px solid var(--line);box-shadow:0 8px 0 #eef0f7,0 18px 30px -18px #3a4a7a33;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.card.back{animation:popb .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:translateX(34px) scale(.96)}to{opacity:1;transform:none}}
@keyframes popb{from{opacity:0;transform:translateX(-34px) scale(.96)}to{opacity:1;transform:none}}
.qno{display:inline-block;background:var(--pink);color:#fff;font-weight:800;font-size:13px;border-radius:99px;padding:3px 12px;margin-bottom:10px}
.qno.opt{background:var(--mint-d)}
h1,h2{margin:0 0 6px;font-size:20px;line-height:1.5}
.hint{margin:0 0 14px;font-size:13px;color:var(--sub);line-height:1.6}
.opts{display:grid;gap:10px;margin-top:12px}
.opt-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:15.5px;line-height:1.45;color:var(--ink);background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:48px;transition:transform .12s,border-color .12s,background .12s;-webkit-tap-highlight-color:transparent}
.opt-btn:active{transform:scale(.97)}
.opt-btn .mk{flex:none;width:24px;height:24px;border:2.5px solid #c9cfe0;background:#fff;display:grid;place-items:center;font-size:15px;font-weight:900;color:#fff}
.opt-btn.radio .mk{border-radius:50%}
.opt-btn.check .mk{border-radius:8px}
.opt-btn[aria-pressed="true"],.opt-btn[aria-checked="true"]{border-color:var(--mint-d);background:#effaf5}
.opt-btn[aria-pressed="true"] .mk,.opt-btn[aria-checked="true"] .mk{background:var(--mint-d);border-color:var(--mint-d)}
.opt-btn:focus-visible,.btn:focus-visible,textarea:focus-visible,input[type=text]:focus-visible{outline:3px solid #7a8cff;outline-offset:2px}
.other-in{margin:-2px 0 0 34px}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.other-in input{margin-top:0}
textarea{min-height:130px;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--mint-d)}
.nav{display:flex;gap:10px;margin-top:18px;align-items:center}
.btn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:99px;padding:13px 26px;cursor:pointer;min-height:48px;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.btn:active{transform:translateY(3px)}
.btn.next{flex:1;background:var(--pink-d);color:#fff;box-shadow:0 5px 0 #b93a60}
.btn.next:active{box-shadow:0 2px 0 #b93a60}
.btn.next[disabled]{background:#d9dce8;box-shadow:0 5px 0 #bfc3d3;color:#fff;cursor:not-allowed}
.btn.back{background:#fff;color:var(--sub);border:2.5px solid var(--line)}
.btn.skip{background:none;color:var(--sub);text-decoration:underline;padding:10px 8px;min-height:44px}
.err{color:#c23b63;font-weight:700;font-size:13px;margin-top:10px;min-height:1em}
.fine{margin:18px 4px 0;font-size:12px;color:var(--sub);line-height:1.7;text-align:center}
.done{text-align:center}
.done img{width:190px;height:190px;object-fit:contain;animation:hop .9s cubic-bezier(.3,1.6,.5,1) 2}
.done h2{font-size:24px}
.done p{line-height:1.8;font-size:15px;margin:8px 0}
.intro .lead{font-size:16px;line-height:1.85;margin:6px 0 4px}
.intro .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.chip{background:#fff3c9;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fx b{position:absolute;top:-14px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(min-width:760px){.wrap{padding-top:28px}.card{padding:30px 28px 24px}h1,h2{font-size:22px}.guide img{width:128px;height:128px}.guide{min-height:140px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <div class="pg-meta"><span id="pgLeft">1分で終わるよ</span><span id="pgRight"></span></div>
    <div class="bar" role="progressbar" aria-label="進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="bar"></i></div>
  </header>

  <div class="stage">
    <div class="guide" id="guide">
      <img id="mascot" src="assets/hello.png" alt="">
      <div class="say" id="say">こんにちは！</div>
    </div>
    <main id="card" class="card" aria-live="polite"></main>
  </div>
  <p class="fine">お答えは、来年のAIブースの案内づくりにだけ使います。お名前は出さず、個人が分からない形でまとめます。</p>
</div>
<div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function(){
'use strict';
var ENDPOINT='https://docs.google.com/forms/d/e/1FAIpQLSercFRoHwNVK8loWPtox65NnMWlMf7R65jmMV_mFjZR3E0XlQ/formResponse';
var OTHER='__other_option__';

var Q=[
 {id:'q1',n:'1',entry:'entry.1131123567',type:'radio',required:true,
  title:'去年のリベ大フェス、どれにいちばん近いですか？',
  hint:'ひとつ選んでね。',
  mascot:'hello',say:'まずは気軽にひとつ選んでね！',
  opts:['参加した','広報などで関わった','行っていない']},
 {id:'q2',n:'2',entry:'entry.341458006',type:'check',other:true,
  title:'フェスを知ったきっかけは？',hint:'あてはまるものをいくつでも。わからなければスキップでOK！',
  mascot:'think',say:'思い出せる範囲でだいじょうぶ〜',
  opts:['チャットの告知','SNS','知り合いの誘い','当日ふらっと']},
 {id:'q3',n:'3',entry:'entry.2094370008',type:'text',
  title:'「このブース行ってみよう」と決めた、いちばんの決め手は？',hint:'ひとことで十分です。ピンとこなければスキップOK。',
  mascot:'think',say:'ぐっと来た理由、聞きたいな！',ph:'例：写真がかわいかった、友だちに誘われた…'},
 {id:'q4',n:'4',entry:'entry.1911683582',type:'check',other:true,
  title:'こんなお知らせがあったら「行ってみたい！」と思うものは？',hint:'いくつでもOK。直感でポチポチ選んでね。',
  mascot:'walk',say:'ここがいちばん知りたいところ！',
  opts:['AIで作った作品やビフォーアフターが見られる','その場でちょっと体験できる（ミニワーク）','参加した人の声・事例','ショート動画で雰囲気がわかる','「質問だけでもOK」「初心者歓迎」のひとこと','所要時間・時間帯がはっきりしている','先着予約・残り枠のお知らせ','プレゼント・ノベルティ','スタンプラリー・謎解き','キャラクター・マスコットがいる','中の人が話すライブ配信','知り合いからのお誘い','事前にオフィスでミニ体験会']},
 {id:'q5',n:'5',entry:'entry.113263582',type:'check',other:true,
  title:'AIブースで、こんなことができたらうれしい！と思うものは？',hint:'いくつでもOK。',
  mascot:'think',say:'どんな体験なら楽しそう？',
  opts:['自分のスマホでAIを触ってみたい','何から始めたらいいか相談したい','仕事に使えるAIの使い方が知りたい','家事・子育て・暮らしに使えるAIが知りたい','AIで画像・動画・音楽を作ってみたい','ChatGPTなどのAIの違いを知りたい','AIを使っている人の実例が見たい','自分の発信（SNS・ブログ）に使いたい','副業・ビジネスにどう活かすか知りたい','AIの安全な使い方・注意点が知りたい','その場で作ったものを持ち帰りたい','AI好きな仲間とつながりたい']},
 {id:'q6',n:'6',entry:'entry.570980891',type:'area',
  title:'広報を担当した方へ：効いた告知、あまり効かなかった告知があれば教えてください',hint:'担当していない方はスキップでOKです。',
  mascot:'walk',say:'あと少しだよ〜！',ph:'例：チャットでの事前告知は反応がよかった…'},
 {id:'q7',n:'7',entry:'entry.1864798003',type:'radio',
  title:'もう少し詳しく、5〜15分ほどお話を聞かせてもらえますか？',hint:'「はい」の方には、リベのDMでAIブース担当からご連絡します。',
  mascot:'hello',say:'最後の質問だよ！',
  opts:['はい','いいえ']},
 {id:'q8',n:'8',entry:'entry.2059627220',type:'text',showIf:function(a){return a.q7==='はい'},
  title:'リベシティの表示名を教えてください',hint:'DMをお送りするためだけに使います。',
  mascot:'banzai',say:'ありがとう！ほんとに最後！',ph:'リベシティの表示名'}
];

var A={};            // answers: radio/text -> string, check -> {sel:[], other:''}
var idx=-1;          // -1 = intro
var finished=false;
var card=document.getElementById('card');
var mascot=document.getElementById('mascot');
var say=document.getElementById('say');
var topbar=document.getElementById('top');

function visible(){return Q.filter(function(q){return !q.showIf||q.showIf(A)})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function setMascot(name,text,hop){
  mascot.src='assets/'+name+'.png';
  say.textContent=text;
  if(hop){mascot.classList.remove('hop');void mascot.offsetWidth;mascot.classList.add('hop');}
}

function confetti(n){
  var fx=document.getElementById('fx');
  var cols=['#ff9db8','#7fd8bb','#ffd966','#9bb4ff','#ffb27a'];
  for(var i=0;i<n;i++){
    var b=document.createElement('b');
    b.style.left=(Math.random()*100)+'vw';
    b.style.background=cols[i%cols.length];
    b.style.setProperty('--dx',((Math.random()-.5)*160)+'px');
    b.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    b.style.animationDuration=(1.4+Math.random()*1.3)+'s';
    b.style.animationDelay=(Math.random()*.25)+'s';
    fx.appendChild(b);
    (function(el){setTimeout(function(){el.remove()},3200)})(b);
  }
}

function progress(){
  var v=visible();
  var pos=v.indexOf(Q[idx]);
  var total=v.length;
  var left=Math.max(total-pos-1,0);
  var pct=Math.round((pos+1)/(total+1)*100);
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('barWrap').setAttribute('aria-valuenow',pct);
  document.getElementById('pgLeft').textContent='質問 '+(pos+1)+' / '+total;
  document.getElementById('pgRight').textContent=left>0?'あと'+left+'問':'これでおしまい！';
}

function renderIntro(){
  topbar.hidden=true;
  setMascot('hello','はじめまして！案内役のポコだよ',false);
  card.className='card intro';
  card.innerHTML=
   '<span class="qno opt">はじめに</span>'+
   '<h1>AIブースのお知らせ、どんなのだと行きたくなる？</h1>'+
   '<p class="lead">来年のフェスで、AIのブースを出す予定です。<br>どんなお知らせなら「行ってみたい！」となるのか、教えてください。<br>いただいた声は、お名前を出さずにまとめて共有します。</p>'+
   '<div class="chips"><span class="chip">所要 約1分</span><span class="chip">選ぶだけ中心</span><span class="chip">登録いらない</span></div>'+
   '<div class="nav"><button class="btn next" id="start" type="button">はじめる</button></div>';
  document.getElementById('start').onclick=function(){confetti(14);go(0,1)};
}

function render(back){
  var q=Q[idx];
  topbar.hidden=false;
  progress();
  setMascot(q.mascot,q.say,true);
  card.className='card'+(back?' back':'');
  var h='<span class="qno'+(q.required?'':' opt')+'">Q'+q.n+(q.required?'　必須':'　答えられたらでOK')+'</span>'+
        '<h2>'+esc(q.title)+'</h2><p class="hint">'+esc(q.hint||'')+'</p>';
  if(q.type==='radio'){
    h+='<div class="opts" role="radiogroup" aria-label="'+esc(q.title)+'">';
    q.opts.forEach(function(o){h+='<button type="button" class="opt-btn radio" role="radio" aria-checked="'+(A[q.id]===o)+'" data-v="'+esc(o)+'"><span class="mk"></span><span>'+esc(o)+'</span></button>'});
    h+='</div>';
  }else if(q.type==='check'){
    var st=A[q.id]||{sel:[],other:''};
    h+='<div class="opts">';
    q.opts.forEach(function(o){h+='<button type="button" class="opt-btn check" aria-pressed="'+(st.sel.indexOf(o)>-1)+'" data-v="'+esc(o)+'"><span class="mk">'+(st.sel.indexOf(o)>-1?'✓':'')+'</span><span>'+esc(o)+'</span></button>'});
    var on=st.sel.indexOf(OTHER)>-1;
    h+='<button type="button" class="opt-btn check" aria-pressed="'+on+'" data-v="'+OTHER+'"><span class="mk">'+(on?'✓':'')+'</span><span>その他</span></button>';
    h+='<div class="other-in" '+(on?'':'hidden')+'><input type="text" id="oth" maxlength="300" placeholder="自由に書いてね" value="'+esc(st.other||'')+'" aria-label="その他の内容"></div>';
    h+='</div>';
  }else if(q.type==='text'){
    h+='<input type="text" id="txt" maxlength="200" placeholder="'+esc(q.ph||'')+'" value="'+esc(A[q.id]||'')+'" aria-label="'+esc(q.title)+'">';
  }else{
    h+='<textarea id="txt" maxlength="2000" placeholder="'+esc(q.ph||'')+'" aria-label="'+esc(q.title)+'">'+esc(A[q.id]||'')+'</textarea>';
  }
  var v=visible(), last=(v.indexOf(q)===v.length-1) || (q.id==='q7' && A.q7!=='はい');
  h+='<div class="err" id="err" role="alert"></div>';
  h+='<div class="nav">'+(idx>0?'<button type="button" class="btn back" id="bk">もどる</button>':'')+
     '<button type="button" class="btn next" id="nx">'+(last?'送信する':'つぎへ')+'</button></div>';
  if(!q.required&&q.id!=='q7'){h+='<div style="text-align:center"><button type="button" class="btn skip" id="sk">スキップ</button></div>'}
  card.innerHTML=h;
  wire(q,last);
}

function wire(q,last){
  var nx=document.getElementById('nx');
  var bk=document.getElementById('bk');
  var sk=document.getElementById('sk');
  function refresh(){ if(q.required){nx.disabled=!A[q.id]} }
  refresh();
  if(q.type==='radio'){
    card.querySelectorAll('.opt-btn').forEach(function(b){
      b.onclick=function(){
        A[q.id]=b.getAttribute('data-v');
        card.querySelectorAll('.opt-btn').forEach(function(x){x.setAttribute('aria-checked',x===b)});
        setMascot(q.mascot,'ありがとう！',true);
        confetti(8);
        refresh();
        if(q.id==='q1'){setTimeout(function(){advance(q)},380)}
        if(q.id==='q7'){nx.textContent=(A.q7==='はい')?'つぎへ':'送信する'}
      };
    });
  }else if(q.type==='check'){
    var oth=document.getElementById('oth');
    card.querySelectorAll('.opt-btn').forEach(function(b){
      b.onclick=function(){
        var st=A[q.id]||(A[q.id]={sel:[],other:''});
        var v=b.getAttribute('data-v'), i=st.sel.indexOf(v);
        if(i>-1)st.sel.splice(i,1);else st.sel.push(v);
        var on=st.sel.indexOf(v)>-1;
        b.setAttribute('aria-pressed',on);
        b.querySelector('.mk').textContent=on?'✓':'';
        if(on)mascot.classList.remove('hop'),void mascot.offsetWidth,mascot.classList.add('hop');
        if(v===OTHER){var box=card.querySelector('.other-in');box.hidden=!on;if(on)oth.focus()}
      };
    });
    oth.oninput=function(){(A[q.id]||(A[q.id]={sel:[],other:''})).other=oth.value};
  }else{
    var t=document.getElementById('txt');
    t.oninput=function(){A[q.id]=t.value};
    if(q.type==='text')t.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();nx.click()}};
  }
  nx.onclick=function(){advance(q)};
  if(bk)bk.onclick=function(){back()};
  if(sk)sk.onclick=function(){
    if(q.type==='check')delete A[q.id]; else delete A[q.id];
    advance(q);
  };
}

function nextIndex(from){
  for(var i=from+1;i<Q.length;i++){if(!Q[i].showIf||Q[i].showIf(A))return i}
  return -1;
}
function advance(q){
  if(q.required&&!A[q.id]){document.getElementById('err').textContent='ひとつ選んでね';return}
  var n=nextIndex(idx);
  if(n<0){submit();return}
  go(n,1);
  confetti(6);
}
function back(){
  for(var i=idx-1;i>=0;i--){if(!Q[i].showIf||Q[i].showIf(A)){go(i,-1);return}}
  idx=-1;renderIntro();
}
function go(i,dir){idx=i;render(dir<0);window.scrollTo({top:0,behavior:'smooth'})}

// ---- 送信 ----
function buildParams(){
  var p=new URLSearchParams();
  Q.forEach(function(q){
    if(q.showIf&&!q.showIf(A))return;
    var a=A[q.id];
    if(q.type==='check'){
      if(!a)return;
      a.sel.forEach(function(v){
        p.append(q.entry,v);
        if(v===OTHER)p.append(q.entry+'.other_option_response',a.other||'');
      });
    }else if(a&&String(a).trim()!==''){
      p.append(q.entry,a);
    }
  });
  p.append('pageHistory','0');
  return p;
}
window.__buildParams=buildParams;       // 検証用
window.__send=function(url,params){     // 検証時はここを差し替える
  return fetch(url,{method:'POST',mode:'no-cors',body:params});
};

function submit(){
  if(finished)return;
  finished=true;
  var params=buildParams();
  var nx=document.getElementById('nx'); if(nx){nx.disabled=true;nx.textContent='送信中…'}
  var p;
  try{p=Promise.resolve(window.__send(ENDPOINT,params))}catch(e){p=Promise.reject(e)}
  p.then(renderDone,function(){
    finished=false; if(nx){nx.disabled=false;nx.textContent='送信する'}
    var er=document.getElementById('err'); if(er)er.textContent='うまく送れませんでした。電波のよいところでもう一度おしてね。';
  });
}

function renderDone(){
  topbar.hidden=false;
  document.getElementById('bar').style.width='100%';
  document.getElementById('barWrap').setAttribute('aria-valuenow',100);
  document.getElementById('pgLeft').textContent='ぜんぶ完了！';
  document.getElementById('pgRight').textContent='';
